      if(!/^([01]?\d|2[0-3]):[0-5]\d$/.test(tm)){ sheetSay("Type the time as 10:35.", true); return; }
      if(tm.length === 4) tm = "0" + tm;
      var nm = String($("stName").value || "").replace(/\s+/g, " ").trim();
      if(nm.length < 2){ sheetSay("Type the stop's name.", true); return; }
      /* Spacing and capitals are not a change: a new postcode clears the pin. */
      var pcKey = function(p){ return String(p || "").toUpperCase().replace(/\s+/g, ""); };
      var flat = function(t){ return String(t || "").replace(/\s+/g, " ").trim(); };
      var typed = flat($("stPost").value);
      var pc = pcKey(typed);
      var pcNew = add || typed !== flat(v.postcode);
      if(pcNew && pc && !/^[A-Z]{1,2}\d[A-Z\d]?\d[A-Z]{2}$/.test(pc)){ sheetSay("Check the postcode.", true); return; }
      if(pc) pc = pc.slice(0, -3) + " " + pc.slice(-3);
      var wh = flat($("stWhere").value);
      var set = {};
      if(add) set.route = pick.route;
      if(add || tm !== v.time) set.time = tm;
      if(add || nm !== flat(v.stop)) set.stop = nm;
      if(pcNew) set.postcode = pc;
      if(add || wh !== flat(v.where)) set.where = wh;
      if(add || pick.type !== v.type) set.type = pick.type;
      if(!add && (pick.active === "YES") !== v.active) set.active = pick.active === "YES";
      if(!add && !Object.keys(set).length){ sheetSay("Nothing has changed.", true); return; }
      act({ kind: "stop", stopId: add ? "" : x.id, add: add, set: set });
    } });
  [["stRoute", "route"], ["stType", "type"], ["stActive", "active"]].forEach(function(f){
    Array.prototype.forEach.call(document.querySelectorAll("#" + f[0] + " button"), function(b){
      b.onclick = function(){
        pick[f[1]] = b.getAttribute("data-v");
        Array.prototype.forEach.call(document.querySelectorAll("#" + f[0] + " button"), function(y){ y.classList.toggle("on", y === b); });
        if(!busy) sheetSay("");
      };
    });
  });
}

/* Every step a defect has been through, off the sheet's History tab, from
   v1.92.0: who set which status and when, and a reopening with the day it

function trailHTML(trail){

    trail.map(function(t){

      var tail = /^Defect reopened/.test(String(t.what || "")) ? "Reopened" : String(t.what || "").split(" \u2014 ")[1];
      /* The why, unless it only says where, which the line under it says. */

/* ---- buses: their dates, their log, the jobs to arrange ------------------------

   From v1.89.0. Every MOT, service, renewal, repair or booking recorded here
   goes on the sheet's Vehicle Log as a row of its own, and the Buses tab's
   date moves with a line on History saying what it was before. Nothing is
   typed over: a mistake is put right with a correction, which is a new row
   that names the one it corrects. */

/* When each renewal next falls due. The same rules as rnNextDue in worker.js
   and Code.gs, here so the date shows before Save; the live server works it
   out again and its answer is the one kept. tests/suites/36-vehicle-log.mjs
   holds the three together. */
var RENEWALS = {
  mot:       { label: "MOT",            column: "MOT due" },
  service:   { label: "Service",        column: "Service due" },
  insurance: { label: "Insurance",      column: "Insurance due" },
  permit:    { label: "Parking permit", column: "Permit due" }
};
var RENEW_KEYS = ["mot", "service", "insurance", "permit"];
var VLOG_WHAT = ["MOT", "Service", "Insurance", "Parking permit", "Repair", "Tyres", "Other"];
var VLOG_ITEM = { "MOT": "mot", "Service": "service", "Insurance": "insurance", "Parking permit": "permit" };

function rnParts(k){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(k || ""));
  return m ? { y: +m[1], m: +m[2], d: +m[3] } : null;
}
function rnKey(y, m, d){
  var t = new Date(Date.UTC(y, m - 1, d));
  return t.getUTCFullYear() + "-" + ("0" + (t.getUTCMonth() + 1)).slice(-2) + "-" + ("0" + t.getUTCDate()).slice(-2);
}
function rnAddMonths(k, n){
  var p = rnParts(k);
  if(!p) return "";
  var idx = p.y * 12 + (p.m - 1) + n;
  var y = Math.floor(idx / 12), m = idx - y * 12 + 1;
  var last = new Date(Date.UTC(y, m, 0)).getUTCDate();
  return rnKey(y, m, Math.min(p.d, last));
}
function rnAddDays(k, n){
  var p = rnParts(k);
  return p ? rnKey(p.y, p.m, p.d + n) : "";
}
function rnYearLessDay(k){
  var p = rnParts(k);
  return p ? rnAddDays(rnKey(p.y + 1, p.m, p.d), -1) : "";
}
function rnDays(a, b){
  var x = rnParts(a), y = rnParts(b);
  if(!x || !y) return null;
  return Math.round((Date.UTC(y.y, y.m - 1, y.d) - Date.UTC(x.y, x.m - 1, x.d)) / 86400000);
}
function rnNextDue(item, done, was, given){
  if(!RENEWALS[item] || !rnParts(done)) return { next: "", how: "" };
  if(rnParts(given)){
    return { next: given, how: item === "mot" ? "the date on the certificate" : "the date given" };
  }
  var prior = rnParts(was) ? was : "";
  if(item === "service") return { next: rnAddMonths(done, 12), how: "twelve months from the day it was done" };
  if(item === "mot"){
    if(prior && done <= prior && done >= rnAddDays(rnAddMonths(prior, -1), 1)){
      return { next: rnAddMonths(prior, 12), how: "kept its date: tested within a month of running out" };
    }
    var next = rnYearLessDay(done);
    if(!prior) return { next: next, how: "a year from the test, less a day" };
    return { next: next, how: done > prior ? "a year from the test, less a day: tested after it ran out"
                                           : "a year from the test, less a day: tested more than a month early" };
  }
  if(prior && done <= prior && done >= rnAddMonths(prior, -2)){
    return { next: rnAddMonths(prior, 12), how: "a year on from the old expiry" };
  }
  return { next: rnAddMonths(done, 12), how: !prior ? "twelve months from the renewal"
                                          : done > prior ? "twelve months from the renewal: it had lapsed"
                                          : "twelve months from the renewal: more than two months before the old one ran out" };
}

/* Whether a service done on done may be lined up with an MOT due on mot:
   only one six to thirteen months off. The live server's lineUpOk. Not
   offered on the form from v1.90.0: an MOT and a service done together are
   each recorded, and a date that moves is put right by hand. Kept so the
   three copies of the rules stay one. */
function lineUpOk(done, mot){
  return !!(rnParts(done) && rnParts(mot) && mot > rnAddMonths(done, 6) && mot <= rnAddMonths(done, 13));
}

/* 17/06/2027, as the tabs write a day; and Thu 17 Jun 2027 for a date a
   year off, where the day of the week alone would not do. */
function ukDay(key){ var p = rnParts(key); return p ? ("0"+p.d).slice(-2) + "/" + ("0"+p.m).slice(-2) + "/" + p.y : ""; }
function yearDay(key){ var p = parts(key); return p ? DAYS[p.dow] + " " + p.d + " " + MONS[p.mo-1] + " " + p.y : ""; }
function calToday(){ return (D && (D.londonToday || D.today)) || ""; }
function dayCount(n){ return n + (n === 1 ? " day" : " days"); }

/* How far off a due date is, in words, and how loudly to say it. */
function dueWords(key){
  var n = rnDays(calToday(), key);
  if(n === null) return { tone: "", words: "No date on the Buses tab" };
  if(n < 0) return { tone: "late", words: dayCount(-n) + " overdue" };
  if(n === 0) return { tone: "late", words: "Due today" };
  if(n <= 30) return { tone: "soon", words: "In " + dayCount(n) };
  if(n <= 60) return { tone: "", words: "In " + n + " days" };
  return { tone: "", words: "In about " + Math.round(n / 30.44) + " months" };
}
/* An entry's lateness against the date it had been due. */
function lateWords(early){
  if(early === null || early === undefined || early === "") return "";
  var n = Number(early);
  if(!isFinite(n)) return "";
  return n === 0 ? "on the day it was due" : n > 0 ? dayCount(n) + " late" : dayCount(-n) + " early";
}

function busList(){ return (D && D.buses) || []; }
function busByReg(reg){ var b = busList(); for(var i=0;i<b.length;i++) if(same(b[i].reg, reg)) return b[i]; return null; }
function logOf(reg){
  var v = (D && D.vehicles && D.vehicles.log) || {};
  for(var k in v) if(Object.prototype.hasOwnProperty.call(v, k) && same(k, reg)) return v[k] || [];
  return [];
}
function jobsOf(reg){
  var v = (D && D.vehicles && D.vehicles.jobs) || {};
  for(var k in v) if(Object.prototype.hasOwnProperty.call(v, k) && same(k, reg)) return v[k];
  return null;
}
function defectsOf(reg){ return ((D && D.defects) || []).filter(function(d){ return same(d.reg, reg); }); }
function milesOf(reg){
  var v = (D && D.lastMiles) || {};
  for(var k in v) if(Object.prototype.hasOwnProperty.call(v, k) && same(k, reg)) return v[k];
  return null;
}
/* The latest standing entry that set one renewal's date. */
function latestDone(reg, item){
  var best = null;
  logOf(reg).forEach(function(x){
    if(x.correctedBy || x.status === "Withdrawn" || VLOG_ITEM[x.what] !== item || !x.done) return;
    if(["Done", "Estimated", "Correction"].indexOf(x.status) === -1) return;
    if(!best || x.done > best.done) best = x;
  });
  return best;
}
function entryById(reg, id){ var l = logOf(reg); for(var i=0;i<l.length;i++) if(l[i].id === id) return l[i]; return null; }

function dueRows(b){
  return RENEW_KEYS.map(function(item){
    var key = (b.dates || {})[item] || "";
    var w = dueWords(key);
    var last = latestDone(b.reg, item);
    return '<span class="due"><b>' + esc(RENEWALS[item].label) + '</b>' +
           '<span class="when ' + w.tone + '">' + esc(key ? ukDay(key) : "Not set") + '</span>' +
           '<small><span class="' + w.tone + '">' + esc(key ? w.words : "No date on the Buses tab") + '</span>' +
           (last ? ' · last done ' + esc(ukDay(last.done)) + (last.status === "Estimated" ? " (estimated)" : "") : '') +
           '</small></span>';
  }).join("");
}

function paintBuses(){
  /* A live server from before w2.35.0 cannot take a change to a bus. */
  var h = (D && D.busEdits) ? '<button class="btn btn-main btn-wide" type="button" data-do="addbus">Add a bus</button>' : '';
  var list = busList().slice().sort(function(a, b){ return (b.active ? 1 : 0) - (a.active ? 1 : 0) || String(a.reg).localeCompare(String(b.reg)); });

         '<span class="bus-head"><span class="plate">' + esc(b.reg) + '</span>' +
         (b.active ? '' : '<span class="tag">Not in use</span>') +
         (b.waiting ? '<span class="tag info">To the sheet</span>' : '') +
         (jn ? '<span class="tag warn">' + esc(jn === 1 ? "1 job" : jn + " jobs") + '</span>' : '') +
         (dn ? '<span class="tag warn">' + esc(dn === 1 ? "1 defect" : dn + " defects") + '</span>' : '') +
         '<span class="go">›</span></span>' + dueRows(b) + '</button>';
  });
  $("busesBody").innerHTML = h;

function entryHTML(reg, x){
  var gone = !!x.correctedBy || x.status === "Withdrawn";
  var tag = x.status === "Booked" ? '<span class="tag info">Booked</span>'
          : x.status === "Estimated" ? '<span class="tag">Estimated</span>'
          : x.status === "Correction" ? '<span class="tag info">Correction</span>'
          : x.status === "Withdrawn" ? '<span class="tag stop">Withdrawn</span>' : '';
  var lines = [];
  if(x.status === "Booked") lines.push("Booked for " + yearDay(x.bookedFor));
  else if(x.done) lines.push("Done " + yearDay(x.done) + (x.was ? ", " + lateWords(x.early) + " (was due " + ukDay(x.was) + ")" : ""));
  if(x.next) lines.push("Next due " + ukDay(x.next));
  var facts = [];
  if(x.garage) facts.push(x.garage);
  if(x.miles !== null && x.miles !== undefined && x.miles !== "") facts.push(Number(x.miles).toLocaleString("en-GB") + " miles");
  if(x.cost !== null && x.cost !== undefined && x.cost !== "") facts.push("£" + Number(x.cost).toFixed(2));
  if(facts.length) lines.push(facts.join(" · "));
  if(x.defects) lines.push("Put right: " + x.defects);
  var h = '<div class="vlog' + (gone ? ' gone' : '') + '"><div class="vlog-head"><b>' + esc(x.what) + '</b>' + tag +
          (x.correctedBy ? '<span class="tag">Corrected</span>' : '') + '</div>' +
          lines.map(function(l){ return '<p>' + esc(l) + '</p>'; }).join("") +
          (x.notes ? '<p class="did">' + esc(x.notes) + '</p>' : '');
  h += '<div class="vlog-foot"><p class="tiny">' + esc([x.by, x.source, x.recorded ? when(x.recorded) : ""].filter(Boolean).join(", ")) + '</p>' +
       (x.waiting ? '<span class="tag info">To the sheet</span>' : '');
  if(!gone && !x.waiting && x.id){
    if(x.status === "Booked") h += '<button class="mini" type="button" data-do="vlogdone" data-reg="' + esc(reg) + '" data-id="' + esc(x.id) + '">Done</button>';
    h += '<button class="mini" type="button" data-do="vfix" data-reg="' + esc(reg) + '" data-id="' + esc(x.id) + '">Correct</button>';
  }
  return h + '</div></div>';
}

  $("busBody").innerHTML = h;

/* ---- a bus changed or added: the Buses tab, from v1.93.0 -------------------

   Seats, Active, Route in odd months and Notes, and a new bus. The due dates
   are recorded with Record something. */

/* The bus that gives up its route in odd months when this one takes it, and
   what it gets instead. The live server works it out the same way. */
function busSwaps(reg, was, nowActive, nowRoute, routeSet){
  if(!nowActive || !nowRoute || !(routeSet || (nowActive && !was.active))) return [];
  var back = was.active && was.oddRoute && was.oddRoute !== nowRoute ? was.oddRoute : "";
  var key = function(r){ return String(r || "").toUpperCase().replace(/\s+/g, ""); };
  return busList().filter(function(y){ return key(y.reg) !== key(reg) && y.active && y.oddRoute === nowRoute; })
                  .map(function(y){ return { reg: y.reg, oddRoute: back }; });
}
function editBus(reg){
  var x = reg ? busByReg(reg) : null;
  if(reg && !x) return;
  var add = !x;
  var v = add ? { seats: "", active: true, oddRoute: "", notes: "" }
              : { seats: x.seats || "", active: x.active, oddRoute: x.oddRoute || "", notes: x.notes || "" };
  var pick = { active: v.active ? "YES" : "NO", oddRoute: v.oddRoute || "-" };
  var chips = function(id, opts, on){
    return '<div class="chips" id="' + id + '">' + opts.map(function(o){
      return '<button type="button" data-v="' + esc(o[0]) + '" class="' + (o[0] === on ? 'on' : '') + '">' + esc(o[1]) + '</button>';
    }).join("") + '</div>';
  };
  var regOf = function(){ return add ? String($("buReg").value || "").toUpperCase().replace(/\s+/g, " ").trim() : x.reg; };
  var swaps = function(){
    var was = add ? { active: false, oddRoute: "" } : { active: x.active, oddRoute: x.oddRoute || "" };
    var route = pick.oddRoute === "-" ? "" : pick.oddRoute, on = pick.active === "YES";
    return busSwaps(regOf(), was, on, route, add || route !== was.oddRoute || on !== was.active);
  };
  var show = function(){
    var l = swaps(), el = $("buSwap");
    if(!el) return;
    el.hidden = !l.length;
    el.textContent = l.map(function(o){ return o.reg + ": " + (o.oddRoute ? o.oddRoute + " in odd months" : "standby") + "."; }).join(" ");
  };
  openSheet({ eyebrow: add ? "New bus" : "Bus", title: add ? "Add a bus" : x.reg,
    body: (add ? '<div class="field"><label for="buReg">Registration</label><input id="buReg" maxlength="10" autocomplete="off" autocapitalize="characters"></div>' : '') +
          '<div class="field"><label for="buSeats">Seats for passengers</label><input id="buSeats" type="number" inputmode="numeric" min="1" max="50" value="' + esc(String(v.seats)) + '"></div>' +
          '<p class="tiny" style="margin:0 0 4px">Active</p>' + chips("buActive", [["YES", "In use"], ["NO", "Not in use"]], pick.active) +
          '<p class="tiny" style="margin:0 0 4px">Route in odd months</p>' + chips("buRoute", [["North", "North"], ["South", "South"], ["-", "Standby"]], pick.oddRoute) +
          '<p class="preview" id="buSwap" hidden></p>' +
          (x && x.noNotes ? '' : '<div class="field"><label for="buNotes">Notes</label><textarea id="buNotes" maxlength="500">' + esc(v.notes) + '</textarea></div>'),
    go: add ? "Add" : "Save",
    onGo: function(){
      var r = regOf();
      if(add && !/^[A-Z0-9][A-Z0-9 ]{1,9}$/.test(r)){ sheetSay("Type the registration, letters and numbers only.", true); return; }
      var st = String($("buSeats").value || "").trim(), n = Number(st);
      if(!st || !(n >= 1 && n <= 50 && Math.floor(n) === n)){ sheetSay("Seats is a number from 1 to 50.", true); return; }
      var route = pick.oddRoute === "-" ? "" : pick.oddRoute, on = pick.active === "YES";
      var set = {};
      if(add || n !== (Number(v.seats) || 0)) set.seats = n;
      if(add || on !== v.active) set.active = on;
      if(add || route !== v.oddRoute) set.oddRoute = route;
      if($("buNotes")){
        var nt = String($("buNotes").value || "").replace(/\r\n?/g, "\n").trim();
        if(add || nt !== String(v.notes).trim()) set.notes = nt;
      }
      if(!add && !Object.keys(set).length){ sheetSay("Nothing has changed.", true); return; }
      act({ kind: "bus", reg: r, add: add, set: set });
    } });
  [["buActive", "active"], ["buRoute", "oddRoute"]].forEach(function(f){
    Array.prototype.forEach.call(document.querySelectorAll("#" + f[0] + " button"), function(b){
      b.onclick = function(){
        pick[f[1]] = b.getAttribute("data-v");
        Array.prototype.forEach.call(document.querySelectorAll("#" + f[0] + " button"), function(y){ y.classList.toggle("on", y === b); });
        if(!busy) sheetSay("");
        show();
      };
    });
  });
  if($("buReg")) $("buReg").oninput = show;
  show();
}

/* ---- recording one -------------------------------------------------------- */

var VL = null;          /* what the open Record form has chosen */

function givenLabel(item){
  return item === "mot" ? "Expiry date on the certificate"
       : item === "insurance" ? "Date the new policy runs to"
       : item === "permit" ? "Date the new permit runs to" : "Next service due";
}
function numIn(v){
  var t = String(v == null ? "" : v).replace(/[£,\s]/g, "");
  if(!t) return "";
  var n = Number(t);
  return isFinite(n) && n >= 0 ? n : NaN;
}

/* The Record form. from, a Booked entry the form starts from: what it was,
   and its day if that has come. */
function recordFor(reg, from){
  var b = busByReg(reg); if(!b) return;
  var today = calToday();
  VL = { reg: b.reg, what: from ? from.what : "", status: "Done" };
  var m = milesOf(b.reg);
  /* One tick per fault, from v1.90.0, closing every report of it. */
  var defs = defectGroups(defectsOf(b.reg));
  var startDay = from && from.bookedFor && from.bookedFor <= today ? from.bookedFor : today;
  openSheet({ eyebrow: b.reg, title: "Record something",
    body: '<div class="chips" id="vlWhat">' + VLOG_WHAT.map(function(w){

/* What the form says as it is filled: the date the bus will have. */
function recordShow(b){
  if(!VL) return;
  var item = VLOG_ITEM[VL.what] || "", done = VL.status === "Done";
  var day = $("vlDay").value, given = item && done ? $("vlGiven").value : "";
  var was = (b.dates || {})[item] || "";
  $("vlDoneF").hidden = !done;
  $("vlBookF").hidden = done;
  $("vlGivenF").hidden = !(item && done);
  if(item) $("vlGivenL").textContent = givenLabel(item);
  var defs = $("vlDefs"); if(defs) defs.hidden = !done;
  var p = $("vlNext");
  if(!done){
    p.hidden = true;
    return;
  }
  if(!item || !rnParts(day)){ p.hidden = true; return; }
  var nd = rnNextDue(item, day, was, given);
  var late = was ? rnDays(was, day) : null;
  p.hidden = false;
  p.textContent = (was ? "It was due " + ukDay(was) + (late !== null ? ": " + lateWords(late) + ". " : ". ") : "") +
                  "Next due " + ukDay(nd.next) + ".";
}

function recordSend(b){
  if(!VL.what){ sheetSay("Choose what it was.", true); return; }
  var today = calToday(), done = VL.status === "Done", item = VLOG_ITEM[VL.what] || "";
  var a = { kind: "vlog", reg: b.reg, what: VL.what, status: VL.status };
  if(done){
    a.done = $("vlDay").value || today;
    if(a.done > today){ sheetSay("That day has not come yet.", true); return; }
    if(item) a.given = $("vlGiven").value || "";
    var groups = defectGroups(defectsOf(b.reg));
    a.defects = [].concat.apply([], Array.prototype.map.call(document.querySelectorAll("#vlDefs input[data-defg]:checked"), function(x){
      var g = groups[Number(x.getAttribute("data-defg"))]; return g ? g.keys : []; }));
  } else {
    a.bookedFor = $("vlFor").value || "";
    if(!a.bookedFor){ sheetSay("Say the day it is booked for.", true); return; }
    if(a.bookedFor < today){ sheetSay("That day has gone.", true); return; }
  }
  var miles = numIn($("vlMiles").value), cost = numIn($("vlCost").value);
  if(miles !== miles){ sheetSay("The mileage is not a number of miles.", true); return; }
  if(cost !== cost){ sheetSay("The cost is not an amount in pounds.", true); return; }
  a.miles = miles; a.cost = cost;
  a.garage = $("vlGarage").value || "";
  a.notes = $("vlNotes").value || "";
  act(a);
}

/* ---- putting one right -------------------------------------------------------
   Correct: the entry as it should have been, and a new next due date from
   it. Withdraw: it should never have been recorded, and the bus goes back to
   the date it had before it. Either way the entry stays on the log, struck
   through, beside the one that corrects it. */
function correctEntry(reg, id){
  var b = busByReg(reg), x = entryById(reg, id);
  if(!b || !x) return;
  var mode = "fix";
  var booking = x.status === "Booked";
  var item = VLOG_ITEM[x.what] || "";
  openSheet({ eyebrow: b.reg + " · " + x.what, title: "Put this entry right",
    line: booking ? "Booked for " + ukDay(x.bookedFor) + "." : x.done ? "Done " + ukDay(x.done) + (x.next ? ", next due " + ukDay(x.next) : "") + "." : "",
    body: '<div class="chips" id="vfMode"><button type="button" data-m="fix" class="on">Correct it</button><button type="button" data-m="withdraw">Withdraw it</button></div>' +
          '<div id="vfFix">' +
          (booking ? '<div class="field"><label for="vfFor">Booked for</label><input type="date" id="vfFor" value="' + esc(x.bookedFor) + '"></div>'
                   : '<div class="field"><label for="vfDay">Day it was done</label><input type="date" id="vfDay" value="' + esc(x.done) + '" max="' + esc(calToday()) + '"></div>' +
                     (item ? '<div class="field"><label for="vfGiven">' + esc(givenLabel(item)) + '</label><input type="date" id="vfGiven" value="' + esc(x.given || "") + '"></div>' : '') +
                     '<p class="preview" id="vfNext" hidden></p>') +
          '<div class="two"><div class="field"><label for="vfMiles">Mileage</label><input id="vfMiles" inputmode="numeric" autocomplete="off" value="' + esc(x.miles == null ? "" : x.miles) + '"></div>' +
          '<div class="field"><label for="vfCost">Cost (£)</label><input id="vfCost" inputmode="decimal" autocomplete="off" value="' + esc(x.cost == null ? "" : x.cost) + '"></div></div>' +
          '<div class="field"><label for="vfGarage">Garage</label><input id="vfGarage" maxlength="80" autocomplete="off" value="' + esc(x.garage || "") + '"></div>' +
          '</div>' +
          '<div class="field"><label for="vfWhy">Why</label><textarea id="vfWhy" maxlength="300"></textarea></div>',
    go: "Correct it",
    onGo: function(){
      var a = { kind: "vfix", corrects: x.id, why: $("vfWhy").value || "" };
      if(mode === "withdraw"){ a.withdraw = true; act(a); return; }
      if(booking){
        a.bookedFor = $("vfFor").value || x.bookedFor;
      } else {
        a.done = $("vfDay").value || x.done;
        if(a.done > calToday()){ sheetSay("That day has not come yet.", true); return; }
        if(item) a.given = $("vfGiven").value || "";
      }
      var miles = numIn($("vfMiles").value), cost = numIn($("vfCost").value);
      if(miles !== miles){ sheetSay("The mileage is not a number of miles.", true); return; }
      if(cost !== cost){ sheetSay("The cost is not an amount in pounds.", true); return; }
      a.miles = miles; a.cost = cost;
      a.garage = $("vfGarage").value || "";
      act(a);
    } });
  var show = function(){
    $("vfFix").hidden = mode === "withdraw";
    $("sheetGo").textContent = mode === "withdraw" ? "Withdraw it" : "Correct it";
    $("sheetGo").className = "btn " + (mode === "withdraw" ? "btn-stop" : "btn-main");
    var p = $("vfNext");
    if(!p) return;
    var day = $("vfDay").value, given = $("vfGiven") ? $("vfGiven").value : "";
    var nd = item && rnParts(day) ? rnNextDue(item, day, x.was || "", given) : { next: "" };
    p.hidden = !nd.next;
    if(nd.next) p.textContent = "Next due " + ukDay(nd.next) + ".";
  };
  Array.prototype.forEach.call(document.querySelectorAll("#vfMode button"), function(bt){
    bt.onclick = function(){
      mode = bt.getAttribute("data-m");
      Array.prototype.forEach.call(document.querySelectorAll("#vfMode button"), function(y){ y.classList.toggle("on", y === bt); });
      if(!busy) sheetSay("");
      show();
    };
  });
  ["vfDay", "vfGiven"].forEach(function(id){ var el = $(id); if(el){ el.onchange = show; el.oninput = show; } });
  show();
}

/* ---- the run record -------------------------------------------------------------- */

function lastSunday(){
  var t = D.londonToday || D.today;
  var p = parts(t);
  return (p && p.dow === 0) ? t : plusWeeks(D.today, -1);
}

function loadRuns(key){
  RUNS.loading = key || "-";
  api("runs", { sunday:key }).then(function(out){
    if(RUNS.loading !== (key || "-")) return;
    RUNS.loading = "";
    if(!out || !out.ok){ $("runsBody").innerHTML = '<div class="card"><p class="say bad">'+esc(plain(out && out.error) || "No answer.")+'</p></div>'; return; }
    RUNS = { sunday:out.sunday, data:out };
    var c = current();
    if(c.name === "runs") paintRuns(out.sunday);
  }, function(){ RUNS.loading = ""; });
}

function paintRuns(key){
  key = key || lastSunday();
  var h = '';
  if(!RUNS.data || RUNS.sunday !== key){
    $("runsBody").innerHTML = h + '<p class="tiny center">Loading…</p>';
    if(RUNS.loading !== key) loadRuns(key);
    return;
  }
  var r = RUNS.data;
  var days = (r.recent || []).slice(0, 5);
  if(days.indexOf(key) === -1) days.unshift(key);
  h += '<div class="chips stick">' + days.map(function(k){
    return '<button type="button" class="'+(k === key ? 'on' : '')+'" data-go="runs/'+esc(k)+'">'+esc(shortDay(k))+'</button>';
  }).join("") + '</div>';
  var any = false;
  r.routes.forEach(function(rt){
    rt.runs.forEach(function(run){
      any = true;
      h += '<div class="card"><div class="bk-head"><b>'+esc(rt.route)+'</b>' +
           (run.reg ? '<span class="plate">'+esc(run.reg)+'</span>' : '') + '</div>' +
           '<p class="tiny" style="margin:2px 0 4px">'+esc(run.driver || "")+
             (run.endedBy && !same(run.endedBy, run.driver) ? ', ended by ' + esc(run.endedBy) : '')+'</p>';
      h += evRow("Left church", "", run.start, run, "start");
      run.stops.forEach(function(s){ h += evRow(s.stop, s.time, s.ev, run, s.id, s); });
      h += evRow("Back at church", "", run.end, run, "end");
      h += '</div>';
    });
  });
  if(!any) h += '<div class="card"><p class="tiny" style="margin:0">No run recorded for '+esc(longDay(key))+'.</p></div>';
  $("runsBody").innerHTML = h;
}

/* One line of the record. st is the stop, for a pickup: its number, the seats
   booked there that Sunday, and the name it had then if it has another now.
   From v1.90.0 an untapped stop says which of two things it is. With seats
   booked and no tap, the driver was asked and nothing was marked: amber,
   with Add. With nobody booked the driver app asks for no tap at all, so
   nothing is missing: grey, and Add stays, small, for somebody who turned up
   and was not noted. A live server from before w2.31.0 sends no booked
   figure, and every untapped stop reads as it always did. */
function evRow(label, tt, ev, run, stopId, st){
  var fixable = !!ev || (stopId !== "start" && stopId !== "end");
  var late = ev && ev.off !== null && ev.off !== undefined && Number(ev.off) > 2;
  var known = !!st && st.booked !== undefined;
  var missed = !ev && known && st.booked > 0, quiet = !ev && known && !st.booked;
  var full = st ? st.id + " \u00B7 " + label : label;
  var btn = !fixable ? '' : '<button class="mini'+(quiet ? ' quiet' : '')+'" type="button" data-do="fix" data-trip="'+esc(run.trip)+'" data-stop="'+esc(stopId)+'"' +
            (ev ? ' data-ev="'+ev.id+'"' : '') + ' data-label="'+esc(full)+'" data-tt="'+esc(tt)+'">'+(ev ? 'Fix' : 'Add')+'</button>';
  var why = ev ? ((ev.event === "empty" || ev.event === "none") ? '<small>nobody there</small>' : '')
          : missed ? '<small class="why">'+esc(seatWords(st.booked))+' booked, not marked</small>'
          : quiet ? '<small>nobody booked</small>' : '<small>not marked</small>';
  return '<div class="ev'+(ev ? '' : ' miss')+(missed ? ' missed' : '')+(quiet ? ' quiet' : '')+'"><span class="tm">'+esc(tt)+'</span>' +
         '<span class="nm">'+(st ? sid(st.id) : '')+esc(label)+(ev && ev.corrected ? ' <span class="tag info">Corrected</span>' : '')+
           (st && st.then ? '<span class="then">was '+esc(st.then)+'</span>' : '')+why+'</span>' +
         '<span class="at'+(late ? ' late' : '')+'">'+(ev ? esc(hhmm(ev.at)) + (offWords(ev.off) ? '<small>'+esc(offWords(ev.off))+'</small>' : '') : '–')+'</span>' +
         '<span>'+btn+'</span></div>';
}

function fixTime(el){
  var ev = el.getAttribute("data-ev"), trip = el.getAttribute("data-trip"), stop = el.getAttribute("data-stop");
  var label = el.getAttribute("data-label"), tt = el.getAttribute("data-tt");
  var key = RUNS.sunday, rec = null;
  if(ev){
    (RUNS.data.routes || []).forEach(function(rt){ rt.runs.forEach(function(run){
      [run.start, run.end].concat(run.stops.map(function(s){ return s.ev; })).forEach(function(x){ if(x && String(x.id) === ev) rec = x; });
    }); });
  }
  var start = rec ? hhmm(rec.at) : (tt || "");
  openSheet({ eyebrow: shortDay(key), title: label,
    line: (rec ? "Recorded " + hhmm(rec.at) + "." : "No time recorded.") + (tt ? " Timetable " + tt + "." : ""),
    body: '<div class="field"><label for="fixAt">Time</label><input id="fixAt" type="time" value="'+esc(start)+'"></div>',
    go: rec ? "Correct it" : "Add it",
    onGo: function(){
      var t = String($("fixAt").value || "").slice(0,5);
      if(!/^\d{2}:\d{2}$/.test(t)){ sheetSay("Give a time.", true); return; }
      var a = { kind:"fix", sunday:key, time:t };
      if(rec) a.eventId = rec.id; else { a.trip = trip; a.stopId = stop; }
      act(a);
    } });
  var label2 = function(){
    var t = String($("fixAt").value || "").slice(0,5);
    $("sheetGo").textContent = /^\d{2}:\d{2}$/.test(t) ? (rec ? "Correct it to " + t : "Add " + t) : (rec ? "Correct it" : "Add it");
  };
  $("fixAt").oninput = label2; $("fixAt").onchange = label2;
  label2();
}

function authorise(reg){
  openSheet({ eyebrow: "Walkaround", title: "Authorise " + reg + " to run?", line: "The defect stays open.",
    go: "Authorise", stop: true,
    onGo: function(){
      if(busy) return; busy = true; sheetBusy(true); sheetSay("Sending…");
      post({ action:"authorise", token:TOKEN, authorise:{ reg:reg, who:who, pin:pin } }).then(function(out){
        busy = false; sheetBusy(false);
        if(out && out.ok){ closeSheet(); toast(reg + " may run."); refresh(); return; }
        var t = authWords(out); if(t){ lock(t); return; }
        sheetSay(out && out.error === "no check" ? "That bus is not stopped any more."
               : out && out.error === "same hand" ? "The person who did the walkaround cannot authorise it."
               : plain(out && out.error) || "The live server did not take that.", true);
      }, function(err){ busy = false; sheetBusy(false); sheetSay(plain(err) || "No answer.", true); });
    } });
}

function endRun(route){
  var r = (D.runs || {})[route] || {};
  openSheet({ eyebrow: "Run", title: "End the " + route + " run?",
    line: (r.driver ? r.driver + "’s run" : "The run") + (r.started ? ", left church " + hhmm(r.started) : "") + ".",
    go: "End the run", stop: true,
    onGo: function(){
      if(busy) return; busy = true; sheetBusy(true); sheetSay("Sending…");
      post({ action:"endrun", token:TOKEN, endrun:{ route:route, who:who, pin:pin } }).then(function(out){
        busy = false; sheetBusy(false);
        if(out && out.ok){ closeSheet(); toast("The " + route + " run is closed."); refresh(); return; }
        var t = authWords(out); if(t){ lock(t); return; }
        sheetSay(out && out.error === "your own run" ? "That is your own run. End it in the driver app."
               : out && out.error === "no run" ? "There is no open run on " + route + "."
               : plain(out && out.error) || "The live server did not take that.", true);
      }, function(err){ busy = false; sheetBusy(false); sheetSay(plain(err) || "No answer.", true); });
    } });
}

/* ---- coordinator alerts on this phone, from v1.84.0 ------------------------
   Until now a coordinator turned these on in the driver app, which was fine
   in a browser and wrong on an iPhone: each Home Screen app is its own, so a
   coordinator who only ever opened this one was never offered them. The bell
   here does the same sign-up the driver app's does, under the name signed in
   here, behind the PIN. It uses the driver app's service worker, registered
   from here if this phone has never opened the driver app; that worker leaves
   this folder to the network, so nothing about this page changes. Tapped
   when alerts are already on, it sends this phone a test. */
var BELL = { on: false, busy: false };

function pushAble(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
/* An iPhone only takes alerts in an app on its Home Screen, never in Safari. */
function iosBrowser(){ var d = deviceKind(); return (d === "ios" || d === "ios-other") && !standalone(); }

function pushReg(){
  var sw = navigator.serviceWorker;
  var got = sw.getRegistration("../").then(function(r){
    return r || sw.register("../sw.js", { scope: "../" });
  }).then(function(r){
    if(r.active) return r;
    return new Promise(function(done){
      var w = r.installing || r.waiting;
      if(!w) return done(r);
      w.addEventListener("statechange", function(){ if(w.state === "activated") done(r); });
    });
  });
  return Promise.race([got, new Promise(function(_, no){ setTimeout(function(){ no(new Error("slow")); }, 15000); })]);
}
function pushKeyBytes(k){
  var pad = "=".repeat((4 - k.length % 4) % 4);
  var raw = atob((k + pad).replace(/-/g, "+").replace(/_/g, "/"));
  var out = new Uint8Array(raw.length);
  for(var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out;
}

function bellPaint(name){
  var b = $("barBell");
  if(!b) return;
  b.hidden = (name || current().name) !== "home" || !pin || !LIVE || !(pushAble() || iosBrowser());
  b.classList.toggle("on", BELL.on);
  b.setAttribute("aria-pressed", BELL.on ? "true" : "false");
  b.disabled = BELL.busy;
}
/* On signing in: whether this phone is already signed up. Only looks: it
   never registers anything just to find out. */
function bellLook(){
  if(!pushAble() || !navigator.serviceWorker.getRegistration) return;
  navigator.serviceWorker.getRegistration("../").then(function(r){
    return r && r.pushManager ? r.pushManager.getSubscription() : null;
  }).then(function(sub){
    BELL.on = !!sub && Notification.permission === "granted";
    bellPaint();
  }, function(){});
}
function bellTap(){
  if(BELL.busy || !who) return;
  if(iosBrowser()){
    toast("On an iPhone, alerts need this app on your Home Screen first.");
    howOpen(false);
    return;
  }
  if(!pushAble()){ toast("This phone's browser cannot receive alerts.", true); return; }
  if(Notification.permission === "denied"){
    toast("Alerts are blocked for this site in the phone's settings.", true); return;
  }
  var was = BELL.on;
  BELL.busy = true; bellPaint();
  var endpoint = "";
  Notification.requestPermission().then(function(p){
    if(p !== "granted") throw new Error("not granted");
    return pushReg();
  }).then(function(reg){
    return reg.pushManager.getSubscription().then(function(sub){
      if(sub) return sub;
      return fetch(LIVE + "?vapid=1").then(function(r){ return r.json(); }).then(function(v){
        if(!v || !v.ok || !v.key) throw new Error("no key");
        return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: pushKeyBytes(v.key) });
      });
    });
  }).then(function(sub){
    var j = sub.toJSON();
    endpoint = j.endpoint;
    /* Every time, so the phone is under the name signed in now. */
    return post({ action: "subscribe", endpoint: j.endpoint, keys: j.keys, role: "driver", driver: who, route: "" });
  }).then(function(out){
    if(!out || !out.ok) throw new Error("not taken");
    if(was) return post({ action: "testpush", endpoint: endpoint });
    return out;
  }).then(function(){
    BELL.on = true; BELL.busy = false; bellPaint();
    toast(was ? "A test alert is on its way to this phone." : "Coordinator alerts are on for this phone.");
  }, function(err){
    BELL.busy = false; bellPaint();
    toast(String(err && err.message) === "not granted" ? "Not turned on." : "Could not turn alerts on. Try again.", true);
  });
}

function howClose(){
  $("howModal").classList.remove("is-on");
  $("howModal").setAttribute("aria-hidden", "true");
}
/* Chrome hands over a real prompt when the page qualifies; one tap beats three. */
function howOffer(){
  var wrap = $("howOne");
  if(!wrap || !INSTALL_PROMPT) return;
  wrap.innerHTML = '<button class="btn btn-main how-btn" id="howGo" type="button">Install</button>';
  $("howGo").addEventListener("click", function(){
    var p = INSTALL_PROMPT;
    if(!p) return;
    INSTALL_PROMPT = null;
    try{ p.prompt(); }catch(e){}
    (p.userChoice || Promise.resolve({ outcome: "dismissed" })).then(function(r){
      wrap.innerHTML = (r && r.outcome === "accepted") ? '' : '<p class="how-note">The steps below do the same.</p>';
    }, function(){ wrap.innerHTML = ''; });
  });
}
function howLinkSync(){ var b = $("howLink"); if(b) b.style.display = standalone() ? "none" : ""; }
/* Once, on the first visit in a browser, over the sign-in screen and never
   over anything else, and not when opened from the driver app mid-task. */
function howAuto(){
  if(standalone() || HAND) return;
  try{ if(localStorage.getItem(HOWKEY) === "1") return; }catch(e){ return; }
  setTimeout(function(){
    if(!$("s-sign").classList.contains("is-on") || $("sheet").classList.contains("is-on")) return;
    try{ localStorage.setItem(HOWKEY, "1"); }catch(e){}
    howOpen(true);
  }, 600);
}
window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); INSTALL_PROMPT = e; howOffer(); });
window.addEventListener("appinstalled", function(){ INSTALL_PROMPT = null; howClose(); howLinkSync(); });
$("howLink").addEventListener("click", function(){ howOpen(false); });
$("howDone").addEventListener("click", howClose);
$("howModal").addEventListener("click", function(e){ if(e.target === this) howClose(); });
document.addEventListener("keydown", function(e){
  if(e.key === "Escape" && $("howModal").classList.contains("is-on")) howClose();
});
howLinkSync();

if(!LIVE){
  banner("There is no live server set in config.js, and this page needs one.");
}
themeApply();
history.replaceState({ n: 0 }, "", location.hash || "#home");
var HAND = handTake();
/* A PIN left for the driver app and never taken, because that page did not
   load, goes as soon as this page is back. */
try{ sessionStorage.removeItem(DRIVER_HAND_KEY); }catch(e){}
route();
if(HAND && LIVE){
  $("signName").value = HAND.name;
  openAs(HAND.name, HAND.pin, "carried");
}
peek();
howAuto();
</script>
</body>
</html>
