<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B222C">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-title" content="Coordinator">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<!-- BUILD v1.93.0 · THE COORDINATOR'S APP.

     What the coordinator used to open the spreadsheet for, on his phone: the
     rota, rota requests, bookings, defects, each bus's dates and records (from
     v1.89.0), the run record and the "have a
     look" reports. Every change goes to the live server under his PIN and is
     answered at once; the spreadsheet applies it a few seconds later with the
     same code a person editing that cell sets going.

     No service worker, like the page an email links to: a coordinator acting
     on a copy of the morning served from a cache is acting on a stale picture.
     The driver app's worker leaves this folder to the network. With no signal
     it does not open, and that is the right answer for a page that changes
     the record. -->
<title>Coordinator · RCCG Dominion Assembly Liverpool</title>
<link rel="manifest" href="manifest.webmanifest">
<!-- The home screen icon and the tab icon, from v1.77.1: the same logo on an
     indigo field, the colour of its own centre. Navy is the driver app and
     green is the passenger page, so a coordinator with all three on one phone
     can tell them apart. Absolute, and a filename iOS has never seen, for the
     reasons given on the passenger page. -->
<link rel="apple-touch-icon" sizes="180x180"
      href="https://drolnstone.github.io/minibus-check/alt-indigo-180.png">
<link rel="icon" type="image/png" sizes="180x180"
      href="https://drolnstone.github.io/minibus-check/alt-indigo-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* The driver app's colours, names and themes, so the two read as one app.
   Green, amber and red keep their meanings in every theme: done, waiting,
   refused or stopped. */
:root{
  --ink:#16191F;--paper:#F4F5F6;--card:#FFFFFF;
  --steel:#1B222C;--steel-2:#2A3542;--hair:#D3D7DC;--muted:#5C6672;
  --pass:#146B41;--pass-bg:#E6F2EB;--pass-line:#B7D8C6;--pass-ink:#0E4A2D;
  --warn:#9E5F00;--warn-bg:#FDF3E2;--warn-line:#EBD3A8;--warn-ink:#5A4008;
  --stop:#A8231B;--stop-bg:#FBE9E7;--stop-line:#E8BCB7;--stop-ink:#6B1710;
  --pass-on:#FFFFFF;--warn-on:#FFFFFF;--stop-on:#FFFFFF;
  --info:#2C6FA8;--info-deep:#244E72;--info-bg:#EEF5FB;--info-line:#B8D1E6;--info-ring:#9CC4EC;
  --on-accent:#FFFFFF;--accent-ink:#1B222C;
  --plate:#F4C11E;--plate-ink:#101010;
  --ink-2:#2E353D;--faint:#AEB8C4;--press:#EDEFF1;
  --dash-ink:#EEF1F4;--dash-dim:#ACB7C2;
  --scrim:rgba(22,25,31,.48);
  color-scheme:light;
  --r:10px;--tap:52px;
  --safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E7EBF0;--paper:#0E1216;--card:#181D25;
  --steel:#31404F;--steel-2:#3D4E60;--hair:#2B333E;--muted:#9EA9B6;
  --pass:#21A163;--pass-bg:#12291F;--pass-line:#265741;--pass-ink:#7FDCAB;
  --warn:#BF7A08;--warn-bg:#2B2113;--warn-line:#5C4826;--warn-ink:#EFCB8B;
  --stop:#D85F55;--stop-bg:#2E1715;--stop-line:#5E2F2A;--stop-ink:#FFB0A4;
  --pass-on:#16191F;--warn-on:#16191F;--stop-on:#16191F;
  --info:#5896D6;--info-deep:#9AC6EA;--info-bg:#152431;--info-line:#2E4356;--info-ring:#3E5E79;
  --accent-ink:#9DB4CC;--ink-2:#CAD1DA;--faint:#7E8996;--press:#232A33;
  --scrim:rgba(0,0,0,.62);
}
html[data-theme="green"]{--steel:#14532D;--steel-2:#1E6B3C;--paper:#F2F6F3;--accent-ink:#14532D}
html[data-theme="navy"]{--steel:#1E3260;--steel-2:#2C4680;--paper:#F2F4F9;--accent-ink:#1E3260}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none;padding:0}
input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}

/* ---- the bar across the top ---- */
.bar{position:sticky;top:0;z-index:60;background:var(--steel);color:var(--dash-ink);
  padding-top:var(--safe-t);border-bottom:3px solid rgba(0,0,0,.35)}
.bar-in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:8px;min-height:54px;
  padding:6px calc(12px + var(--safe-r)) 6px calc(12px + var(--safe-l))}
.bar-back{flex:none;width:40px;height:40px;margin-left:-6px;border-radius:8px;color:var(--dash-ink);
  display:flex;align-items:center;justify-content:center}
.bar-back svg{width:22px;height:22px}
.bar-id{flex:1;min-width:0}
.bar-id b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:19px;
  letter-spacing:.08em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.15}
.bar-id span{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:12px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dash-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-bell{flex:none;width:40px;height:40px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);
  color:var(--dash-ink);display:flex;align-items:center;justify-content:center;background:transparent}
.bar-bell[hidden]{display:none}
.bar-bell svg{width:20px;height:20px;display:block}
.bar-bell.on svg{fill:currentColor}
.bar-bell:disabled{opacity:.5}
.bar-btn{flex:none;min-height:36px;padding:0 12px;border:1.5px solid rgba(255,255,255,.35);border-radius:8px;
  color:var(--dash-ink);font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;
  letter-spacing:.08em;text-transform:uppercase}
.banner{display:none;background:var(--warn-bg);border-bottom:1px solid var(--warn);color:var(--warn-ink);
  padding:9px calc(14px + var(--safe-r)) 9px calc(14px + var(--safe-l));font-size:14px;text-align:center}
.banner.is-on{display:block}

/* ---- the page ---- */
.wrap{max-width:640px;margin:0 auto;
  padding:16px calc(14px + var(--safe-r)) calc(48px + var(--safe-b)) calc(14px + var(--safe-l))}
/* THE SIGN-IN OPENS ON THE LOGO, from v1.89.0, as the passenger page and the
   driver app's first screen do, with no bar over it. Signed in, the bar
   returns: the app's name or the screen's, over who is signed in. Without the
   bar the page keeps clear of the status bar itself. */
.bar.is-away{display:none}
body.bar-away .wrap{padding-top:calc(16px + var(--safe-t))}
.brand{display:flex;align-items:center;gap:12px;margin:0 0 16px}
.brand img{width:52px;height:52px;flex:none}
.brand-txt b{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:20px;
  line-height:1.1;letter-spacing:.02em;color:var(--ink)}
.brand-txt span{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:500;font-size:13px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.screen{display:none}
.screen.is-on{display:block;animation:fade .2s ease}
@keyframes fade{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:13px;letter-spacing:.16em;
  text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:30px;line-height:1.06;margin:0 0 12px}
/* With no heading under the bar (from v1.90.0), a screen that opens on a
   bus's plate starts at the top like every other. */
.screen > div > h3:first-child{margin-top:0}
h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:26px;line-height:1.1;margin:0 0 8px}
h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:15px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);padding:12px 13px}
.card+.card{margin-top:10px}
.drv.off,.stp.off{opacity:.7}
.stp .stp-name{margin:4px 0 0;overflow-wrap:anywhere}
#stopsBody>.btn-wide{margin-bottom:10px}
#driversBody .btn-wide,#busesBody>.btn-wide{margin-bottom:10px}
.bus-facts .did{margin:6px 0 0;white-space:pre-line;color:var(--ink-2)}
.did{overflow-wrap:anywhere}
.tiny{font-size:13px;color:var(--muted);margin:6px 0 0}
.center{text-align:center}
.mono{font-family:"IBM Plex Mono",monospace}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.say{min-height:1.3em;margin:10px 0 0;font-size:14px;color:var(--muted)}
.say.bad{color:var(--stop)}
.version{display:block;width:100%;text-align:center;margin-top:18px;font-family:"Barlow Condensed",sans-serif;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);padding:4px 0}
.version .vpart{white-space:nowrap}
/* The same chips as the driver app and the passenger page. */
.themes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 3px}
.themes button{min-height:32px;padding:0 11px;border:1.5px solid var(--hair);
  border-radius:16px;background:var(--card);color:var(--muted);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.06em;text-transform:uppercase}
.themes button.on{background:var(--steel);border-color:var(--steel);color:var(--on-accent)}
.diag li b{display:block;font-weight:600}
.diag li small{font-size:14px;white-space:pre-line}
.foot-link{display:block;margin:10px auto 0;font-family:"Barlow Condensed",sans-serif;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.foot-links{display:flex;justify-content:center;gap:28px}

/* ---- how to put it on a phone, from v1.83.0 ------------------------------
   The driver app's and the passenger page's sheet, the same steps, so all
   three apps say it the same way. Under the appearance on the sign-in screen,
   and offered once on the first visit in a browser. */
.how-link{display:block;margin:12px auto 0;background:none;border:none;padding:4px 8px;
  font-family:"Barlow Condensed",sans-serif;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);text-decoration:underline;cursor:pointer}
.how-wrap{z-index:130}
.how-lab{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 11px}
.how-steps{list-style:none;margin:0;padding:0}
.how-steps li{display:flex;gap:11px;align-items:flex-start;margin:0 0 13px;font-size:14px;line-height:1.5}
.how-steps li:last-child{margin-bottom:0}
.how-steps b{font-weight:600}
.how-n{flex:0 0 24px;height:24px;border-radius:50%;background:var(--steel);
  color:var(--on-accent);font-size:12px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;margin-top:1px}
.how-note{font-size:13px;line-height:1.5;background:var(--warn-bg);
  border:1px solid var(--warn-line);border-radius:9px;padding:10px 12px;margin:0 0 14px}
.how-more{margin-top:15px;border-top:1px solid var(--hair);padding-top:4px}
.how-more summary{font-size:13px;font-weight:600;color:var(--muted);padding:8px 0;cursor:pointer}
.how-btn{width:100%;margin:0 0 16px}
.foot-links .foot-link{margin:10px 0 0}

/* ---- fields and buttons ---- */
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:600;font-size:14px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;padding:12px;border:1.5px solid var(--hair);
  border-radius:8px;background:var(--card);font-size:17px}
.field textarea{min-height:84px;resize:vertical}
.field select{appearance:none;-webkit-appearance:none;padding-right:40px;
  background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%235C6672' stroke-width='2' fill='none' stroke-linecap='round'/></svg>") no-repeat right 14px center}
.field input:focus,.field textarea:focus,.field select:focus{outline:3px solid var(--info-ring);outline-offset:1px;border-color:var(--steel-2)}
.idrow{display:flex;gap:10px;align-items:end}
.idrow .field{margin:0}
.idrow .grow{flex:1 1 auto;min-width:0}
.idrow .pinf{flex:0 0 108px}
.pinbox{text-align:center;letter-spacing:.32em}
.btn{min-height:var(--tap);padding:0 16px;border-radius:9px;font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:18px;letter-spacing:.05em;text-transform:uppercase;display:inline-flex;
  align-items:center;justify-content:center;border:1.5px solid transparent;transition:transform .08s,opacity .15s;
  text-align:center;line-height:1.1}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn-main{background:var(--steel);color:var(--on-accent)}
.btn-ghost{background:var(--card);border-color:var(--hair);color:var(--ink)}
.btn-stop{background:var(--stop);color:var(--stop-on)}
.btn-wide{width:100%}
.mini{min-height:38px;padding:0 11px;border:1.5px solid var(--hair);border-radius:7px;background:var(--card);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.05em;
  text-transform:uppercase;white-space:nowrap;flex:none;display:inline-flex;align-items:center;justify-content:center}
.mini.warn{border-color:var(--stop-line);color:var(--stop)}
.mini:active{transform:scale(.97)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}
.chips button{min-height:40px;padding:0 14px;border:1.5px solid var(--hair);border-radius:20px;background:var(--card);
  font-size:14px;font-weight:500}
.chips button.on{background:var(--steel);border-color:var(--steel);color:var(--on-accent)}
/* THE DATES STAY IN VIEW, from v1.90.0. On Bookings and the Run record the
   row of Sundays is pinned under the bar while the list scrolls, so the one
   lit is always there to say which Sunday this is. --bar-h is the bar's own
   height, measured, because the status bar above it differs by phone. */
.chips.stick{position:sticky;top:var(--bar-h,60px);z-index:50;background:var(--paper);
  margin:-16px calc(-14px - var(--safe-r)) 12px calc(-14px - var(--safe-l));
  padding:10px calc(14px + var(--safe-r)) 10px calc(14px + var(--safe-l));border-bottom:1px solid var(--hair)}

/* ---- small labels ---- */
.tag{display:inline-block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;padding:2px 6px;border-radius:4px;border:1px solid var(--hair);
  color:var(--muted);background:var(--card);white-space:nowrap;vertical-align:middle}
.tag.pass{background:var(--pass-bg);color:var(--pass);border-color:var(--pass-line)}
.tag.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn-line)}
.tag.stop{background:var(--stop-bg);color:var(--stop);border-color:var(--stop-line)}
.tag.info{background:var(--info-bg);color:var(--info-deep);border-color:var(--info-line)}
.plate{display:inline-block;background:var(--plate);color:var(--plate-ink);font-family:"Barlow Condensed",sans-serif;
  font-weight:700;font-size:14px;letter-spacing:.05em;padding:0 6px;border-radius:3px;border:1.5px solid var(--plate-ink);
  white-space:nowrap;line-height:1.35}

/* ---- home ---- */
.need{display:flex;align-items:center;gap:10px;border:1.5px solid var(--warn-line);background:var(--warn-bg);
  color:var(--warn-ink);border-radius:var(--r);padding:7px 10px 7px 12px;margin:0 0 7px;width:100%;text-align:left;min-height:46px}
.need.stop{border-color:var(--stop-line);background:var(--stop-bg);color:var(--stop-ink)}
.need p{margin:0;flex:1;font-size:15px;font-weight:500;line-height:1.3}
.need .mini{background:var(--card)}
.need .go{font-size:22px;line-height:1;opacity:.7}
.menu{list-style:none;margin:12px 0 0;padding:0;border:1px solid var(--hair);border-radius:var(--r);
  background:var(--card);overflow:hidden}
.menu button{display:flex;align-items:center;gap:10px;width:100%;min-height:46px;padding:0 12px 0 14px;
  border-bottom:1px solid var(--hair);text-align:left}
.menu li:last-child button{border-bottom:none}
.menu button:active{background:var(--press)}
.menu .t{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.03em}
.menu .n{font-size:14px;color:var(--muted)}
.menu .n.warn{color:var(--warn);font-weight:600}
.menu .n.stop{color:var(--stop);font-weight:600}
.menu .go{color:var(--faint);font-size:20px;line-height:1}

/* ---- a Sunday ---- */
.sun{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--hair);
  border-radius:var(--r);padding:8px 12px 5px}
.sun+.sun{margin-top:8px}
.sun.now{border:2px solid var(--steel)}
.sun:active{background:var(--press)}
.sun-head{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:4px}
/* On the first screen only: the card is the way into the Rota, and says so. */
.sun-cue{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);white-space:nowrap}
.sun-date{flex:1;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:18px;letter-spacing:.04em;
  text-transform:uppercase;white-space:nowrap}
.leg{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:4px 0;
  border-top:1px solid var(--hair)}
.leg-rt{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:12px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted)}
.leg-who{min-width:0;font-weight:600;font-size:15px;line-height:1.25;overflow-wrap:anywhere}
.leg-who small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.leg-who.off{color:var(--stop)}
.leg-end{display:flex;align-items:center;gap:6px}
.seats{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted)}
.seats.over{color:var(--stop);font-weight:600}

/* ---- editing a Sunday ---- */
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
.seg button{min-height:46px;border:1.5px solid var(--hair);border-radius:8px;background:var(--card);
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:14px;letter-spacing:.03em;
  text-transform:uppercase;line-height:1.05;padding:0 4px}
.seg button.on{background:var(--pass);border-color:var(--pass);color:var(--pass-on)}
.seg button.on.off{background:var(--stop);border-color:var(--stop);color:var(--stop-on)}
.route-card{padding-top:9px;padding-bottom:4px}
.route-card h3{margin:0;font-size:14px}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--hair);min-height:50px}
.route-card .row:first-of-type{border-top:none}
.row .k{flex:0 0 56px;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:13px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.row .v{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.row .v small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.row .v.none{font-weight:400;color:var(--muted)}
.row .acts{display:flex;gap:6px}
.notes{margin:0;padding:0;list-style:none}
.notes li{padding:6px 0;border-top:1px dashed var(--hair);font-size:15px;white-space:pre-line}
.notes li:first-child{border-top:none}
.notes li.ed{display:flex;align-items:flex-start;gap:8px}
.notes li.ed .t{flex:1;min-width:0;overflow-wrap:anywhere}
.notes li.ed .acts{display:flex;gap:6px;flex-shrink:0}

/* ---- lists to choose from ---- */
.pick{list-style:none;margin:0;padding:0;border:1px solid var(--hair);border-radius:var(--r);background:var(--card);
  overflow:auto;max-height:50vh}

<script>
/* THE STATUS BAR, AFTER A TRIP TO THE DRIVER APP.

   On an iPhone, installed to the Home Screen, going to the driver app and
   coming back left the bar under the clock and the signal: Safari reports
   the top safe area as nothing on the way back, although the status bar is
   still drawn over the page. So the top inset is measured whenever it is
   right, kept, and put back when Safari says nothing in portrait, which on a
   Home Screen iPhone is never true. Anywhere else this does nothing. */
(function(){
  var KEY = "coord.safeTop.v1", root = document.documentElement;
  function measure(){
    var d = document.createElement("div");
    d.style.cssText = "position:absolute;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";
    (document.body || root).appendChild(d);
    var v = parseFloat(getComputedStyle(d).paddingTop) || 0;
    d.parentNode.removeChild(d);
    return v;
  }
  function fix(){
    if(navigator.standalone !== true) return;
    if(window.innerWidth > window.innerHeight) { root.style.removeProperty("--safe-t"); return; }
    var v = measure();
    if(v > 0){
      root.style.removeProperty("--safe-t");
      try{ localStorage.setItem(KEY, String(v)); }catch(e){}
      return;
    }
    var kept = 0;
    try{ kept = parseFloat(localStorage.getItem(KEY)) || 0; }catch(e){}
    if(kept > 0) root.style.setProperty("--safe-t", kept + "px");
  }
  window.coordSafeTop = fix;
  window.addEventListener("pageshow", fix);
  window.addEventListener("resize", fix);
  window.addEventListener("orientationchange", function(){ setTimeout(fix, 150); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) fix(); });
  if(document.readyState === "loading") document.addEventListener("DOMContentLoaded", fix); else fix();
})();
</script>

<script>
"use strict";

var PAGE_VERSION = "v1.93.0";

var CFG = window.CONFIG || {};

var TOKEN = String(CFG.token || "");

var NAME_KEY = "coord.name.v1";
/* Where the driver app leaves a checked PIN for this page to take. */
var HAND_KEY = "coord.hand.v1";
/* And the other way: where this page leaves one for the driver app. */
var DRIVER_HAND_KEY = "fleet.hand.v1";
var TZ = "Europe/London";

var who = "", pin = "", HOW = "";
/* The Drivers tab as the live server last had it, from the public rota: the

   the remembered name and the cursor in the PIN box arrived a second late,

var BOOK = { sunday: "", data: null };
var BOOK_ALL = {};
var RUNS = { sunday: "", data: null };
var REP = { name: "", data: null, asking: false };
var ROTA_SHOW = 12;
var busy = false, touched = Date.now(), seq = 0, lastSeen = { server: "", sheet: "" };

function esc(s){
  return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function storeGet(k){ try{ return localStorage.getItem(k) || ""; }catch(e){ return ""; } }
function storeSet(k,v){ try{ localStorage.setItem(k, v); }catch(e){} }
function same(a,b){ return String(a||"").trim().toLowerCase() === String(b||"").trim().toLowerCase() && !!String(a||"").trim(); }

/* ---- days and times, in London ------------------------------------------ */

var DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var DAYL = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
var MONS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONL = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function parts(key){
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(key||""));
  if(!m) return null;
  var y=+m[1], mo=+m[2], d=+m[3];
  return { y:y, mo:mo, d:d, dow:new Date(Date.UTC(y,mo-1,d)).getUTCDay() };
}
function shortDay(key){ var p=parts(key); return p ? DAYS[p.dow]+" "+p.d+" "+MONS[p.mo-1] : String(key||""); }
function longDay(key){ var p=parts(key); return p ? DAYL[p.dow]+" "+p.d+" "+MONL[p.mo-1] : String(key||""); }
function plusWeeks(key, n){
  var p=parts(key); if(!p) return "";
  var x=new Date(Date.UTC(p.y,p.mo-1,p.d+7*n));
  return x.getUTCFullYear()+"-"+("0"+(x.getUTCMonth()+1)).slice(-2)+"-"+("0"+x.getUTCDate()).slice(-2);
}
var HM = null;
function hhmm(ms){
  if(!ms) return "";
  try{
    HM = HM || new Intl.DateTimeFormat("en-GB",{ timeZone:TZ, hour:"2-digit", minute:"2-digit", hour12:false });
    return HM.format(new Date(Number(ms))).replace(/^24/,"00");
  }catch(e){ var d=new Date(Number(ms)); return ("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2); }
}
function dayOf(ms){
  try{
    var f = new Intl.DateTimeFormat("en-GB",{ timeZone:TZ, year:"numeric", month:"2-digit", day:"2-digit" });
    var p = {}; f.formatToParts(new Date(Number(ms))).forEach(function(x){ p[x.type]=x.value; });
    return p.year+"-"+p.month+"-"+p.day;
  }catch(e){ return ""; }
}
function when(ms){ return ms ? shortDay(dayOf(ms)) + " " + hhmm(ms) : ""; }
function phoneWords(p){ p=String(p||""); return p.length===11 ? p.slice(0,5)+" "+p.slice(5) : p; }
function seatWords(n){ return n + (Number(n)===1 ? " seat" : " seats"); }
/* A STOP IS ITS NUMBER, from v1.90.0: shown first wherever a stop is named,
   because the place behind a number is edited as the passengers change and
   the number is what everybody refers to. The name is only compared, to say
   when a seat or a tap was made at the place the number used to be. */
function sid(id){ return id ? '<span class="sid">'+esc(id)+'</span>' : ''; }
function stopWords(x){ return String(x||"").trim().toLowerCase().replace(/\s+/g, " "); }
function sameStop(a, b){ return stopWords(a) === stopWords(b); }
function offWords(off){
  if(off === null || off === undefined || off === "") return "";
  off = Number(off);
  return off === 0 ? "on time" : (off > 0 ? "+" + off : "−" + (-off));
}

/* ---- talking to the live server ---------------------------------------- */

function post(body, ms){
  return Promise.race([
    fetch(LIVE, { method:"POST", redirect:"follow",
                  headers:{ "Content-Type":"text/plain;charset=utf-8" },
                  body: JSON.stringify(body) })
      .then(function(r){ return r.text(); })
      .then(function(t){ return JSON.parse(t); }),
    new Promise(function(_, no){ setTimeout(function(){ no(new Error("slow")); }, ms || 20000); })
  ]);
}

function api(op, extra, ms){
  var body = { action:"coord", token:TOKEN, who:who, pin:pin, op:op };
  for(var k in (extra||{})) if(Object.prototype.hasOwnProperty.call(extra,k)) body[k] = extra[k];
  return post(body, ms).then(function(out){
    if(out){ lastSeen.server = out.server || lastSeen.server; lastSeen.sheet = out.sheet || lastSeen.sheet; }
    rolesSeen(out);
    var t = authWords(out);
    if(t){ lock(t); throw new Error("locked"); }
    banner("");
    return out;
  }, function(err){
    banner(navigator.onLine === false ? "No signal. Changes need a connection." : "The live server is not answering.");
    throw err;
  });
}

function authWords(out){
  if(!out || out.ok) return "";
  if(out.locked) return "Too many wrong tries. Wait " + (out.minutes || 5) + " minutes.";
  if(out.error === "bad pin") return "That PIN is not right." +
    (out.left > 0 ? " " + out.left + (out.left === 1 ? " try" : " tries") + " left." : "");
  if(out.error === "not authorised") return "Only a coordinator can open this.";
  if(out.error === "unknown driver") return "That name is not on the Drivers tab.";
  if(out.error === "no pin") return "There is no PIN against your name on the Drivers tab.";
  if(out.error === "no driver") return "Choose your name.";
  return "";
}

/* The live server's refusals are written as sentences. Anything else is not
   put in front of anybody. */
function plain(e){
  var m = String((e && e.message) || e || "").trim();
  if(!m || m === "locked") return "";
  if(m === "slow") return "The live server took too long to answer.";
  if(/failed to fetch|load failed|networkerror/i.test(m)) return "No signal. Nothing was changed.";
  if(/^[a-z ]+$/.test(m) && m.split(" ").length < 4) return "The live server did not take that. Nothing was changed.";
  if(/Error\b|undefined|is not a function/.test(m)) return "Something went wrong at the live server. Nothing was changed.";
  return m;
}

function banner(t){
  var b = $("banner");
  b.textContent = t || "";
  b.classList.toggle("is-on", !!t);
}

var toastT = null;
function toast(t, bad){
  var el = $("toast");
  el.textContent = t;
  el.classList.toggle("bad", !!bad);
  el.classList.toggle("top", !!(SHEET && SHEET.open));
  el.classList.add("is-on");
  clearTimeout(toastT);
  toastT = setTimeout(function(){ el.classList.remove("is-on"); }, bad ? 5200 : 3600);
}

/* A change, once. The id is made when the sheet opens, so a second tap after
   a lost answer is the same change and the live server does it once. */
function newId(){
  var a = new Uint8Array(6);
  try{ crypto.getRandomValues(a); }catch(e){ for(var i=0;i<a.length;i++) a[i]=Math.floor(Math.random()*256); }
  return "c" + Date.now().toString(36) + "-" + Array.prototype.map.call(a, function(x){ return ("0"+x.toString(16)).slice(-2); }).join("");
}

function act(a, after){
  if(busy) return;
  busy = true; sheetBusy(true); sheetSay("Sending…");
  var body = {}; for(var k in a) body[k] = a[k];
  body.id = SHEET.id || newId();
  api("act", { act: body }).then(function(out){
    busy = false; sheetBusy(false);
    if(!out || !out.ok){ sheetSay(plain(out && out.error) || "The live server did not take that. Nothing was changed.", true); return; }
    closeSheet();
    toast((out.action && out.action.words) || "Done.");
    if(after) after(out);
    refresh();
    /* Once more, a little later, for the sheet's answer. */
    setTimeout(refresh, 8000);
  }, function(err){
    busy = false; sheetBusy(false);
    sheetSay(plain(err) || "The live server did not answer. Nothing was changed.", true);
  });
}

/* ---- signing in, locking -------------------------------------------------- */

function signNames(){
  var sel = $("signName");
  var list = (REGLIVE || CFG.drivers || []).filter(function(d){ return d && d.name && isLead(d.role); });
  /* The name already in the box stays there: a wrong PIN is not a wrong name. */
  var had = sel.value || who || storeGet(NAME_KEY);
  sel.innerHTML = '<option value="">Choose your name</option>' + list.map(function(d){
    return '<option value="'+esc(d.name)+'">'+esc(d.name)+'</option>';
  }).join("");
  if(had && list.some(function(d){ return d.name === had; })) sel.value = had;
  else if(list.length === 1) sel.value = list[0].name;
}

var signT = null;
function signIn(){
  var n = $("signName").value;
  var p = String($("signPin").value || "").replace(/\D/g,"");
  if(!n){ say("signSay","Choose your name.",true); return; }
  if(p.length < 4){ say("signSay","Key your PIN.",true); return; }
  openAs(n, p, "keyed");
}

/* TO THE DRIVER APP, WITH THE PIN. The Coordinator button there, the other
   way round. "hub" for the Driver app link, which lands him signed in on the
   hub as he would be had he signed in there; "check" for Vehicle check, which
   goes on to choosing the bus.

   A coordinator signed in here has had his PIN checked by the live server on
   every call, so he is not asked for it again to do a walkaround. It goes the
   same way the driver app's comes: this tab's own session storage, which no
   other tab and no later visit can read, taken and wiped by the driver app as
   it opens, and refused there if more than a minute old. The driver app still
   checks it, as it checks one keyed there; it only is not typed twice. */
function toDriver(to){
  try{
    if(who && /^\d{4,8}$/.test(String(pin || "")))
      sessionStorage.setItem(DRIVER_HAND_KEY, JSON.stringify({ name: who, pin: String(pin), to: to, at: Date.now() }));
    else sessionStorage.removeItem(DRIVER_HAND_KEY);
  }catch(e){}
  location.href = "../";
}

/* The PIN the driver app checked, taken once. It is put in this tab's own
   session storage by the Coordinator button and only when the sheet has
   checked it there; it is wiped here as it is read, and a copy more than a
   minute old is not used. Opened any other way, from the home screen or a
   link, there is nothing to take and the PIN is asked for. */
function handTake(){
  var h = null;
  try{ h = JSON.parse(sessionStorage.getItem(HAND_KEY) || "null"); }catch(e){ h = null; }
  try{ sessionStorage.removeItem(HAND_KEY); }catch(e){}
  if(!h || !h.name || !/^\d{4,8}$/.test(String(h.pin || ""))) return null;
  if(!(Date.now() - Number(h.at || 0) < 60000)) return null;
  return { name: String(h.name), pin: String(h.pin) };
}

function openAs(n, p, how){
  if(busy) return;
  who = n; pin = p; busy = true;
  $("signGo").disabled = true;
  say("signSay", how === "carried" ? "Opening…" : "Checking…");
  api("load", {}).then(function(out){
    busy = false; $("signGo").disabled = false;
    if(!out || !out.ok){ pin = ""; say("signSay", plain(out && out.error) || "The live server did not open it.", true); focusPin(); return; }
    HOW = how;
    storeSet(NAME_KEY, who);
    $("signPin").value = "";
    say("signSay","");
    D = out; touched = Date.now();
    bellLook();
    if(!location.hash || location.hash === "#sign") history.replaceState({ n: 0 }, "", "#home");
    route();
  }, function(err){
    busy = false; $("signGo").disabled = false;
    if(pin) { pin = ""; say("signSay", plain(err) || "The live server did not answer.", true); }
    focusPin();
  });
}

/* The PIN box, whenever a name is in the box and the PIN is not. Called
   inside the change handler as well, so iOS raises the keypad: a focus from
   a timer is not one the phone will open the keypad for. */
function focusPin(){
  var n = $("signName"), p = $("signPin");
  if(n && p && n.value && !p.value && !busy && !pin){ try{ p.focus(); }catch(e){} }
}

function lock(words){
  pin = ""; D = null; HOW = /^Locked after/.test(words || "") ? "idle" : "";
  $("signPin").value = ""; BOOK = { sunday:"", data:null }; RUNS = { sunday:"", data:null }; REP = { name:"", data:null };
  closeSheet();
  say("signSay", words || "", !!words);
  /* The address is left alone, so keying the PIN again goes back to where
     he was. */
  route();
}

function say(id, t, bad){
  var el = $(id); if(!el) return;
  el.textContent = t || "";
  el.className = bad ? "say bad" : "say";
}

/* ---- screens ------------------------------------------------------------- */

var TITLES = { home:"Coordinator", rota:"Rota", sunday:"Rota", requests:"Rota requests", bookings:"Bookings",
               defects:"Defects", buses:"Buses", bus:"Bus", drivers:"Drivers", stops:"Bus stops", runs:"Run record", look:"Have a look", report:"Have a look",
               activity:"What has been done", rehearsal:"Rehearsal", sign:"Coordinator" };

/* Each screen is a step in the phone's own history, so its back gesture
   works. The bar's back arrow never leaves the app: at the first step it
   goes home.

   SWITCHING WITHIN A SCREEN IS NOT A STEP, from v1.90.0. Another Sunday on
   Bookings or the Run record replaces the one on show, so one Back leaves
   the screen however many dates were looked at; five dates used to take five
   Backs. And a Sunday opened from the first screen is opened from inside the
   Rota: Back goes to the list of Sundays, and Back again home, which is why
   the first screen no longer needs a Rota button of its own. */
function go(where){
  var now = current().name, to = String(where).split("/")[0] || "home";
  if(to === now && to !== "home"){ history.replaceState(history.state, "", "#" + where); route(); return; }
  if(to === "sunday" && now === "home"){ seq++; history.pushState({ n: seq }, "", "#rota"); }
  seq++; history.pushState({ n: seq }, "", "#" + where); route();
}
function barHeight(){
  var b = document.querySelector(".bar");
  if(b && b.offsetHeight) document.documentElement.style.setProperty("--bar-h", b.offsetHeight + "px");
}
window.addEventListener("resize", barHeight);
function back(){
  if(history.state && history.state.n > 0) history.back();
  else { history.replaceState({ n: 0 }, "", "#home"); route(); }
}

function route(){
  var h = String(location.hash || "").replace(/^#/,"");
  var name = h.split("/")[0] || "home";
  var arg = decodeURIComponent(h.split("/").slice(1).join("/"));
  if(!pin || !D) name = "sign";
  else if(name === "sign" || !TITLES[name]) name = "home";
  Array.prototype.forEach.call(document.querySelectorAll(".screen"), function(s){
    s.classList.toggle("is-on", s.id === "s-" + name);
  });
  document.querySelector(".bar").classList.toggle("is-away", name === "sign");
  document.body.classList.toggle("bar-away", name === "sign");
  $("barTitle").textContent = TITLES[name];
  $("barSub").textContent = (name === "sign" || !who) ? "RCCG Dominion Assembly Liverpool" : who;
  $("barBack").hidden = (name === "home" || name === "sign");
  $("barLock").hidden = (name !== "home");
  bellPaint(name);
  paint(name, arg);
  barHeight();
  window.scrollTo(0, 0);
}

function current(){
  var h = String(location.hash || "").replace(/^#/,"");
  return { name: h.split("/")[0] || "home", arg: decodeURIComponent(h.split("/").slice(1).join("/")) };
}

function paint(name, arg){
  if(name === "sign"){ signNames(); $("signVersion").innerHTML = versionHTML(); focusPin(); return; }
  if(name === "home") return paintHome();
  if(name === "rota") return paintRota();
  if(name === "sunday") return paintSunday(arg || D.today);
  if(name === "requests") return paintRequests();
  if(name === "bookings") return paintBookings(arg || D.today);
  if(name === "defects") return paintDefects();
  if(name === "buses") return paintBuses();
  if(name === "drivers") return paintDrivers();
  if(name === "stops") return paintStops();
  if(name === "bus") return paintBus(arg);
  if(name === "runs") return paintRuns(arg || "");
  if(name === "look") return paintLook();
  if(name === "report") return paintReport(arg || "bookings");
  if(name === "activity") return paintActivity();
  if(name === "rehearsal") return paintRehearsal();
}

/* Each part kept whole, and the dot goes with the part after it, so a
   narrow phone breaks the line before a dot and never leaves one hanging. */
function versionPart(label, v, dot){
  return '<span class="vpart">' + (dot ? "\u00B7 " : "") + label + ' ' + esc(v) + '</span>';
}
function versionHTML(){
  /* "app", as the driver app and the passenger page say it: the three pages
     are one release with one number, from v1.83.0. */
  return versionPart("app", PAGE_VERSION) +
         (lastSeen.server ? " " + versionPart("server", lastSeen.server, true) : "") +
         (lastSeen.sheet ? " " + versionPart("sheet", lastSeen.sheet, true) : "");
}

/* The current screen again, from a fresh answer. */
function refresh(){
  if(!pin || !D) return;
  var c = current();
  api("load", {}).then(function(out){
    if(!out || !out.ok) return;
    D = out;
    /* These two carry their own data, fetched again in the background and
       drawn when it lands, so the list does not blank while it does. */
    if(c.name === "bookings") loadBookings(c.arg || D.today);
    if(c.name === "runs" && RUNS.sunday) loadRuns(RUNS.sunday);
    if(SHEET.open) return;              /* a choice half made is not redrawn under him */
    var now = current();
    if(now.name === c.name && now.arg === c.arg) paint(c.name, c.arg);
  }, function(){});
}

/* ---- the rota, read ------------------------------------------------------- */

function rows(){ return (D && D.rota && D.rota.rows) || []; }
function rowFor(key){ var r = rows(); for(var i=0;i<r.length;i++) if(r[i].date === key) return r[i]; return null; }

/* The shelf's rows say "actual" for North whether or not anybody is covering.
   The tab's own two columns, worked out again. */
function legs(r){
  var n = String(r.primary||"").trim(), na = String(r.actual||"").trim();
  var s = String(r.primary2||"").trim(), sa = String(r.actual2||"").trim();
  return {
    North: { sched:n, cover:(na && na !== n) ? na : "", bus:r.northBus || "" },
    South: { sched:s, cover:(sa && sa !== s) ? sa : "", bus:r.southBus || "" }
  };
}
function isOff(status, route){
  var st = String(status||"").trim();
  return st === "Cancelled/declined" || st === route + " cancelled";
}
function statusTag(st){
  st = String(st||"").trim();
  if(!st || st === "Confirmed") return "";
  var tone = /cancel/i.test(st) || st === "No driver assigned" ? "stop"
           : st === "Change requested" ? "warn" : st === "Covered" ? "info" : "";
  return '<span class="tag '+tone+'">'+esc(st === "Cancelled/declined" ? "Called off" : st)+'</span>';
}
function pendingFor(key){
  return ((D && D.requests) || []).filter(function(q){ return q.sunday === key && q.status === "Pending"; });
}
function activeDrivers(){ return ((D && D.drivers) || []).filter(function(d){ return d.active; }); }

/* The last Sunday each man drove, from the rota rows already here. */
function lastDrove(name){
  var best = "";
  rows().forEach(function(r){
    if(r.date >= D.today) return;
    var l = legs(r);
    ["North","South"].forEach(function(rt){
      var drove = l[rt].cover || l[rt].sched;
      if(same(drove, name) && !isOff(r.status, rt) && r.date > best) best = r.date;
    });
  });
  return best;
}

function sunCard(key, now, cue){
  var r = rowFor(key);
  if(!r) return "";
  var l = legs(r), seats = (D.seats && D.seats[key]) || {};
  var h = '<button class="sun'+(now?' now':'')+'" type="button" data-go="sunday/'+esc(key)+'">' +
          '<div class="sun-head"><span class="sun-date">'+esc(now ? longDay(key) : shortDay(key))+'</span>' +
          statusTag(r.status) +
          (pendingFor(key).length && r.status !== "Change requested" ? '<span class="tag warn">Request</span>' : '') +
          (r.coordPending ? '<span class="tag info">To the sheet</span>' : '') +
          (cue ? '<span class="sun-cue">Rota \u203A</span>' : '') + '</div>';
  ["North","South"].forEach(function(rt){
    var g = l[rt], off = isOff(r.status, rt);
    if(!g.sched && !g.cover && rt === "South" && !off) return;
    var name = g.cover || g.sched;
    var s = seats[rt];
    h += '<div class="leg"><span class="leg-rt">'+rt+'</span>' +
         '<span class="leg-who'+(off?' off':'')+'">'+(off ? 'Called off' : esc(name || 'Nobody'))+
           (!off && g.cover ? '<small>covering '+esc(g.sched)+'</small>' : '')+'</span>' +
         '<span class="leg-end">' +
           (s && !off && s.seats ? '<span class="seats'+(s.booked > s.seats ? ' over' : '')+'">'+s.booked+'/'+s.seats+'</span>' : '') +
           (g.bus && !off ? '<span class="plate">'+esc(g.bus)+'</span>' : '') +
         '</span></div>';
  });
  return h + '</button>';
}

/* ---- home ------------------------------------------------------------------ */

function arrivalOf(route){
  var s = ((D && D.stops) || []).filter(function(x){ return x.route === route && x.arrival; })[0];
  return s ? s.time : "";
}
function addMin(t, n){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(t||"")); if(!m) return "";
  var x = (+m[1])*60 + (+m[2]) + n;
  return ("0"+Math.floor(x/60)).slice(-2)+":"+("0"+(x%60)).slice(-2);
}

function needs(){
  var out = [];
  /* First, because while one runs every phone shows the test and not the
     real thing. */
  if(D && D.rehearsal) out.push({ tone:"warn", text:"A rehearsal is running until " + hhmm(D.rehearsal.ends) + ".", go:"rehearsal" });
  var chk = (D && D.checks) || {};
  Object.keys(chk).forEach(function(reg){
    if(chk[reg] && chk[reg].state === "stopped") {
      out.push({ tone:"stop", text: reg + " was stopped at the walkaround.", btn:"Authorise", data:'data-do="authorise" data-reg="'+esc(reg)+'"' });
    }
  });
  var runs = (D && D.runs) || {};
  Object.keys(runs).forEach(function(rt){
    var r = runs[rt];
    if(!r || !r.started || r.ended) return;
    var due = addMin(arrivalOf(rt), 30);
    if(D.londonToday === D.today && due && hhmm(Date.now()) > due) {
      out.push({ tone:"warn", text:"The " + rt + " run is still open.", btn:"End it", data:'data-do="endrun" data-route="'+esc(rt)+'"' });
    }
  });
  var pend = ((D && D.requests) || []).filter(function(q){ return q.status === "Pending"; }).length;
  if(pend) out.push({ tone:"warn", text: pend === 1 ? "A rota request is waiting." : pend + " rota requests are waiting.", go:"requests" });
  Object.keys((D && D.seats) || {}).forEach(function(key){
    Object.keys(D.seats[key]).forEach(function(rt){
      var s = D.seats[key][rt];
      if(s && !s.off && s.seats && s.booked > s.seats) {
        out.push({ tone:"stop", text: rt + " is over by " + (s.booked - s.seats) + " on " + shortDay(key) + ".", go:"bookings/" + key });
      }
    });
  });
  /* Faults, not reports: three walkarounds finding one tyre are one tyre. */
  var crit = defectGroups((D && D.defects) || []).filter(function(g){ return g.crit && g.kind !== "Advisory"; }).length;
  if(crit) out.push({ tone:"stop", text: crit === 1 ? "A critical defect is open." : crit + " critical defects are open.", go:"defects" });
  var refused = ((D && D.activity) || []).filter(function(x){ return x.state === "refused" && Date.now() - x.made < 2 * 86400000; }).length;
  if(refused) out.push({ tone:"stop", text: refused === 1 ? "The sheet did not take a change." : "The sheet did not take " + refused + " changes.", go:"activity" });
  return out;
}

function paintHome(){
  var h = '';
  needs().forEach(function(n){
    if(n.go) h += '<button class="need '+n.tone+'" type="button" data-go="'+esc(n.go)+'"><p>'+esc(n.text)+'</p><span class="go">\u203A</span></button>';
    else h += '<div class="need '+n.tone+'"><p>'+esc(n.text)+'</p><button class="mini" type="button" '+n.data+'>'+esc(n.btn)+'</button></div>';
  });
  if(D.rota && D.rota.error){
    h += '<div class="need stop"><p>The rota has not reached the live server.</p></div>';
  }
  h += sunCard(D.today, true, true) || '<div class="card"><p class="tiny">'+esc(longDay(D.today))+' is not on the live server’s rota.</p>' +
       '<button class="mini" type="button" data-go="rota">Rota</button></div>';
  if(D.open && D.open !== D.today) h += sunCard(D.open, false, true);

  var pend = (D.requests || []).filter(function(q){ return q.status === "Pending"; }).length;
  var bk = D.open || D.today;
  var booked = 0, sk = (D.seats && D.seats[bk]) || {};
  Object.keys(sk).forEach(function(rt){ booked += Number(sk[rt].booked) || 0; });
  var defs = defectGroups(D.defects || []).length;
  var jobs = 0, jv = (D.vehicles && D.vehicles.jobs) || {};
  Object.keys(jv).forEach(function(r){ jobs += ((jv[r] && jv[r].jobs) || []).length; });
  var waiting = Number(D.waiting) || 0;
  var item = function(go, t, n, tone){
    return '<li><button type="button" data-go="'+go+'"><span class="t">'+t+'</span>' +
           (n ? '<span class="n '+(tone||'')+'">'+esc(n)+'</span>' : '') + '<span class="go">›</span></button></li>';
  };
  h += '<ul class="menu">' +
       item("requests", "Rota requests", pend ? pend + " waiting" : "none waiting", pend ? "warn" : "") +
       item("bookings/" + bk, "Bookings", booked + " booked" + (bk !== D.today ? " for " + shortDay(bk) : ""), "") +
       item("defects", "Defects", defs ? defs + " open" : "none open", defs ? "warn" : "") +
       /* A live server from before w2.30.0 sends no vehicle log. */
       (D && D.vehicles ? item("buses", "Buses", jobs ? (jobs === 1 ? "1 job to arrange" : jobs + " jobs to arrange") : "", jobs ? "warn" : "") : "") +
       /* A live server from before w2.34.0 sends no register. */
       (D && D.register ? item("drivers", "Drivers", D.register.drivers.filter(function(x){ return x.active; }).length + " active", "") : "") +
       /* A live server from before w2.35.0, or a sheet before v1.98.0, sends no stops. */
       (D && D.stopsReg ? item("stops", "Bus stops", D.stopsReg.stops.filter(function(x){ return x.active && x.type === "Pickup"; }).length + " in use", "") : "") +
       item("runs", "Run record", "") +
       /* A live server from before w2.20.0 cannot run one from here. */
       (D && ("rehearsal" in D) ? item("rehearsal", "Rehearsal", D.rehearsal ? "until " + hhmm(D.rehearsal.ends) : "",
                                      D.rehearsal ? "warn" : "") : "") +
       item("look", "Have a look", "") +
       item("activity", "What has been done", waiting ? waiting + " on the way" : "", waiting ? "warn" : "") +
       '</ul>';
  /* Signed in, so the way back carries him: to the driver app's hub, not its
     name screen. The link on the sign-in screen has no PIN to carry and stays
     a plain link. */
  /* The two ways out, side by side and alike, because both leave this app
     for the driver app: to its hub, or straight to choosing a bus. */
  h += '<div class="foot-links">' +
       '<a class="foot-link" href="../" data-do="driverapp">Driver app</a>' +
       '<a class="foot-link" href="../" data-do="check">Vehicle check</a></div>';
  $("homeBody").innerHTML = h;
}

/* ---- the rota -------------------------------------------------------------- */

function paintRota(){
  var h = '';
  if(D.rota && D.rota.error) h += '<div class="need stop"><p>The rota has not reached the live server.</p></div>';
  var ahead = rows().filter(function(r){ return r.date >= D.today; });
  ahead.slice(0, ROTA_SHOW).forEach(function(r){ h += sunCard(r.date, r.date === D.today); });
  if(ahead.length > ROTA_SHOW) h += '<button class="btn btn-ghost btn-wide" type="button" data-do="more" style="margin-top:12px">More Sundays</button>';
  $("rotaBody").innerHTML = h;
}

function paintSunday(key){
  var r = rowFor(key);
  if(!r){ $("sundayBody").innerHTML = '<h1>'+esc(longDay(key))+'</h1><div class="card"><p class="tiny">Not on the live server’s rota.</p></div>'; return; }
  var l = legs(r), past = key < D.today;
  var st = String(r.status || "");
  var mode = st === "Cancelled/declined" ? "all" : st === "North cancelled" ? "North" : st === "South cancelled" ? "South" : "on";
  var h = '<p class="eyebrow">Rota '+statusTag(st)+(r.coordPending ? ' <span class="tag info">To the sheet</span>' : '')+'</p>' +
          '<h1>'+esc(longDay(key))+'</h1>';
  if(!past) pendingFor(key).forEach(function(q){ h += reqCard(q, true); });
  if(!past){
    var seg = function(m, t){ return '<button type="button" class="'+(mode === m ? 'on' + (m !== "on" ? ' off' : '') : '')+'" data-do="status" data-key="'+esc(key)+'" data-mode="'+m+'">'+t+'</button>'; };
    h += '<div class="seg">' + seg("on","Both running") + seg("North","North off") + seg("South","South off") + seg("all","All off") + '</div>';
  }
  ["North","South"].forEach(function(rt){
    var g = l[rt], off = isOff(st, rt), lo = rt.toLowerCase();
    var btn = function(slot, word){ return past ? '' : '<span class="acts"><button class="mini" type="button" data-do="'+(slot === "bus" ? 'bus' : 'driver')+'" data-key="'+esc(key)+'" '+(slot === "bus" ? 'data-route="'+rt+'"' : 'data-slot="'+slot+'"')+'>'+word+'</button></span>'; };
    h += '<div class="card route-card"><h3>'+rt+(off ? ' · called off' : '')+'</h3>';
    h += '<div class="row"><span class="k">Driver</span><span class="v'+(g.sched?'':' none')+'">'+esc(g.sched || 'Nobody')+'</span>' + btn(lo, "Change") + '</div>';
    h += '<div class="row"><span class="k">Cover</span><span class="v'+(g.cover?'':' none')+'">'+esc(g.cover || 'Nobody')+'</span>' + btn(lo + "Cover", g.cover ? "Change" : "Add") + '</div>';
    h += '<div class="row"><span class="k">Bus</span><span class="v">'+(g.bus ? '<span class="plate">'+esc(g.bus)+'</span>' : '<span class="none">Not known</span>')+'</span>' + btn("bus", "Change") + '</div>';
    h += '</div>';
  });
  var notes = noteLines(r);
  /* From v1.93.0 each note can be changed or taken off, except the sheet's own
     Swapped and PROTECTED lines. */
  if(notes.length) h += '<div class="card"><h3 style="margin-top:0">Notes</h3><ul class="notes">'+notes.map(function(n, i){
    if(past || NOTE_OWN.test(n) || !D.noteEdits) return '<li>'+esc(n)+'</li>';
    return '<li class="ed"><span class="t">'+esc(n)+'</span><span class="acts">' +
           '<button class="mini" type="button" data-do="noteedit" data-key="'+esc(key)+'" data-i="'+i+'">Change</button>' +
           '<button class="mini" type="button" data-do="noteoff" data-key="'+esc(key)+'" data-i="'+i+'">Take off</button></span></li>';
  }).join("")+'</ul></div>';
  if(!past) h += '<button class="btn btn-ghost btn-wide" type="button" data-do="note" data-key="'+esc(key)+'" style="margin-top:10px;min-height:46px;font-size:16px">Add a note</button>';
  $("sundayBody").innerHTML = h;
}

/* Who could go in a slot, and what the eye needs to choose: already out that
   morning, and when each last drove. */
function pickDriver(key, slot){
  var r = rowFor(key); if(!r) return;
  var l = legs(r);
  var rt = slot.indexOf("south") === 0 ? "South" : "North", ot = rt === "North" ? "South" : "North";
  var cover = /Cover$/.test(slot);
  var other = l[ot].cover || l[ot].sched;
  var cur = cover ? l[rt].cover : l[rt].sched;
  var people = activeDrivers().map(function(d){
    return { name:d.name, busy: same(d.name, other) && !isOff(r.status, ot), cur: same(d.name, cur),
             sched: cover && same(d.name, l[rt].sched), last: lastDrove(d.name) };
  }).filter(function(p){ return !p.sched; });
  people.sort(function(a,b){
    if(a.busy !== b.busy) return a.busy ? 1 : -1;
    if(!!a.last !== !!b.last) return a.last ? -1 : 1;
    if(a.last !== b.last) return a.last < b.last ? -1 : 1;
    return a.name < b.name ? -1 : 1;
  });
  var list = '<ul class="pick">' +
    (cover && cur ? '<li><button type="button" data-pick="-"><b>Nobody</b><small>take the cover off</small></button></li>' : '') +
    people.map(function(p){
      var hint = p.busy ? "on " + ot + " that morning" : p.cur ? "down now" : p.last ? "last drove " + shortDay(p.last).slice(4) : "";
      return '<li><button type="button" data-pick="'+esc(p.name)+'"'+(p.busy || p.cur ? ' disabled' : '')+'><b>'+esc(p.name)+'</b><small>'+esc(hint)+'</small></button></li>';
    }).join("") + '</ul>';
  var soon = (parts(key) && daysTo(key) <= 7);
  openSheet({
    eyebrow: shortDay(key),
    title: rt + (cover ? " cover" : " driver"),
    body: list,
    go: cover ? "Choose who covers" : "Choose who drives",
    onPick: function(name){
      if(name === "-") return "Take " + cur + " off";
      return cover ? name + " covers " + rt : "Put " + name + " on " + rt;
    },
    line: soon ? "The drivers are emailed." : "",
    onGo: function(name){ var set = {}; set[slot] = name === "-" ? "" : name; act({ kind:"rota", sunday:key, set:set }); }
  });
}

function daysTo(key){
  var p = parts(key), t = parts(D.londonToday || D.today);
  if(!p || !t) return 99;
  return Math.round((Date.UTC(p.y,p.mo-1,p.d) - Date.UTC(t.y,t.mo-1,t.d)) / 86400000);
}

function pickBus(key, rt){
  var r = rowFor(key); if(!r) return;
  var l = legs(r), ot = rt === "North" ? "South" : "North";
  var cur = l[rt].bus, other = l[ot].bus;
  var buses = ((D && D.buses) || []).filter(function(b){ return b.active; });
  var list = '<ul class="pick">' + buses.map(function(b){
    var hint = b.reg === cur ? "on " + rt + " now" : b.reg === other ? "on " + ot + ": swap them" : seatWords(b.seats);
    return '<li><button type="button" data-pick="'+esc(b.reg)+'"'+(b.reg === cur ? ' disabled' : '')+'><b>'+esc(b.reg)+'</b><small>'+esc(hint)+'</small></button></li>';
  }).join("") +
  '<li><button type="button" data-pick="-"><b>The monthly bus</b><small>as the rotation has it</small></button></li></ul>';
  openSheet({ eyebrow: shortDay(key), title: rt + " bus", body: list, go: "Choose a bus",
    onPick: function(reg){
      if(reg === "-") return "Back to the monthly bus";
      return reg === other ? "Swap the two buses" : "Put " + reg + " on " + rt;
    },
    onGo: function(reg){
      var set = {};
      if(reg === "-"){ set[rt === "North" ? "northBus" : "southBus"] = ""; }
      else if(reg === other){ set[rt === "North" ? "northBus" : "southBus"] = reg; set[ot === "North" ? "northBus" : "southBus"] = cur; }
      else { set[rt === "North" ? "northBus" : "southBus"] = reg; }
      act({ kind:"rota", sunday:key, set:set });
    } });
}

function setStatus(key, mode){
  var r = rowFor(key); if(!r) return;
  var st = String(r.status || "");
  var now = st === "Cancelled/declined" ? "all" : st === "North cancelled" ? "North" : st === "South cancelled" ? "South" : "on";
  if(now === mode) return;
  var want = mode === "all" ? "Cancelled/declined" : mode === "North" ? "North cancelled" : mode === "South" ? "South cancelled" : "running";
  var title = mode === "on" ? "Both routes running on " + shortDay(key) + "?"
            : mode === "all" ? "Call off both routes on " + shortDay(key) + "?"
            : "Call off " + mode + " on " + shortDay(key) + "?";
  var line = mode === "on" ? "Anyone already told a route was off is not told it is back on."
           : mode === "all" ? "Everyone booked is told the bus is not running."
           : "Anyone booked on " + mode + " is told it is not running." +
             (now !== "on" ? " " + (mode === "North" ? "South" : "North") + " runs." : "");
  openSheet({ eyebrow: "Rota", title: title, line: line,
              go: mode === "on" ? "Both routes running" : mode === "all" ? "Call off both" : "Call off " + mode,
              stop: mode !== "on",
              onGo: function(){ act({ kind:"rota", sunday:key, set:{ status: want } }); } });
}

var NOTE_OWN = /^(swapped\s*:|protected\b)/i;
function noteLines(r){
  return String((r && r.notes) || "").split("\n").map(function(x){ return x.replace(/\s+/g, " ").trim().replace(/^'/, ""); }).filter(Boolean);
}
/* A note changed (off false) or taken off (off true), from v1.93.0. */
function editNote(key, i, off){
  var was = noteLines(rowFor(key))[Number(i)];
  if(!was || NOTE_OWN.test(was)) return;
  if(off){
    openSheet({ eyebrow: shortDay(key), title: "Take off this note", line: was, go: "Take it off", stop: true,
                onGo: function(){ act({ kind:"rota", sunday:key, noteEdit:{ was: was, now: "" } }); } });
    return;
  }
  /* A line typed longer on the Rota tab can stay as long. */
  var most = Math.max(300, was.length);
  openSheet({ eyebrow: shortDay(key), title: "Change the note",
              body: '<div class="field"><label for="noteText">Note</label><textarea id="noteText" maxlength="'+most+'">'+esc(was)+'</textarea></div>',
              go: "Save",
              onGo: function(){
                var t = String(($("noteText") || {}).value || "").replace(/\s+/g, " ").trim();
                if(!t){ sheetSay("Write the note, or use Take off.", true); return; }
                if(t.length > most){ sheetSay("Notes are " + most + " characters at most.", true); return; }
                if(NOTE_OWN.test(t)){ sheetSay("Swapped and PROTECTED lines are changed on the Rota tab.", true); return; }
                if(t === was){ sheetSay("Nothing has changed.", true); return; }
                act({ kind:"rota", sunday:key, noteEdit:{ was: was, now: t } });
              } });
}

function addNote(key){
  openSheet({ eyebrow: shortDay(key), title: "Add a note",
              body: '<div class="field"><label for="noteText">Note</label><textarea id="noteText" maxlength="300"></textarea></div>',
              go: "Add the note",
              onGo: function(){
                var t = String(($("noteText") || {}).value || "").trim();
                if(!t){ sheetSay("Write the note first.", true); return; }
                act({ kind:"rota", sunday:key, note:t });
              } });
  setTimeout(function(){ try{ $("noteText").focus(); }catch(e){} }, 150);
}

/* ---- requests ---------------------------------------------------------------- */

function typeWords(q){
  var t = String(q.type || "");
  return t === "Request a swap" ? "Swap" : t === "Request cover" ? "Cover" : t.replace(/^Request /i, "") || "Request";
}
function reqCard(q, here){
  var swap = q.type === "Request a swap";
  var h = '<div class="req"><div class="req-head"><b>'+esc(q.driver)+'</b><span class="tag warn">'+esc(typeWords(q))+'</span></div>';
  if(!here) h += '<p>'+esc(longDay(q.sunday))+'</p>';
  if(swap && q.swapWith) h += '<p>With '+esc(q.swapWith)+(q.theirSunday ? ', who has '+esc(shortDay(q.theirSunday)) : '')+
                              (q.bothAgreed ? ' · both agreed' : '')+'</p>';
  if(q.reason) h += '<p class="why">“'+esc(q.reason)+'”</p>';
  if(q.received && !here) h += '<p class="tiny">Asked '+esc(when(q.received))+'</p>';
  h += '<div class="req-acts"><button class="btn btn-ghost" type="button" data-do="deny" data-id="'+esc(q.id)+'">Turn down</button>' +
       '<button class="btn btn-main" type="button" data-do="approve" data-id="'+esc(q.id)+'">Approve</button></div></div>';
  return h;
}

function paintRequests(){
  var all = D.requests || [];
  var pend = all.filter(function(q){ return q.status === "Pending"; });
  var done = all.filter(function(q){ return q.status !== "Pending"; });
  var h = '';
  if(!pend.length) h += '<div class="card"><p class="tiny" style="margin:0">None waiting.</p></div>';
  pend.forEach(function(q){ h += reqCard(q); });
  if(done.length){
    h += '<h3>Decided</h3><ul class="list">' + done.map(function(q){
      var ok = q.status === "Approved";
      return '<li><span class="tag '+(ok ? 'pass' : 'stop')+'">'+(ok ? 'Approved' : 'Turned down')+'</span> ' +
             '<b>'+esc(q.driver)+'</b>, '+esc(shortDay(q.sunday)) +
             (ok && q.replacement ? ', '+esc(q.replacement)+' covering' : '') +
             (q.waiting ? ' <span class="tag info">To the sheet</span>' : '') +
             (q.decidedBy ? '<small>'+esc(q.decidedBy)+(q.decidedAt ? ', '+esc(when(q.decidedAt)) : '')+'</small>' :
               (q.decidedOn ? '<small>'+esc(when(q.decidedOn))+'</small>' : '')) + '</li>';
    }).join("") + '</ul>';
  }
  $("requestsBody").innerHTML = h;
}

function reqById(id){ var a = (D && D.requests) || []; for(var i=0;i<a.length;i++) if(a[i].id === id) return a[i]; return null; }

function approve(id){
  var q = reqById(id); if(!q) return;
  if(q.type === "Request a swap"){
    openSheet({ eyebrow: q.driver, title: "Approve the swap?",
                line: q.swapWith ? q.driver + " takes " + (q.theirSunday ? shortDay(q.theirSunday) : "their Sunday") + ". " + q.swapWith + " takes " + shortDay(q.sunday) + "." : "",
                go: "Approve the swap",
                onGo: function(){ act({ kind:"decide", requestId:id, choice:"Approved" }); } });
    return;
  }
  var c = (q.candidates || []).slice();
  c.sort(function(a,b){
    if(!!a.busy !== !!b.busy) return a.busy ? 1 : -1;
    if(!!a.last !== !!b.last) return a.last ? -1 : 1;
    if((a.last||"") !== (b.last||"")) return (a.last||"") < (b.last||"") ? -1 : 1;
    return a.name < b.name ? -1 : 1;
  });
  var list = '<ul class="pick"><li><button type="button" data-pick="-" class="on"><b>Nobody yet</b><small>arrange cover later</small></button></li>' +
    c.map(function(p){
      var hint = p.busy ? "on " + p.busy + " that morning" : p.last ? "last drove " + shortDay(p.last).slice(4) : "";
      return '<li><button type="button" data-pick="'+esc(p.name)+'"'+(p.busy ? ' disabled' : '')+'><b>'+esc(p.name)+'</b><small>'+esc(hint)+'</small></button></li>';
    }).join("") + '</ul>';
  openSheet({ eyebrow: q.driver + ", " + shortDay(q.sunday), title: "Who covers it?", body: list,
              picked: "-", go: "Approve, nobody covering yet",
              onPick: function(n){ return n === "-" ? "Approve, nobody covering yet" : "Approve, " + n + " covers"; },
              onGo: function(n){ act({ kind:"decide", requestId:id, choice:"Approved", cover: n === "-" ? "" : n }); } });
}

function deny(id){
  var q = reqById(id); if(!q) return;
  openSheet({ eyebrow: shortDay(q.sunday), title: "Turn down " + q.driver + "’s request?",
              line: q.driver + " is emailed.", go: "Turn it down", stop: true,
              onGo: function(){ act({ kind:"decide", requestId:id, choice:"Rejected" }); } });
}

/* ---- bookings ---------------------------------------------------------------- */

function loadBookings(key){
  BOOK.loading = key;
  api("bookings", { sunday:key }).then(function(out){
    if(BOOK.loading !== key) return;
    BOOK.loading = "";
    if(!out || !out.ok){ $("bookingsBody").innerHTML = '<div class="card"><p class="say bad">'+esc(plain(out && out.error) || "No answer.")+'</p></div>'; return; }
    BOOK = { sunday:key, data:out };
    var c = current();
    if(c.name === "bookings" && (c.arg || D.today) === key) paintBookings(key);
  }, function(){ BOOK.loading = ""; });
}

function paintBookings(key){
  var chips = [D.today, plusWeeks(D.today, 1)];
  var h = '<div class="chips stick">' + chips.map(function(k){
    return '<button type="button" class="'+(k === key ? 'on' : '')+'" data-go="bookings/'+esc(k)+'">'+esc(shortDay(k))+'</button>';
  }).join("") + '</div>';
  if(!BOOK.data || BOOK.sunday !== key){
    $("bookingsBody").innerHTML = h + '<p class="tiny center">Loading…</p>';
    if(BOOK.loading !== key) loadBookings(key);
    return;
  }
  var b = BOOK.data;
  if(b.mayAct) h += '<button class="btn btn-main btn-wide" type="button" data-do="book" data-key="'+esc(key)+'" style="margin:0 0 12px">Book a seat for someone</button>';
  b.routes.forEach(function(rt){
    var bus = rt.bus || {};
    var head = rt.off ? '<span class="tag stop">Called off</span>'
      : (bus.reg ? '<span class="plate">'+esc(bus.reg)+'</span> ' : '') +
        (bus.seats ? '<span class="seats'+(bus.booked > bus.seats ? ' over' : '')+'">'+bus.booked+'/'+bus.seats+'</span>' : '') +
        (rt.ended ? ' <span class="tag">Run over</span>' : '');
    var booked = rt.stops.filter(function(s){ return s.bookings.length; });
    var empty = rt.stops.length - booked.length, every = !!BOOK_ALL[rt.route];
    h += '<div class="card"><div class="bk-head"><b>'+esc(rt.route)+'</b>'+head+'</div>';
    if(!booked.length && !every) h += '<p class="bk-none">Nobody booked.</p>';
    (every ? rt.stops : booked).forEach(function(s){
      h += '<div class="bs'+(s.seats ? '' : ' nobody')+(s.passed ? ' passed' : '')+'"><div class="bs-h"><span class="tm">'+esc(s.time)+'</span>' +
           '<span class="nm">'+sid(s.id)+esc(s.stop)+(s.passed ? ' <span class="tag">Passed</span>' : '')+'</span><span class="ct">'+(s.seats || '–')+'</span></div>';
      s.bookings.forEach(function(k){
        /* Taken when this number was another place. The seat is still good,
           by number; the passenger booked the old place, and their own page
           asks them about it. Said here so whoever rings round knows. */
        var moved = k.stop && !sameStop(k.stop, s.stop);
        h += '<div class="bk"><span class="who"><span class="n">'+esc(seatWords(k.seats))+'</span>' +
             (k.phone ? '<a href="tel:'+esc(k.phone)+'">'+esc(phoneWords(k.phone))+'</a>' : '<span>no number</span>') +
             (k.coord ? '<span class="tag info">By phone</span>' : '') +
             (moved ? '<small class="moved">Booked when '+esc(s.id)+' was '+esc(k.stop)+'</small>' : '') + '</span>' +
             (b.mayAct && !k.rehearsal ? '<button class="mini warn" type="button" data-do="cancel" data-id="'+k.id+'">Cancel</button>' : '') + '</div>';
      });
      h += '</div>';
    });
    if(empty) h += '<button class="bs-more" type="button" data-do="empties" data-route="'+esc(rt.route)+'">' +
                   (every ? 'Booked stops only' : (empty === 1 ? '1 stop' : empty + ' stops') + ' with nobody booked') + '</button>';
    h += '</div>';
  });
  if(b.cancelled && b.cancelled.length){
    h += '<details class="more"><summary>Cancelled ('+b.cancelled.length+')</summary><ul class="list">' + b.cancelled.map(function(k){

/* ---- defects ------------------------------------------------------------------ */

var DEF_STATES = ["Open", "Booked in", "Parts on order", "Monitoring", "Fixed", "Not a defect"];

/* THE ITEMS ON DVSA'S DAILY WALKAROUND CHECK, by the name a defect carries.
   The driver app holds the same list by item (DVSA_DAILY in index.html) and
   tags its checklist with it; tests/suites/38-tidy-up.mjs reads that list
   off the driver app and holds this one to it. */
var DVSA_ITEMS = ["Tyres", "Wheel nuts", "Lights, plates and reflectors", "Passenger and cab doors", "Body and glass",
  "Clean enough to be safe", "Leaks underneath", "Brake pipes and lines", "Exhaust", "Fuel and filler cap",
  "Mudflaps and spray guards", "Screenwash", "AdBlue", "Battery", "Seat belts", "Seats and anchorages", "Step",
  "Emergency exits and signage", "Gangway, handrails and hammers", "Interior and step lighting", "Fire extinguisher",
  "First aid kit", "ABS warning lamp", "Other warning lights", "Brakes and pedals", "Steering",
  "Mirrors, wipers and washers", "Horn, heater, demist", "Driver's seat and belt"];
function isDvsa(item){
  var k = String(item || "").trim().toLowerCase();
  return DVSA_ITEMS.some(function(x){ return x.toLowerCase() === k; });
}

/* ONE CARD PER FAULT, from v1.90.0, as the driver app has shown them since
   v1.83.0. Every walkaround that finds the same fault writes another row, so
   a key remote nobody has fixed was on this screen once per inspection, and
   closing one left the others open: the driver app went on listing it as
   "Still open on this bus" from the rows nobody had closed.

   Grouped by bus and item. The weight never comes down: one critical report
   makes the card critical, and a defect outranks an advisory. The words are
   the newest report's, the count and the first date say how long it has been
   saying them, and the status is the least settled of them. Update and
   Close are for every report on the card, each listed and ticked, so one
   that is a different fault under the same heading can be left out. */
var DEF_RANK = { "Open": 0, "Parts on order": 1, "Booked in": 2, "Monitoring": 3 };
function defectGroups(list){
  var by = {}, out = [];
  (list || []).forEach(function(d){
    var k = String(d.reg || "").trim().toUpperCase() + "|" + String(d.item || "").trim().toLowerCase();
    var g = by[k];
    if(!g){ g = by[k] = { gk: k, reg: d.reg, item: d.item, reports: [], crit: false, kind: "Advisory", status: "",
                          found: "", newest: "", oldest: "", driver: "", waiting: false }; out.push(g); }
    g.reports.push(d);
    if(d.crit) g.crit = true;
    if(d.kind !== "Advisory") g.kind = "Defect";
    var st = d.status || "Open", r = DEF_RANK[st] === undefined ? 9 : DEF_RANK[st];
    if(!g.status || r < (DEF_RANK[g.status] === undefined ? 9 : DEF_RANK[g.status])) g.status = st;
    var dt = String(d.date || "");
    if(!g.newest || dt >= g.newest){ g.newest = dt; g.found = d.found || ""; g.driver = d.driver || ""; if(d.item) g.item = d.item; }
    if(dt && (!g.oldest || dt < g.oldest)) g.oldest = dt;
    if(d.waiting) g.waiting = true;
  });
  out.forEach(function(g){
    g.reports.sort(function(a, b){ return String(b.date || "") < String(a.date || "") ? -1 : String(b.date || "") > String(a.date || "") ? 1 : 0; });
    g.keys = g.reports.map(function(d){ return d.key; });
    var did = [];
    g.reports.forEach(function(d){ String(d.action || "").split("\n").forEach(function(x){ x = x.trim(); if(x && did.indexOf(x) === -1) did.push(x); }); });
    g.action = did.join("\n");
    g.trail = [].concat.apply([], g.reports.map(function(d){ return d.trail || []; }))
      .sort(function(a, b){ return (Number(a.when) || 0) - (Number(b.when) || 0); });
    g.dvsa = isDvsa(g.item);
  });
  /* Critical first, then a defect before an advisory, then the oldest. */
  return out.sort(function(a, b){
    return (b.crit - a.crit) || ((a.kind === "Advisory") - (b.kind === "Advisory")) ||
           (a.oldest < b.oldest ? -1 : a.oldest > b.oldest ? 1 : 0);
  });
}
function defectGroupByKey(gk){
  var g = defectGroups((D && D.defects) || []);
  for(var i = 0; i < g.length; i++) if(g[i].gk === gk) return g[i];
  return null;
}
function openFor(g){
  var n = g.oldest ? rnDays(g.oldest, calToday()) : null;
  return n === null || n < 0 ? "" : n === 0 ? "open since today" : n === 1 ? "open 1 day" : "open " + n + " days";
}

function paintDefects(){
  var list = D.defects || [];
  var h = '';
  if(!list.length){ $("defectsBody").innerHTML = h + '<div class="card"><p class="tiny" style="margin:0">None open.</p></div>'; return; }
  var groups = defectGroups(list);
  var regs = [];
  groups.forEach(function(g){ if(regs.indexOf(g.reg) === -1) regs.push(g.reg); });
  regs.sort().forEach(function(reg){
    h += '<h3><span class="plate">'+esc(reg)+'</span></h3>';
    groups.filter(function(g){ return g.reg === reg; }).forEach(function(g){
      var cls = g.kind === "Advisory" ? " adv" : g.crit ? " crit" : "";
      var n = g.reports.length;
      h += '<div class="def'+cls+'"><div class="def-head"><b>'+esc(g.item)+'</b>' +
           (g.kind === "Advisory" ? '<span class="tag info">Advisory</span>' : g.crit ? '<span class="tag stop">Critical</span>' : '') +
           '<span class="tag '+(g.status === "Open" ? 'warn' : '')+'">'+esc(g.status || "Open")+'</span></div>' +
           (g.dvsa ? '<p class="def-dvsa"><span class="tag dvsa">DVSA daily check</span></p>' : '') +
           (g.found ? '<p>“'+esc(g.found)+'”</p>' : '') +
           '<p class="def-age">'+esc([n > 1 ? n + " reports since " + shortDay(g.oldest) : "", openFor(g)].filter(Boolean).join(", "))+'</p>' +
           (g.action ? '<p class="did">'+esc(g.action)+'</p>' : '') +
           trailHTML(g.trail) +
           '<div class="def-foot"><p class="tiny">'+esc([g.newest ? (n > 1 ? "Last " : "") + shortDay(g.newest) : "", g.driver].filter(Boolean).join(", "))+'</p>' +
           (g.waiting ? '<span class="tag info">To the sheet</span>' : '') +
           '<button class="mini" type="button" data-do="defect" data-key="'+esc(g.gk)+'">Update</button></div></div>';
    });

  $("defectsBody").innerHTML = h;
}

function defectByKey(k){ var a = (D && D.defects) || []; for(var i=0;i<a.length;i++) if(a[i].key === k) return a[i]; return null; }

function updateDefect(gk){
  var g = defectGroupByKey(gk); if(!g) return;
  var chosen = g.status || "Open";
  /* Critical and Kind, from v1.91.0: the coordinator's judgement over the
     driver's. Sent only when changed. */
  var wasCrit = g.crit ? "YES" : "NO", crit = wasCrit;
  var wasKind = g.kind === "Advisory" ? "Advisory" : "Defect", kind = wasKind;
  var many = g.reports.length > 1;
  openSheet({ eyebrow: g.reg, title: g.item,
    body: (many ? '<div id="defReps"><p class="tiny" style="margin:0 0 2px">Reports</p>' +
            g.reports.map(function(d, i){
              return '<label class="check"><input type="checkbox" data-rep="'+i+'" checked><span>' +
                     esc([d.date ? shortDay(d.date) : "", d.driver].filter(Boolean).join(", ")) +
                     '<small>'+esc((d.found ? "“" + d.found + "”, " : "") + (d.status || "Open"))+'</small></span></label>';
            }).join("") + '</div>' : '') +
          '<div class="chips" id="defCrit">' + [["YES", "Critical"], ["NO", "Not critical"]].map(function(c){
            return '<button type="button" data-crit="'+c[0]+'" class="'+(c[0] === crit ? 'on' : '')+'">'+c[1]+'</button>';
          }).join("") + '</div>' +
          '<div class="chips" id="defKind">' + ["Defect", "Advisory"].map(function(k){
            return '<button type="button" data-kind="'+k+'" class="'+(k === kind ? 'on' : '')+'">'+k+'</button>';
          }).join("") + '</div>' +
          '<div class="chips" id="defStates">' + DEF_STATES.map(function(s){
            return '<button type="button" data-state="'+esc(s)+'" class="'+(s === chosen ? 'on' : '')+'">'+esc(s)+'</button>';
          }).join("") + '</div>' +
          '<div class="field"><label for="defDid">What was done</label><textarea id="defDid" maxlength="500"></textarea></div>',
    go: "Save",
    onGo: function(){
      var did = String($("defDid").value || "").trim();
      var reps = many ? Array.prototype.map.call(document.querySelectorAll("#defReps input[data-rep]:checked"), function(x){
        return g.reports[Number(x.getAttribute("data-rep"))]; }) : [g.reports[0]];
      if(!reps.length){ sheetSay("Tick at least one report.", true); return; }
      if((chosen === "Fixed" || chosen === "Not a defect") && !did){ sheetSay("Say what was done.", true); return; }
      var critTo = crit !== wasCrit ? crit : "", kindTo = kind !== wasKind ? kind : "";
      if(reps.every(function(d){ return chosen === (d.status || "Open"); }) && !did && !critTo && !kindTo){ sheetSay("Nothing has changed.", true); return; }
      var keys = reps.map(function(d){ return d.key; });
      var a = { kind:"defect", key:keys[0], keys:keys, status:chosen, action:did };
      if(critTo) a.crit = critTo;
      if(kindTo) a.type = kindTo;   /* not kind: that names the change */
      act(a);
    } });
  var label = function(){
    var n = many ? document.querySelectorAll("#defReps input[data-rep]:checked").length : 1;
    var closing = chosen === "Fixed" || chosen === "Not a defect";
    $("sheetGo").textContent = closing ? (n > 1 ? "Close all " + n : "Close it") : "Save";
  };
  Array.prototype.forEach.call(document.querySelectorAll("#defStates button"), function(b){
    b.onclick = function(){
      chosen = b.getAttribute("data-state");
      Array.prototype.forEach.call(document.querySelectorAll("#defStates button"), function(x){ x.classList.toggle("on", x === b); });
      if(!busy) sheetSay("");
      label();
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll("#defReps input[data-rep]"), function(x){ x.onchange = label; });
  [["#defCrit button", "data-crit", function(v){ crit = v; }], ["#defKind button", "data-kind", function(v){ kind = v; }]].forEach(function(f){
    Array.prototype.forEach.call(document.querySelectorAll(f[0]), function(b){
      b.onclick = function(){
        f[2](b.getAttribute(f[1]));
        Array.prototype.forEach.call(document.querySelectorAll(f[0]), function(x){ x.classList.toggle("on", x === b); });
        if(!busy) sheetSay("");
      };
    });
  });
  label();
}
