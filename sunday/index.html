    seatsAsk=false;
    paint();
  });
  if($("seatsDown")) $("seatsDown").addEventListener("click",function(){
    if(!seats) return;
    seats = Math.max(1, seats - 1);
    seatsAsk=false;
    paint();
  });

  if($("cancelNo")) $("cancelNo").addEventListener("click",function(){
    cancelAsk=false; paint();
  });
  if($("cancelYes")) $("cancelYes").addEventListener("click",function(){
    if(saving) return;
    this.innerHTML='<span class="spin"></span>';
    send({ date:DATE, ref:REF, pid:PID, phone:PHONE, stopId:"", seats:0 }, function(out){
      applySaved(out);
      toast("Cancelled.");
    });
  });

  /* Bring it into view the first time it appears. The bar is fixed, so
     without this the question can still be below the fold on a small phone
     with a long stop list, which is the whole fault repeating itself. */
  if(seatsAsk && $("seatsBox")){
    seatsAsk=false;
    try{ $("seatsBox").scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){}
  }

  paintBar();
}

/* ==========================================================================
   SAYING WHO YOU ARE

   One question, asked in three situations, answered by one sheet:

     the first reach for a seat on a device that has not been told;
     somebody arriving on a second phone looking for the booking they
       already hold;
     somebody saying this is not their number.

   All three end the same way: a number goes to the record, the record
   answers with everything this page needs and a fingerprint to use from
   then on, and applyBus paints from that answer exactly as it paints from
   a fresh load.

   Giving a number books nothing. It says which row is yours, if any. The
   booking is still the Confirm button.
   ========================================================================== */

/* The line under the closing time. Where the second-booking warning used to
   be, and doing the opposite job in a quarter of the words: not "this may go
   wrong" but a way in for somebody who already has a booking. */
function idBtn(id,label){
  return '<button type="button" class="ring" id="'+id+'" style="background:none;'+
         'border:none;padding:0;font:inherit;color:inherit">'+esc(label)+'</button>';
}
function identityFoot(){
  if(PID){
    return "<br>Booking as <b>"+
           (PHONE ? esc(prettyPhone(PHONE)) : "the number you gave")+"</b>. "+
           idBtn("idChange","Not you?");
  }
  return "<br>"+idBtn("idFind","Find your booking");
}
function wireIdentityFoot(){
  if($("idInstall")) $("idInstall").addEventListener("click",function(){ howOpen(false); });
  if($("idFind")) $("idFind").addEventListener("click",function(){
    askOpen({ then:function(out){
      toast(out && out.mine ? "Found it." : "No booking under that number.");
    }});
  });
  if($("idChange")) $("idChange").addEventListener("click",function(){
    askOpen({
      title:"Whose booking should this show?",
      then:function(out){
        toast(out && out.mine ? "Found it." : "No booking under that number.");
      }
    });
  });
}

/* How to open a message to a driver.

   It began "Sunday bus \u2014", which is how you label a parcel, not how you
   speak to a man who is about to turn a fifteen seater round for you.
   Courtesy is manners, and it costs three words.

   Read off the clock rather than fixed, because the runs are all morning but
   the messages are not: somebody who has just been left at a kerb may write
   at any hour, and a good morning at half past one reads as a machine wrote
   it, which is the opposite of the point. */
function greet(){
  var h=new Date().getHours();
  return h<12 ? "Good morning Sir" : (h<17 ? "Good afternoon Sir" : "Good evening Sir");
}

/* Choosing a kerb, once the record knows who is choosing. */
function tapStop(id){
  var was=chosen;
  /* A booking always has a stop. Tapping the one you hold does not clear it:
     Not coming is the way out of a booking and it says so plainly. Without
     this a booked passenger could tap their own kerb, be left holding
     nothing, and read a bar that still said Booked. */
  chosen = (chosen===id) ? (booked ? id : null) : id;
  if(chosen && chosen!==was){
    /* A new stop is a new question \u2014 unless there is already an answer
       worth carrying. Somebody moving kerb has said how many are coming and
       should not be made to say it twice. Everybody else starts empty, so
       the number sitting there can never be an answer somebody else gave. */
    seats = booked ? booked.seats : null;
  }
  seatsAsk = !!chosen && !seats;
  paint();
}

/* The tap that arrives before the record knows anybody. Ask, then either
   carry the tap through or hand back the booking they already had. */
function askThenTap(id){
  askOpen({ then:function(out){
    if(out && out.mine){
      /* They had one already: on another device, or on this one before its
         storage was cleared. applyBus has just put it on screen. Say so,
         rather than quietly replacing it with the kerb they just tapped. */
      toast("You are already booked.");
      return;
    }
    tapStop(id);
  }});
}

var askThenFn=null, askBusy=false, askErr=false;

function askOpen(o){
  o=o||{};
  /* One sheet at a time. The install offer can still be up when a tap on a
     kerb needs a number; the question wins, because it is the one the
     passenger started. */
  howClose();
  askThenFn = o.then || null;
  $("askEyebrow").textContent = o.eyebrow || "Your booking";
  $("askTitle").textContent   = o.title   || "What is your phone number?";
  /* Pre-filled with whatever this device already knows, so "Not you?" starts
     from the number being replaced rather than from an empty box. */
  $("askInput").value = PHONE ? PHONE.slice(0,5)+" "+PHONE.slice(5) : "";
  askErr=false;
  askSay("");
  askShape();
  var box=$("ask");
  box.classList.add("is-on");
  box.setAttribute("aria-hidden","false");
  /* After the sheet is up. Focusing while it is still arriving makes iOS
     scroll the page behind it instead of bringing the keypad to the box. */
  setTimeout(function(){ try{ $("askInput").focus(); }catch(e){} },70);
}

function askClose(){
  var box=$("ask");
  box.classList.remove("is-on");
  box.setAttribute("aria-hidden","true");
  askThenFn=null; askErr=false;
}

function askSay(msg,bad){
  var el=$("askSay");
  el.textContent=msg||"";
  el.classList.toggle("is-bad",!!bad);
  askErr=!!bad;
}

/* Continue stays dead until there are eleven digits starting with a zero.
   The line underneath counts them, which is the whole of what needs saying:
   a dead button beside "7 of 11" needs no sentence explaining itself. */
function askShape(){
  var v=$("askInput").value, d=phoneDigits(v), ok=!!phoneOk(v);
  $("askInput").classList.toggle("is-ok",ok);
  $("askGo").disabled = !ok || askBusy;
  if(askErr) return;
  askSay(ok ? "" : (d.length ? d.length+" of 11" : ""));
}

function askDone(){
  askBusy=false;
  $("askGo").textContent="Continue";
  askShape();
}

function askSend(){
  if(askBusy) return;
  var phone=phoneOk($("askInput").value);
  /* The button is dead without this, so it cannot fire. Checked anyway,
     because a blank reaching the record would be a row nobody can act on. */
  if(!phone){ askSay("Eleven digits, starting with 0.",true); return; }

  askBusy=true;
  $("askGo").disabled=true;
  $("askGo").innerHTML='<span class="spin"></span>';

  callFetch(ENDPOINT,{
    method:"POST", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"identify", phone:phone, ref:REF })
  }).then(function(r){ return r.text(); }).then(function(t){
    var out=readJson(t);
    askDone();
    if(!out || out.ok!==true){
      askSay((out && out.error) || "That did not go through. Try again.", true);
      return;
    }
    idSave(out.pid, out.phone || phone);
    /* Taken before the sheet closes, because closing clears it. */
    var fn=askThenFn;
    askClose();
    applyBus(out);
    if(fn) fn(out);
  }).catch(function(err){
    /* Nothing has been written here, whatever went wrong: this call creates
       no booking and changes no seat. So unlike Confirm there is nothing to
       go and check, and saying try again is the honest whole of it. */
    askDone();
    askSay(plainError(err) + " Try again.", true);
  });
}

/* The bar is the only thing that says whether the spreadsheet knows. */
function paintBar(){
  /* The question owns the screen while it is up, on either side of the
     cutoff, so its two buttons are the only controls and there is never a
     second way to answer the same thing. Guarded on booked as well, so a
     flag left set with nothing to cancel cannot strand somebody with no bar
     at all. */
  if(cancelAsk && booked){ $("bar").style.display="none"; return; }

  /* After the cutoff the bar exists for exactly one thing: letting somebody
     who is no longer coming say so. Confirm is not merely disabled but gone,
     because a seat cannot be booked, moved or resized once the driver has
     the list, and a button that could never work is a question mark on a
     screen where nobody has time for one. */
  if(CLOSED){
    if(!booked){ $("bar").style.display="none"; return; }
    $("bar").style.display="";
    $("save").style.display="none";
    $("cancel").style.display="";
    $("cancel").disabled=saving;
    $("cancel").textContent="Not coming";
    /* Two different things, so two buttons rather than one that changes its
       mind. Not coming settles the booking; this says the thing a booking
       cannot say — running late, waiting a few doors up, a pram to get on.
       Absent whenever the server has not named a driver with a number, which
       is most of the week and any Sunday nobody has filled the column in for,
       and the page reads perfectly well without it. */
    var wa=$("wa");
    /* Gone once the run has ended. The bus is at church and the service is
       starting, so every message this button could send has become a request
       nobody can act on. */
    if(DRIVER && DRIVER.wa && !(live && live.ended)){
      var at=stopById(booked.stopId);
      var where = at ? at.stop : "my stop";
      /* What the message says depends on what has happened at that kerb.

         Once the stop has been marked \u2014 either way \u2014 the passenger reading
         this may be standing there watching the bus leave, and the only thing
         worth sending is the ask. It is written as an ask and not as a report:
         a report can be argued with at the roadside, it tells a driver he
         tapped wrong when he may have been perfectly right, and it needs
         somebody to be at fault before anyone can help. This needs nobody to
         be at fault. The decision is left where it actually sits, with the
         driver and the people already aboard.

         Before that, the neutral opener: running late, waiting a few doors
         up, a pram to get on. */
      var body = (live && live.mine==="served")
        ? greet()+", I am booked on the Sunday bus at "+where+", "+
          (live.servedAt||"")+". I am sorry, I missed my bus. Please, can you "+
          "come back for me? I am here now."
        : greet()+", I am booked on the Sunday bus at "+where+". ";
      wa.href="https://wa.me/"+encodeURIComponent(DRIVER.wa)+"?text="+
              encodeURIComponent(body);
      wa.textContent="Message "+DRIVER.name;
      wa.style.display="";
    } else {
      wa.style.display="none";
    }
    var shut=$("barSay");
    shut.classList.remove("is-dirty");
    shut.textContent="";
    return;
  }

  /* Nothing chosen and nothing booked, so the bar has no job. It sat there
     regardless, carrying a dead Confirm and an empty line — a fixed strip of
     nothing, which reads as a control that has failed rather than one waiting
     its turn. Hidden until there is something to press, which also means the
     moment a stop is cleared the bar goes with it, and the clearing shows
     without a word being written about it. */
  if(!chosen && !booked){ $("bar").style.display="none"; return; }

  $("bar").style.display="";
  $("save").style.display="";
  $("wa").style.display="none";

  var d=dirty(), say=$("barSay");

  $("save").disabled = !chosen || !d || saving;
  /* Not while it is spinning. The click handler puts the spinner in before
     send repaints the bar, and writing a label here would rub it straight
     out again, leaving a dead-looking button through the whole round trip. */
  if(!saving) $("save").textContent = "Confirm";

  $("cancel").textContent = "Not coming";
  $("cancel").style.display = booked ? "" : "none";
  /* Dead while a Confirm is in the air. Both buttons write the same row, so
     tapping Not coming on top of a Confirm sent two changes for one booking
     and whichever answered last decided what the driver saw. */
  $("cancel").disabled = saving;

  say.classList.toggle("is-dirty", (d && !!chosen) || (!!chosen && !seats));

  /* Named before Confirm is mentioned. A disabled button with no reason
     beside it is the thing that sent people scrolling. */
  if(chosen && !seats)  say.textContent = "How many of you?";
  else if(d && chosen)  say.textContent = booked ? "Changed, not saved." : "Not saved yet.";
  /* The way out, said plainly. A stop that has quietly stopped responding
     with nothing to explain it is worse than one that never moved. */
  else if(booked)       say.textContent = "Booked.";
  else                  say.textContent = "";
}

function send(payload, done){
  saving=true; paintBar();
  callFetch(ENDPOINT,{
    method:"POST", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"booking", booking: payload })
  }).then(function(r){ return r.text(); }).then(function(t){
    var out=readJson(t);
    if(!out || out.ok!==true){
      /* The record answered, and the answer was no. Marked, because the two
         kinds of failure below want opposite treatment and they arrive down
         the same pipe. */
      var refusal=new Error(out && out.error ? out.error : "not saved");
      refusal.refused=true;
      /* The one refusal this page can do something about by itself. */
      refusal.needPhone=!!(out && out.needPhone);
      throw refusal;
    }
    saving=false;
    done(out);
  }).catch(function(err){
    /* A refusal is not a signal problem, and must not be dressed as one.

       The case this is really about is the cutoff. Somebody has had this page
       open in a pocket since twenty past nine, taps Confirm at half past one
       minute, and the record says plainly: bookings for that Sunday have
       closed, reopen the page for the next one. Going and looking would only
       confirm what it has already said, and the passenger would be told to
       check their signal and try again — standing in the street on full bars,
       tapping a button that can never work now. Say what the record said. */
    if(err && err.refused){
      saving=false;
      $("save").textContent="Confirm";
      /* Same repaint rule as verifySend: the spinner may be sitting on a
         button inside the withdraw question, and only paint() draws that. */
      if(cancelAsk || CLOSED) paint(); else paintBar();

      /* The record has no number against this booking and will not take it.

         It cannot happen from a page that asked for one, which is every page
         from this version on. What it catches is the phone still running an
         older copy: out of a cache, off a home screen tile, out of a tab left
         open since last Sunday. That phone knows nothing about numbers, so
         being told to give one would strand it — which is exactly what
         happened the first morning this went up.

         So the page asks, and sends the very same booking again. The stop and
         the number of seats are still in the payload; nothing is chosen twice. */
      if(err.needPhone && !PID){
        askOpen({ then:function(found){
          /* Unless they turn out to hold a booking already, in which case it
             is now on screen and overwriting it with this one would be a move
             nobody asked for. */
          if(found && found.mine){ toast("You are already booked."); return; }
          payload.pid=PID; payload.phone=PHONE;
          send(payload, done);
        }});
        return;
      }

      toast(plainError(err));
      return;
    }

    /* Everything else. A failure here does NOT mean nothing was written.

       Apps Script answers a POST with a redirect to a second address, and the
       booking is already saved by the time that redirect is issued. If the
       phone then fails to follow it, which happens on a weak signal or when a
       handset swaps between wifi and mobile mid-request, the fetch rejects
       even though the row is on the sheet. The page used to announce that
       nothing had been saved, and somebody reopening it later would find
       their booking sitting there after all. Worse the other way round: they
       might tap Confirm again, or give up and not travel.

       An HTML page from Google lands here too, by way of readJson, and
       belongs here: a sign-in screen or an error page served while a
       deployment settles says nothing about whether the row was written.

       So it does not guess. It asks. */
    verifySend(payload, done);
  });
}

/* Did it land after all? One read, and the answer is not in doubt: the
   spreadsheet either holds this booking or it does not. */
function verifySend(payload, done){
  callFetch(ENDPOINT+"?bus=1"+idq(),{method:"GET",redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var out=readJson(t);
      if(!out || out.ok!==true) throw new Error("no answer");

      var wantStop=String(payload.stopId||""), wantSeats=Number(payload.seats)||0;
      var got=out.mine;
      var landed = wantSeats
        ? !!(got && got.stopId===wantStop && Number(got.seats)===wantSeats)
        : !got;                                  /* a cancellation leaves none */

      if(!landed) throw new Error("not saved");
      saving=false;
      done(out);
    })
    .catch(function(){
      saving=false;
      $("save").textContent="Confirm";
      /* A full repaint whenever the question is up, because the spinner is
         sitting on a button inside that block and only paint() draws it.
         Left to paintBar it would spin at nothing for the rest of the
         morning. */
      if(cancelAsk || CLOSED) paint(); else paintBar();
      toast(cancelAsk
        ? "That did not save. Check your signal and tap Yes again."
        : "That did not save. Check your signal and tap Confirm again.");
    });
}

/* Repaint from the answer we already have.

   Both of these used to call load() and wait for the whole payload a second
   time. The reply to the save already says what was saved and what every stop
   now holds, so there is nothing left to ask for. */
function applySaved(out){
  if(out && out.counts) COUNTS=out.counts;
  booked = (out && out.mine && out.mine.stopId)
    ? { stopId:out.mine.stopId, seats:out.mine.seats||1 } : null;
  chosen = booked ? booked.stopId : null;
  seats  = booked ? booked.seats  : null;
  /* Whatever was asked has been answered. Cleared here rather than in each
     handler, so no path can leave the question standing over a booking that
     no longer exists. */
  cancelAsk = false;
  paint();
}

function saveNow(){
  var first = !booked;
  $("save").innerHTML='<span class="spin"></span>';
  send({ date:DATE, ref:REF, pid:PID, phone:PHONE, stopId:chosen, seats:seats }, function(out){
    $("save").textContent="Confirm";
    applySaved(out);
    toast(first ? "Booked." : "Changed.");
  });
}

$("save").addEventListener("click",function(){
  /* Belt and braces. The button is dead without both answers, so this cannot
     fire — but a booking is a seat on a bus, and a blank reaching the sheet
     would be a row nobody can act on. Checked before the spinner goes in, so
     a refusal does not leave the button spinning at nothing. */
  if(!chosen || !seats){ paintBar(); return; }

  /* Nor without a number. The tap that chose the stop asked for one, so this
     cannot fire either — unless a stop was chosen and the storage holding
     the answer was cleared underneath it, which is a private window, a phone
     low on space, or somebody clearing site data mid-booking. Ask here rather
     than let the record refuse it and have to explain itself afterwards. */
  if(!PID){
    /* Taken now, because saying who you are reloads the whole booking state
       from the record, and the record has never heard of the stop and the
       number sitting on this screen. Without these two lines the re-send goes
       out empty and reads, to the record, as a cancellation. */
    var wantStop=chosen, wantSeats=seats;
    askOpen({ then:function(found){
      if(found && found.mine){ toast("You are already booked."); return; }
      chosen=wantStop; seats=wantSeats;
      saveNow();
    }});
    return;
  }

  saveNow();
});

$("cancel").addEventListener("click",function(){
  /* This button no longer sends anything, on either side of the cutoff. It
     opens the question, and the question does the sending. */
  if(saving) return;
  cancelAsk=true; paint();
  try{ $("cancelBox").scrollIntoView({block:"center",behavior:"smooth"}); }catch(e){}
});

/* ==========================================================================
   PUTTING IT ON A PHONE

   Steps, and only steps. Which phone is asking decides which list opens; the
   other two sit behind a fold. Chrome will sometimes hand over a real install
   prompt, and when it does one button replaces the list entirely.

   Offered from the foot of the page and nowhere else, and not at all to a
   phone that already has it: an app that has been installed has no business
   asking to be installed.
   ========================================================================== */

var INSTALL_PROMPT=null;

function standalone(){
  try{
    return (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches)
        || navigator.standalone===true;
  }catch(e){ return false; }
}

/* An iPad on recent iOS reports itself as a Mac, and the only thing that
   gives it away is that the Mac has a touch screen. */
function deviceKind(){
  var ua=navigator.userAgent||"";
  if(/iPad|iPhone|iPod/.test(ua) ||
     (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1)){
    return /CriOS|FxiOS|EdgiOS/.test(ua) ? "ios-other" : "ios";
  }
  if(/Android/.test(ua)) return "android";
  return "desktop";
}

function howStep(n,html){
  return '<li><span class="how-n">'+n+'</span><div>'+html+'</div></li>';
}

var HOW={
  ios:["On an iPhone or iPad",
    howStep(1,'Tap the <b>Share</b> button \u2014 the square with an arrow coming out of the top.')+
    howStep(2,'Scroll down and tap <b>Add to Home Screen</b>.')+
    howStep(3,'Tap <b>Add</b>.')],
  android:["On an Android phone",
    howStep(1,'Tap the <b>\u22EE</b> menu, top right.')+
    howStep(2,'Tap <b>Install app</b>, or <b>Add to Home screen</b>.')+
    howStep(3,'Tap <b>Install</b>.')],
  desktop:["On a computer",
    howStep(1,'In Chrome or Edge, look in the address bar for the install icon, '+
              'or open the <b>\u22EE</b> menu.')+
    howStep(2,'Choose <b>Install</b>.')]
};

function howHtml(){
  var d=deviceKind(), mine=(d==="ios-other") ? "ios" : d;
  var h='<div id="howOne"></div>';
  /* Apple allows this from Safari and from nothing else, so a phone in
     Chrome is told the one thing that will make the steps work. */
  if(d==="ios-other"){
    h+='<p class="how-note">Open this address in <b>Safari</b> first. '+
       'On an iPhone only Safari can do this.</p>';
  }
  h+='<p class="how-lab">'+esc(HOW[mine][0])+'</p>'+
     '<ol class="how-steps">'+HOW[mine][1]+'</ol>';
  ["ios","android","desktop"].forEach(function(k){
    if(k===mine) return;
    h+='<details class="how-more"><summary>'+esc(HOW[k][0])+'</summary>'+
       '<ol class="how-steps" style="margin-top:12px">'+HOW[k][1]+'</ol></details>';
  });
  return h;
}

function howOpen(auto){
  $("howBody").innerHTML=howHtml();
  /* "Done" is the wrong word on a sheet nobody asked for: nothing has been
     done yet. Same button, saying the true thing in each case. */
  $("howDone").textContent = auto ? "Not now" : "Done";
  var box=$("how");
  box.classList.add("is-on");
  box.setAttribute("aria-hidden","false");
  howOffer();
}
function howClose(){
  var box=$("how");
  box.classList.remove("is-on");
  box.setAttribute("aria-hidden","true");
}

/* ---- The offer, made on the way in ---------------------------------

   It lived only at the foot of the page, which put it furthest from the
   people most likely to want it: somebody opening the link out of the
   WhatsApp group for the first time, who books a seat and closes the tab
   without ever scrolling past the stop list. So it comes to them instead.

   Once. On the first arrival in a browser, over a page that has already
   drawn, and never again on that phone. Never to a phone that already has
   the app, and never on top of the number question — the booking flow uses
   this same sheet to ask for a phone number, and two sheets on one screen is
   a question nobody can answer.

   The foot link stays. It is the way back for anybody who tapped Not now,
   and it costs one line under the closing time. */
var HOWKEY="bus.install.v1";
var howTried=false;

function howBlocked(){
  return standalone() || $("ask").classList.contains("is-on");
}
function howAuto(){
  if(howTried) return;
  howTried=true;
  if(howBlocked()) return;
  try{ if(localStorage.getItem(HOWKEY)==="1") return; }
  catch(e){ return; }   /* no storage means no memory of having asked: do not ask */
  /* A beat after the stops land, so the sheet rises over a page with
     something on it rather than over "Loading the stops…". */
  setTimeout(function(){
    if(howBlocked()) return;
    try{ localStorage.setItem(HOWKEY,"1"); }catch(e){}
    howOpen(true);
  },600);
}

/* Chrome hands over a real prompt when the page qualifies. One tap beats
   three, so when there is one it goes above the list. */
function howOffer(){
  var wrap=$("howOne");
  if(!wrap || !INSTALL_PROMPT) return;
  wrap.innerHTML='<button class="btn btn-main how-btn" id="howGo" type="button">Install</button>';
  $("howGo").addEventListener("click",function(){
    var p=INSTALL_PROMPT;
    if(!p) return;
    INSTALL_PROMPT=null;            /* it may only be used once */
    try{ p.prompt(); }catch(e){}
    var choice = p.userChoice || Promise.resolve({outcome:"dismissed"});
    choice.then(function(r){
      wrap.innerHTML = (r && r.outcome==="accepted")
        ? '' : '<p class="how-note">The steps below do the same.</p>';
    },function(){ wrap.innerHTML=''; });
  });
}

window.addEventListener("beforeinstallprompt",function(e){
  e.preventDefault();
  INSTALL_PROMPT=e;
  howOffer();                        /* no-op unless the sheet is open */
});
window.addEventListener("appinstalled",function(){
  INSTALL_PROMPT=null;
  howClose();
  paint();                           /* the offer at the foot goes with it */
});

$("howDone").addEventListener("click",howClose);
$("how").addEventListener("click",function(e){ if(e.target===this) howClose(); });

$("askGo").addEventListener("click",askSend);
$("askCancel").addEventListener("click",askClose);
$("askInput").addEventListener("input",function(){ askErr=false; askShape(); });
$("askInput").addEventListener("keydown",function(e){
  if(e.key==="Enter" || e.keyCode===13){
    e.preventDefault();
    if(!$("askGo").disabled) askSend();
  }
});
/* The backdrop and the escape key. Both mean the same thing, which is not
   now, and neither of them books or cancels anything. */
$("ask").addEventListener("click",function(e){ if(e.target===this) askClose(); });
document.addEventListener("keydown",function(e){
  if(e.key!=="Escape" && e.keyCode!==27) return;
  if($("ask").classList.contains("is-on")) askClose();
  else if($("how").classList.contains("is-on")) howClose();
});

/* ---- Appearance ----------------------------------------------------

   Kept on this phone. A theme is not a booking and has no business on the
   record: two people at one kerb can want opposite things and both be right.

   Auto is the default and follows the phone, and keeps following it — a
   handset that turns dark at dusk moves this page with it, without a
   reload. */
var THEME_KEY="bus.theme.v1";
var THEME_BAR={light:"#1B222C",dark:"#0E1216",green:"#14532D",navy:"#1E3260"};

function themeApply(){
  var pick="auto";
  try{ pick=localStorage.getItem(THEME_KEY)||"auto"; }catch(e){}
  var r=pick;
  if(pick==="auto"){
    var mq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
    r=(mq&&mq.matches)?"dark":"light";
  }
  document.documentElement.setAttribute("data-theme",r);
  var meta=document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", THEME_BAR[r]||THEME_BAR.light);
  var box=$("themes");
  if(box) Array.prototype.forEach.call(box.querySelectorAll("[data-theme-set]"),
    function(b){ b.classList.toggle("on", b.getAttribute("data-theme-set")===pick); });
}
try{
  Array.prototype.forEach.call(
    document.querySelectorAll("#themes [data-theme-set]"),function(b){
      b.addEventListener("click",function(){
        try{ localStorage.setItem(THEME_KEY,this.getAttribute("data-theme-set")); }catch(e){}
        themeApply();
      });
    });
  var themeMq=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
  if(themeMq){
    /* addListener is the old spelling, and some of these phones are old. */
    if(themeMq.addEventListener) themeMq.addEventListener("change",themeApply);
    else if(themeMq.addListener) themeMq.addListener(themeApply);
  }
  themeApply();
}catch(e){ /* appearance only: never worth a blank page */ }

load();

/* ---- offline shell -----------------------------------------------------
   Registered from this folder, so the worker takes charge of this page and
   nothing else. The driver app has its own at the site root and the two do
   not touch: see the note at the top of sw.js in this folder.

   What it buys is one thing, and it is the thing that matters most. A
   passenger standing at a stop with one bar of signal used to get no page at
   all. Now the page opens from the phone, and only where the bus has got to
   needs the network. */
if("serviceWorker" in navigator){
  /* Was this page already under a worker when it loaded? On a first ever
     visit it was not, and the worker's clients.claim() then fires
     controllerchange within a second or two. Reloading on that is pointless:
     the page IS the newest copy, it has only just been fetched. It would mean
     every brand new phone reloading itself a moment after opening, which to
     somebody waiting for a bus looks like a fault. Only a genuine takeover,
     where an OLD copy is running and a NEW worker has replaced it, is worth
     a reload. */
  var swHadController = !!navigator.serviceWorker.controller;

  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      /* Ask on every open. Without this a phone only notices a new version
         when the browser happens to re-check, which can be a day, and a
         timetable change would sit unseen for a Sunday.

         update() hands back a promise, so a try/catch around it never sees
         the failure. With no signal it rejects, and without the catch below
         that surfaces as an unhandled error on every single open — in
         precisely the situation this cache exists to cover. */
      try{ reg.update().catch(function(){}); }catch(e){}
    }).catch(function(){ /* no worker is not a broken page */ });
  });

  /* A new worker has taken control, so this page is running the old copy.
     Reload once, guarded so it cannot loop.

     Not while somebody is watching a bus. A reload there throws away the
     stop they tapped and drops them back on the list, which at a bus stop in
     the rain is worse than reading a page five minutes out of date. It will
     be picked up the next time the page is opened. */
  var swReloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", function(){
    if(!swHadController || swReloaded) return;
    if(liveTimer) return;
    swReloaded = true;
    location.reload();
  });
}
</script>
</body>
</html>
