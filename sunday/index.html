<html lang="en-GB">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1B222C">
<meta name="robots" content="noindex,nofollow">
<!-- What makes this installable rather than bookmarkable.

     The manifest is the booking page's own, not the driver app's, so the two
     go onto a home screen as two apps with two icons instead of overwriting
     each other's tile. Without it an Android phone can only make a shortcut:
     no icon, no full screen, and no offer from Chrome to install anything.

     The apple- tags are what an iPhone reads instead, and both are needed:
     older iOS never looks at a manifest at all. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sunday Bus">
<!-- BUILD v1.29.0 · keep in step with CACHE in sw.js and APP_VERSION in the
     driver app. Up here so a raw fetch of this file answers "which copy is
     live?" without running a line of it. -->
<title>Sunday Bus · RCCG Dominion Assembly Liverpool</title>

<!--
  What WhatsApp reads when somebody pastes this link into the group.

  Without these there was nothing to show. The driver app gets a small icon
  because it has an apple-touch-icon; this page had neither that nor any
  Open Graph tag, so WhatsApp had nothing to fall back to and rendered a
  bare link.

  og:image has to be an absolute https address, not a relative path, and the
  image has to be at least 300px wide, so icon-512.png rather than
  icon-192.png. If the site ever moves, these two addresses move with it.

  noindex above stays. It keeps the booking page out of search results and
  WhatsApp is not a search indexer.
-->
<!--
  The home screen icon, on its own address and its own background.

  Two things went wrong with the line that used to be here. It pointed at
  ../icon-192.png, which resolves correctly from /sunday/ but climbs a level
  too far from /sunday with no trailing slash, and it shared a file with the
  driver app, so both apps installed under the same tile and neither could be
  told from the other on a home screen.

  Absolute, so no address the page is reached by can break it. A new filename,
  because iOS decides this icon once, when the page is added, and never looks
  again: a single missed fetch during a deploy leaves a letter tile that no
  amount of reloading will replace. A name it has never seen sidesteps that
  whole argument.

  Green rather than the driver app's navy. Same logo, different field: the
  passenger app is the one the congregation installs, and it should not be
  mistaken for the inspection app at a glance.
-->
<link rel="apple-touch-icon" sizes="180x180"
      href="https://drolnstone.github.io/minibus-check/icon-sunday-180.png">
<!-- The tab icon. Without this the tab list shows a grey globe whatever the
     home screen is doing: the two are read from different tags. Green here
     as well, so the passenger tab is not mistaken for the driver one.
     Absolute for the same reason as the line above it. -->
<link rel="icon" type="image/png" sizes="180x180"
      href="https://drolnstone.github.io/minibus-check/icon-sunday-180.png">
<meta property="og:type" content="website">
<meta property="og:title" content="Sunday Bus · RCCG Dominion Assembly Liverpool">
<meta property="og:description" content="Book your seat on the church minibus. Tap your stop, say how many are boarding.">
<meta property="og:url" content="https://drolnstone.github.io/minibus-check/sunday/">
<meta property="og:image" content="https://drolnstone.github.io/minibus-check/icon-sunday-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">

<!--
  The passenger page. Deliberately separate from the driver app.

  A passenger never sees inspections, defects, the rota, PINs or anything
  else. This page loads a list of stops and sends back one line: a stop, and
  how many people are boarding there.

  It holds no names, no phone numbers and no driver token. The only thing
  kept on the phone is a random handle it makes up for itself, so somebody
  can come back and change their own booking. That handle means nothing to
  anybody else and identifies no one.

  THE LINK NEVER CHANGES. It used to carry a date and a per-Sunday code,
  which meant a new link every week and an old one dying quietly in
  somebody's chat history. Now it carries nothing: the script is asked which
  Sunday it is and answers. Pin the address in the group once.

  Which Sunday that is: this one, until bookings close on the morning, then
  the next one. Somebody opening this at ten past ten on a Sunday is not
  booking the bus that has already left, so the page says so plainly rather
  than showing them an empty list they might mistake for a lost booking.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Loaded without blocking first paint.

     As a plain stylesheet link this held the page blank until Google
     answered, which on a cold mobile connection is most of what "it took a
     minute to load" actually was. media="print" makes the browser fetch it at
     low priority and not wait for it; the onload switches it back once it
     arrives. The body already falls back to system fonts, so text appears at
     once and swaps when the real face lands. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"></noscript>

<style>
/* Tokens lifted from the checks app so the two pages read as one product. */
:root{
  --ink:#16191F;--paper:#F4F5F6;--card:#FFFFFF;
  --steel:#1B222C;--hair:#D3D7DC;--muted:#5C6672;
  /* Kept in step with the driver app, which is where the reasoning lives.
     Amber a shade down so it clears 4.5 to 1 on its own cream tint. */
  --pass:#146B41;--pass-bg:#E6F2EB;
  --warn:#9E5F00;--warn-bg:#FDF3E2;
  --stop:#A8231B;--stop-bg:#FBE9E7;

  /* Named so a theme can reach them. Every value was already on the screen,
     written in raw hex where it was used. */
  --on-accent:#FFFFFF;          /* text on the steel Confirm button */
  --pass-line:#B7D8C6;--warn-line:#EBD3A8;--stop-line:#E8BCB7;
  --faint:#AEB8C4;              /* the count under an inactive route tab */
  --dead:#AEB6BE;               /* Confirm, before a stop and a number exist */
  --veil:rgba(244,245,246,.97); /* behind the fixed bar */

  /* WhatsApp's own green, because the button leaves for WhatsApp. It is
     their colour and it does not follow this app's theme. */
  --wa:#25D366;--wa-ink:#0B2E1A;

  /* Behind the question that asks for a phone number. Dark enough that the
     page underneath is plainly not the thing being answered. */
  --scrim:rgba(22,25,31,.48);

  /* The accent doing two different jobs. As a background it carries white
     text; as text it must be legible on a card. In a light theme they are the
     same colour, which is why this went unnoticed until there was a dark one:
     a dark steel headline on a dark card is a headline nobody can read. */
  --accent-ink:#1B222C;
  --dead-ink:#FFFFFF;            /* the label on a disabled Confirm */

  color-scheme:light;
  --r:10px;--tap:56px;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px);--safe-r:env(safe-area-inset-right,0px);
}
/* touch-action:manipulation kills double tap to zoom, which was firing
   whenever somebody tapped a stop twice in a row. Pinch to zoom still works:
   user-scalable=no would have stopped that too, and taking zoom away from
   somebody who needs it to read a stop name is not a trade worth making. */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{margin:0;padding:0}

/* ======================= THEMES =======================================

   A theme moves the page, the cards and the Confirm button. It does not move
   the green that says a seat is booked, the amber that says something wants
   attention, or WhatsApp's own green on the button that leaves for WhatsApp.

   Chosen at the foot of the page, remembered on that phone, and set to follow
   the phone's own light/dark setting until somebody says otherwise. Nothing
   is sent anywhere: the record never learns, and never needs to.
   ==================================================================== */
html[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E7EBF0;--paper:#0E1216;--card:#181D25;
  --steel:#31404F;--hair:#2B333E;--muted:#9EA9B6;
  /* All three lifted, same hues, so a warning on a dark card can be read at
     a glance rather than worked out. */
  --pass:#21A163;--pass-bg:#12291F;
  --warn:#BF7A08;--warn-bg:#2B2113;
  --stop:#D85F55;--stop-bg:#2E1715;
  --pass-line:#265741;--warn-line:#5C4826;--stop-line:#5E2F2A;
  --accent-ink:#9DB4CC;--dead:#2A323C;--dead-ink:#67717E;--faint:#7E8996;
  --veil:rgba(14,18,22,.97);
  --scrim:rgba(0,0,0,.62);
}
html[data-theme="green"]{ --steel:#14532D;--paper:#F2F6F3;--accent-ink:#14532D; }
html[data-theme="navy"]{  --steel:#1E3260;--paper:#F2F4F9;--accent-ink:#1E3260; }

/* The picker. Five words at the foot of the page, in the same shape as the
   route tabs, so it is not a new kind of control. */
.themes{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:16px 0 4px}
.themes button{min-height:32px;padding:0 11px;border:1.5px solid var(--hair);
  border-radius:16px;background:var(--card);color:var(--muted);
  font:inherit;font-size:12px;font-weight:600;letter-spacing:.04em}
.themes button.on{background:var(--steel);border-color:var(--steel);color:var(--on-accent)}

body{background:var(--paper);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding:calc(16px + var(--safe-t)) calc(14px + var(--safe-r)) calc(132px + var(--safe-b)) calc(14px + var(--safe-l))}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
.wrap{max-width:640px;margin:0 auto}

.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand img{width:34px;height:34px;flex:none}
.brand-txt b{display:block;font-size:15px;font-weight:600;line-height:1.2}
.brand-txt span{display:block;font-family:"Barlow Condensed",sans-serif;font-size:12px;
  font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}

.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 3px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:36px;font-weight:700;
  line-height:1.03;margin:0 0 3px;letter-spacing:.005em}
.when{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:600;
  letter-spacing:.03em;color:var(--accent-ink);margin:0 0 16px}
.lede{color:var(--muted);margin:0 0 14px}

/* ---------- route tabs ---------- */
.tabs{display:flex;gap:8px;margin:0 0 10px}
.tab{flex:1;min-height:48px;padding:9px 8px;border-radius:var(--r);
  border:1px solid var(--hair);background:var(--card);color:var(--ink);
  font-family:"Barlow Condensed",sans-serif;font-size:16px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
.tab small{display:block;font-family:"IBM Plex Sans",sans-serif;font-size:11px;
  font-weight:500;letter-spacing:.02em;text-transform:none;color:var(--muted);margin-top:2px}
.tab.is-active{background:var(--steel);border-color:var(--steel);color:var(--on-accent)}
.tab.is-active small{color:var(--faint)}
.tab:focus-visible{outline:3px solid var(--steel);outline-offset:2px}

.summary{font-size:13px;color:var(--muted);margin:0 0 12px;line-height:1.45}
.summary b{color:var(--ink);font-weight:600}

/* ---------- stops ---------- */
.stop{display:flex;align-items:flex-start;gap:11px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--hair);border-radius:var(--r);
  padding:13px;margin-bottom:8px;min-height:var(--tap)}
.stop.is-on{border-color:var(--pass);background:var(--pass-bg);box-shadow:0 0 0 1px var(--pass) inset}
.stop:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.stop-time{flex:0 0 52px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.stop-body{flex:1;min-width:0}
/* These three stack. As inline spans they ran together into one unreadable
   line, which is what the postcode was doing welded to the stop name. */
.stop-name{display:block;font-weight:600;line-height:1.3}
.stop-pc{display:block;font-size:12px;color:var(--muted);margin-top:3px;
  font-variant-numeric:tabular-nums;letter-spacing:.02em}
.stop-n{display:block;font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:600;
  letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-top:5px}
.stop-n.has{color:var(--pass)}
.tick{flex:0 0 20px;font-weight:700;color:var(--pass);font-size:19px;line-height:1.25}
/* Watching, not collected: quieter, and never the colour of a finished thing. */
.tick-watch{color:var(--muted);font-size:13px}
.stop-arrival{opacity:.85}

.group-label{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:20px 0 7px}

/* ---------- seats ---------- */
.seats{background:var(--card);border:1px solid var(--hair);border-radius:var(--r);
  padding:14px;margin:14px 0}
.seats h2{font-family:"Barlow Condensed",sans-serif;font-size:20px;font-weight:700;
  letter-spacing:.02em;margin:0 0 3px}
.seats p{margin:0 0 12px;color:var(--muted);font-size:13px}
.seats.is-asking{border-color:var(--steel);box-shadow:inset 3px 0 0 var(--steel)}
/* Plus, the figure, minus. The two buttons are the full tap target height and
   as wide as they can be without crowding the number, because they are pressed
   repeatedly and often one-handed at a kerb. The figure is deliberately the
   largest thing in the box: it is the answer, and the answer is what somebody
   should be able to check at a glance before pressing Confirm. */
.stepper{display:flex;align-items:center;gap:10px}
.step{flex:0 0 auto;width:76px;min-height:var(--tap);border-radius:var(--r);
  border:1px solid var(--hair);background:var(--paper);color:var(--ink);
  font-size:30px;line-height:1;font-weight:600}
.step:disabled{opacity:.35}
.step:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.stepval{flex:1 1 auto;text-align:center;font-size:34px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--ink)}

/* ---------- notices ---------- */
.note{border-radius:9px;padding:12px 13px;font-size:14px;line-height:1.5;margin:0 0 14px}
.note b{font-weight:600}
.note-warn{background:var(--warn-bg);border:1px solid var(--warn-line)}
.note-go{background:var(--pass-bg);border:1px solid var(--pass-line)}

/* ---------- bottom bar ---------- */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--veil);
  border-top:1px solid var(--hair);backdrop-filter:blur(8px);
  padding:11px calc(14px + var(--safe-r)) calc(11px + var(--safe-b)) calc(14px + var(--safe-l))}
.bar-in{max-width:640px;margin:0 auto}
.bar-say{font-size:12px;color:var(--muted);text-align:center;margin:0 0 8px;min-height:16px}
.bar-say.is-dirty{color:var(--warn);font-weight:600}
.bar-btns{display:flex;gap:8px}
.btn{flex:1;min-height:var(--tap);padding:14px 12px;border-radius:var(--r);
  font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase}
.btn:focus-visible{outline:3px solid var(--steel);outline-offset:2px}
.btn-main{background:var(--steel);color:var(--on-accent)}
.btn-main:disabled{background:var(--dead);color:var(--dead-ink);cursor:default}
.btn-ghost{flex:0 0 auto;padding-left:18px;padding-right:18px;
  background:var(--card);border:1px solid var(--hair)}
/* The withdraw question. Two equal buttons, because neither is a trap: one
   keeps the seat and one gives it up, and the person has already said which
   way they were heading by tapping Not coming. The giving-up one carries the
   warning colour so it cannot be hit by momentum alone. */
.cancel-row{display:flex;gap:8px}
.cancel-row .btn{flex:1}
.btn-keep{background:var(--steel);color:var(--on-accent)}
.btn-drop{background:var(--card);border:1px solid var(--warn);color:var(--warn);font-weight:600}
/* WhatsApp green, and the only place on either page that colour appears, so
   it reads as "this leaves for WhatsApp" without needing a logo. Centred by
   hand because an anchor does not inherit a button's text centring. */
.btn-wa{background:var(--wa);color:var(--wa-ink);font-weight:600;text-decoration:none;
  display:flex;align-items:center;justify-content:center;text-align:center}

/* ---- the question that asks who you are --------------------------------

   A sheet over the page rather than a box on it. It is asked once, at the
   moment somebody first reaches for a seat, and it has to be answered before
   anything happens — which is exactly what a sheet says and a box does not.
   The box was tried first: on a long stop list it sat wherever it landed,
   people scrolled past it, and the Confirm button underneath went on looking
   ready for a booking that had nobody's name on it.

   Bottom of the screen on a phone, because that is where a thumb is. Centred
   on anything wider, where there is no thumb to be near. */
.ask{position:fixed;inset:0;z-index:150;background:var(--scrim);display:none;
  align-items:flex-end;justify-content:center}
.ask.is-on{display:flex}
.ask-sheet{width:min(640px,100%);background:var(--paper);color:var(--ink);
  border-radius:14px 14px 0 0;max-height:92vh;overflow:auto;
  padding:18px calc(16px + var(--safe-r)) calc(20px + var(--safe-b)) calc(16px + var(--safe-l))}
.ask-sheet h2{font-family:"Barlow Condensed",sans-serif;font-size:27px;font-weight:700;
  line-height:1.06;margin:0 0 14px;letter-spacing:.005em}
/* Big, spaced and centred, because it is eleven digits being read back by
   somebody who has typed them on a kerb. font-size:16px or over, or iOS
   zooms the whole page the moment the caret lands in it. */
.ask-input{width:100%;min-height:var(--tap);border-radius:var(--r);
  border:1.5px solid var(--hair);background:var(--card);color:var(--ink);
  font:inherit;font-size:22px;font-weight:600;letter-spacing:.1em;text-align:center;
  font-variant-numeric:tabular-nums;padding:10px 12px;-webkit-appearance:none}
.ask-input:focus{outline:3px solid var(--steel);outline-offset:1px}
.ask-input.is-ok{border-color:var(--pass);box-shadow:0 0 0 1px var(--pass) inset}
.ask-say{min-height:19px;margin:9px 0 0;font-size:13px;line-height:1.45;color:var(--muted)}
.ask-say.is-bad{color:var(--stop);font-weight:600}
.ask-btns{display:flex;gap:8px;margin-top:14px}
.ask-btns .btn{flex:1}
@media (min-width:641px){.ask{align-items:center}.ask-sheet{border-radius:14px;max-height:86vh}}

/* The toast sat on --ink, which is the colour of TEXT, not a surface. In a
   light theme those happen to look the same: ink is nearly black, so a
   near-black chip with white on it read perfectly and nobody looked twice.
   The dark theme turns ink into #E7EBF0, so the chip became near-white and
   kept its white lettering. 1.2 to 1 — white on white, and the one message
   somebody most needs to read is the one telling them something went wrong.

   --steel is a surface and stays a surface in every theme, which is why the
   driver app's toast never had this. Both apps now use the same one. */
.toast{position:fixed;left:50%;bottom:calc(112px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:var(--steel);color:var(--on-accent);padding:11px 16px;border-radius:9px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}
/* The call button, shaped like the driver's.

   It was two underlined words in the middle of a sentence. On the driver's
   side the same call — ring the coordinator, now — is a target he can hit
   with a thumb without reading anything, and this is the same moment: a
   person at a kerb who has just learned the bus is not coming for them.
   Same shape, same radius, same condensed uppercase, on purpose. One app to
   the people who use both.

   The COLOUR is deliberately not the driver's. Red there means "this bus
   does not run", it is the only place in either app that it means anything,
   and spending it on a missed pickup would blunt it. This one takes the tone
   of the panel it is standing in, so it never claims more than the panel.

   The border is not decoration. A button filled from the palette sits
   between 1.07:1 and 1.15:1 against the panel behind it — invisible as a
   shape on brightness alone, in both themes. The edge is the only thing that
   makes it read as a button, so it is never optional. */
.callbtn{display:inline-flex;align-items:center;justify-content:center;
  margin-top:11px;min-height:46px;padding:0 16px;
  background:var(--paper);color:var(--ink);
  border:1px solid var(--hair);border-radius:8px;text-decoration:none;
  font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:17px;
  letter-spacing:.05em;text-transform:uppercase}
.callbtn:active{transform:translateY(1px)}
/* Inside a tinted panel the fill flips, or it would vanish into the tint. */
.live-go .callbtn,.live-warn .callbtn,.note-warn .callbtn,.note-go .callbtn{background:var(--card)}
.live-go .callbtn{color:var(--pass);border-color:var(--pass-line)}
.live-warn .callbtn,.note-warn .callbtn{color:var(--warn);border-color:var(--warn-line)}
.live{border-radius:9px;padding:13px 14px;margin:0 0 14px;border:1px solid var(--hair);background:var(--card)}
.live-eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.live-big{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;
  line-height:1.05;margin:0 0 3px;color:var(--accent-ink)}
.live-sub{margin:0;font-size:13px;color:var(--muted);line-height:1.5}
.live-sub .ring,.note .ring,.foot .ring{color:inherit;font-weight:600;text-decoration:underline}
.live-pick{display:flex;gap:6px;margin-top:10px}
.live-pickbtn{flex:1;padding:7px 10px;border:1px solid currentColor;background:transparent;
  border-radius:8px;font:inherit;font-size:13px;color:inherit;opacity:.6}
.live-pickbtn.is-on{opacity:1;font-weight:600}
.live-go{background:var(--pass-bg);border-color:var(--pass-line)}
.live-go .live-big{color:var(--pass)}
.live-warn{background:var(--warn-bg);border-color:var(--warn-line)}
.live-test{background:var(--stop-bg);border-color:var(--stop-line)}
.live-test .live-eyebrow{color:var(--stop)}
.foot{margin-top:24px;color:var(--muted);font-size:12px;line-height:1.55}

.foot-ver{display:block;margin-top:12px;font-size:11px;letter-spacing:.07em;color:var(--faint)}

/* ---- how to put it on a phone -----------------------------------------
   Steps and nothing else. Which phone somebody is holding decides which
   list is open; the other two are behind a fold for the morning somebody is
   reading them out to a person standing next to them. */
.how-lab{font-family:"Barlow Condensed",sans-serif;font-size:12px;font-weight:700;
  letter-spacing:.11em;text-transform:uppercase;color:var(--muted);margin:0 0 11px}

.how-steps li{display:flex;gap:11px;align-items:flex-start;margin:0 0 13px;
  font-size:14px;line-height:1.5}

  color:var(--on-accent);font-size:12px;font-weight:700;line-height:1;
  display:flex;align-items:center;justify-content:center;margin-top:1px}

  border:1px solid var(--warn-line);border-radius:9px;padding:10px 12px;margin:0 0 14px}

.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:var(--on-accent);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- turn it upright ---------------------------------------------------

   iOS cannot be told to stay in portrait. The manifest carries
   orientation: portrait and Safari ignores it; screen.orientation.lock is
   not implemented there either. The only real lock on an iPhone is the one
   in Control Centre, and that holds the whole phone, not one app.

   So the rotation happens and this answers it. Every screen here is built
   for a tall phone: in landscape the header, the list and the footer bar
   fight over about three hundred pixels and the buttons end up under the
   thumb rest. Better to say the one thing that fixes it.

   max-height rather than a width test, so this is phones only. An iPad in
   landscape is a perfectly good way to read this and must not be nagged. */
.upright{display:none}
@media (orientation:landscape) and (max-height:500px){
  .upright{
    display:flex;position:fixed;inset:0;z-index:9999;
    align-items:center;justify-content:center;text-align:center;
    background:var(--paper);color:var(--ink);
    padding:24px calc(24px + var(--safe-r)) 24px calc(24px + var(--safe-l));
  }
  .upright b{font-size:20px;line-height:1.3;letter-spacing:.01em}
}

<script>
/* The theme, set before the first paint.

   If this waited for the main script the app would flash white and then go
   dark, which on a phone at half seven in the morning is a torch in the face.
   Six lines in the head, no dependencies, and it cannot throw: a locked-down
   browser that refuses localStorage falls through to the phone's own setting,
   which is the right answer anyway. */
(function(){
  var t="auto";
  try{ t=localStorage.getItem("bus.theme.v1")||"auto"; }catch(e){}
  var m=window.matchMedia&&window.matchMedia("(prefers-color-scheme: dark)");
  document.documentElement.setAttribute("data-theme",
    t!=="auto" ? t : ((m&&m.matches)?"dark":"light"));
})();
</script>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <!-- Two candidates, then nothing. Which one is right depends on how deep
         this page sits, and a broken image icon on a church page looks worse
         than no logo at all. -->
    <img src="../logo.png" alt="" id="brandLogo"
         onerror="if(this.dataset.tried){this.style.display='none';}else{this.dataset.tried=1;this.src='logo.png';}">
    <span class="brand-txt">
      <b>RCCG Dominion Assembly</b>
      <span>Liverpool · Transport</span>
    </span>
  </div>

  <p class="eyebrow">Getting you to church</p>
  <h1>Sunday Bus</h1>
  <p class="when" id="when"></p>
  <div id="live"></div>
  <div id="body"><p class="lede">Loading the stops…</p></div>

  <p class="foot" id="foot"></p>

  <!-- Appearance. Last thing on the page, under the closing time, where it
       is out of the way of somebody booking a seat. -->
  <div class="themes" id="themes" role="group" aria-label="Appearance">
    <button type="button" data-theme-set="auto">Auto</button>
    <button type="button" data-theme-set="light">Light</button>
    <button type="button" data-theme-set="dark">Dark</button>
    <button type="button" data-theme-set="green">Green</button>
    <button type="button" data-theme-set="navy">Navy</button>
  </div>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="bar-in">
    <p class="bar-say" id="barSay"></p>
    <div class="bar-btns">
      <button class="btn btn-ghost" id="cancel" type="button">Not coming</button>
      <button class="btn btn-main" id="save" type="button">Confirm</button>
      <!-- An anchor, not a button: it leaves for another app, and a phone
           should be able to long-press it like any other link. Hidden until
           paintBar has a driver and a number to point it at. -->
      <a class="btn btn-wa" id="wa" style="display:none" rel="noopener"
         href="#">Message the driver</a>
    </div>
  </div>
</div>

<!-- Asked on the first reach for a seat, and again on any device that has
     not been told yet. The same sheet does the first booking, the second
     phone and the change of number, because they are one question asked in
     three situations.

     A question and a box, and nothing else. There was a paragraph here
     explaining that one number holds one booking, and another under the
     buttons explaining where the number goes. Both were true and neither
     belonged on the screen: the question already says what it wants, the
     placeholder already shows the shape of the answer, and nobody standing
     at a kerb reads a policy before typing their own phone number. What was
     in those paragraphs is written down where it is actually needed, in the
     notes on the Bus Bookings tab and in the comments in this file. -->
<div class="ask" id="ask" aria-hidden="true">
  <div class="ask-sheet" role="dialog" aria-modal="true" aria-labelledby="askTitle">
    <p class="eyebrow" id="askEyebrow">Your booking</p>
    <h2 id="askTitle">What is your phone number?</h2>
    <input class="ask-input" id="askInput" type="tel" inputmode="numeric"
           autocomplete="tel" maxlength="18" placeholder="07700 900123"
           aria-describedby="askSay" aria-label="Your mobile number">
    <p class="ask-say" id="askSay" aria-live="polite"></p>
    <div class="ask-btns">
      <button class="btn btn-ghost" id="askCancel" type="button">Cancel</button>
      <button class="btn btn-main" id="askGo" type="button" disabled>Continue</button>
    </div>

</div>

<!-- How to put it on a home screen. Filled by howOpen, which picks the list
     that matches the phone doing the asking. -->
<div class="ask" id="how" aria-hidden="true">
  <div class="ask-sheet" role="dialog" aria-modal="true" aria-labelledby="howTitle">

<div class="upright" aria-hidden="true"><b>Turn your phone upright.</b></div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";

/* Which copy of this page a phone is actually running.

   It had none, and the morning it mattered that was the whole of the
   problem: the booking page was refusing every booking, and there was no way
   to tell from the page, from the raw file or from anybody's phone whether
   the file that had gone up was the file that was being served. The answer
   took a check of the repository to find, and the answer was that the upload
   had not landed at all.

   Bump alongside CACHE in sw.js and APP_VERSION in the driver app. All three
   are one number. It is also in a comment in the head of this file, so it can
   be read from the raw source without running anything. */
var PAGE_VERSION = "v1.29.0";

var ENDPOINT = "https://script.google.com/macros/s/AKfycbxS-2KqOjCWCwTkoNWgOOsB-TfGYShkSkvQJC6ItfpGINj7DJ6CRYuTxpXQip1R1XxMSA/exec";

/* Who a passenger rings when something has gone wrong at their stop: the bus
   has been and gone while they were still standing there, or it reached
   church without their stop ever being marked.

   The coordinator, and deliberately not the driver. The driver is driving.
   The app already refuses his own taps while the wheels are turning, and
   putting his number in the hand of somebody waiting at a kerb would undo
   that from the other end. The coordinator can answer, and can ring the
   driver himself if it is worth stopping the bus for.

   Held here rather than fetched, because the message that needs it most is
   the one shown when the server cannot be reached at all. Keep it in step
   with coordinator in config.js, which is the same person for the drivers. */
var COORDINATOR = { name: "Bro Asim", phone: "07377634214" };

/* A number that can actually be pressed. The written form keeps its spacing
   for reading; the tel: link gets digits only, because a space in an href is
   the difference between a call and nothing happening. */
/* 07377634214 is a string of digits. 07377 634214 is a phone number.
   The driver's app has always broken it; this one never did. */
function prettyPhone(show){
  var p=String(show||"").replace(/[^0-9+]/g,"");
  return /^07\d{9}$/.test(p) ? p.slice(0,5)+" "+p.slice(5) : String(show||"");
}

/* The same call as ringCoordinator, as a button rather than a sentence.
   Used wherever somebody needs to DO it rather than read about it. */
function callButton(){
  var name = String(COORDINATOR.name||"").trim();
  var show = String(COORDINATOR.phone||"").trim();
  var dial = show.replace(/[^0-9+]/g,"");
  if(!dial) return "";
  return '<a class="callbtn" href="tel:'+esc(dial)+'">Call '+
         esc(name||"the bus coordinator")+' \u00B7 '+esc(prettyPhone(show))+'</a>';
}

function ringCoordinator(){
  var name = String(COORDINATOR.name||"").trim();
  var show = String(COORDINATOR.phone||"").trim();
  var dial = show.replace(/[^0-9+]/g,"");
  if(!name) return "ring the transport group";
  if(!dial) return "ring "+esc(name);
  return 'ring <a class="ring" href="tel:'+esc(dial)+'">'+esc(name)+
         '</a> on <a class="ring" href="tel:'+esc(dial)+'">'+esc(show)+'</a>';
}

var $ = function(id){ return document.getElementById(id); };
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

/* Every call to Apps Script, with a limit on how long it may hang.

   fetch has no timeout of its own. A request that never answers was held until
   the browser gave up, which on a phone can be a minute or more, and the page
   simply sat there. Twelve seconds is well past a cold start and well short of
   somebody deciding the app is broken.

   Twenty five seconds rather than twelve. A cold Apps Script container can
   honestly take that long, and a timeout that cuts off a working call is
   worse than no timeout at all: it turns a slow answer into a failure.

   Done with a race rather than an AbortController on purpose. Passing a signal
   in the request options threw "The object can not be cloned" on this page,
   because a page inside a service worker's scope has its request options
   structured-cloned to hand to the worker, and an AbortSignal cannot be
   cloned. The request itself therefore is not cancelled here, it is only
   stopped from being waited on, which is all the page actually needed. */
var CALL_TIMEOUT = 25000;

function callFetch(url, opts){
  return Promise.race([
    fetch(url, opts || {}),
    new Promise(function(_, reject){
      setTimeout(function(){ reject(new Error("took too long to answer")); }, CALL_TIMEOUT);
    })
  ]);
}

var toastTimer;
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("is-on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("is-on"); },3600);
}

/* A handle this browser makes up for itself. It is random and it says
   nothing about who anybody is.

   It used to BE the identity, and that was the fault. One handle per
   browser meant one booking per browser: a family who booked on the laptop
   and then opened this on a phone was a stranger to the record and booked
   again. Two rows, two lots of seats, one family — and cancelling on the
   phone left the laptop's seats standing on the driver's list where nobody
   could see them to take them off. A warning at the foot of the page was
   tried, which only told people the app was going to get it wrong.

   It is kept for two smaller jobs: it still finds a booking made before
   numbers existed, and it is what the record counts against when somebody
   sits there trying numbers. */
function deviceRef(){
  var k="bus.ref.v1", v="";
  try{ v=localStorage.getItem(k)||""; }catch(e){}
  if(!v){
    v = "d" + Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(k,v); }catch(e){}
  }
  return v;
}
var REF = deviceRef();

/* ---- who this is ------------------------------------------------------

   The phone number, given once on whichever device is in the hand at the
   time, is what a booking now belongs to. Pick up a different phone, give
   the same number, and your booking is there: change how many are coming,
   move to another kerb, or give the seat up. What you cannot do is book a
   second time, because there is only ever one row with your number on it.

   Two things are kept on this device and neither leaves it except as
   described:

     PID    the fingerprint the record sent back. It cannot be turned into a
            number by anybody who finds it, and it is what goes out with
            every poll from then on.
     PHONE  the number itself, so the page can say which one is holding the
            booking, and so the record has something to write in the column
            the coordinator rings from.

   The number itself is sent exactly twice: once when it is given, and again
   with a booking that needs writing. Never in a web address, so it is not in
   a history, a referrer or a log line — which is the whole reason the
   fingerprint exists. Nothing about it is in the code on the website: the
   only place a number is ever written down is the spreadsheet. */
var IDKEY="bus.pid.v1", PHKEY="bus.phone.v1";
var PID="", PHONE="";
try{ PID=localStorage.getItem(IDKEY)||""; PHONE=localStorage.getItem(PHKEY)||""; }catch(e){}

function idSave(pid, phone){
  PID   = String(pid||"");
  PHONE = String(phone||"");
  try{
    if(PID) localStorage.setItem(IDKEY,PID); else localStorage.removeItem(IDKEY);
    if(PHONE) localStorage.setItem(PHKEY,PHONE); else localStorage.removeItem(PHKEY);
  }catch(e){}
}

/* What goes on the end of every read. The handle for the old bookings, the
   fingerprint for everything since. */
function idq(){
  return "&ref="+encodeURIComponent(REF)+
         (PID ? "&pid="+encodeURIComponent(PID) : "");
}

/* Eleven digits, however they were typed. +44 and 0044 are folded back to
   the 0 they stand for; spaces, dashes and brackets are thrown away. Returns
   "" for anything that is not eleven digits starting with a zero, and every
   caller reads "" as no. The record checks this again for itself: this copy
   is here so the Continue button can stay dead until there is an answer
   worth sending. */
function phoneDigits(v){
  var d=String(v==null?"":v).replace(/[^0-9+]/g,"");
  if(d.indexOf("+44")===0) d="0"+d.slice(3);
  else if(d.indexOf("0044")===0) d="0"+d.slice(4);
  else if(d.indexOf("44")===0 && d.length===12) d="0"+d.slice(2);
  return d.replace(/[^0-9]/g,"");
}
function phoneOk(v){
  var d=phoneDigits(v);
  return (d.length===11 && d.charAt(0)==="0") ? d : "";
}
/* For reading back at somebody, in the shape they wrote it on a scrap of
   paper: 07700 900123. */
function prettyPhone(d){
  d=String(d||"");
  return d.length===11 ? d.slice(0,5)+"\u00A0"+d.slice(5) : d;
}

/* ---- the stop somebody is watching without a booking --------------------

   The handle above was doing two jobs: finding your booking again, and
   proving you were allowed to watch the bus. Only the first needs to know
   who you are. A man who booked on his laptop and walked out with his phone
   had a different handle in his pocket, so he was told there was nothing to
   see — and he was right to complain.

   So the watching half is answered by asking. He taps the kerb he is standing
   at and follows the bus from there. It is kept because he should not have to
   answer it again on every poll, and it is per-Sunday because next week he may
   stand somewhere else.

   It gives him nothing a booked passenger at that stop is not already shown:
   every word in the panel is a fact about the stop. It does NOT get him the
   driver's number, which stays behind a real booking. */
var WKEY = "bus.watch.v1";
function watchLoad(){
  try{
    var w = JSON.parse(localStorage.getItem(WKEY) || "null");
    return (w && w.date && w.stopId) ? w : null;
  }catch(e){ return null; }
}
function watchSave(stopId){
  try{
    if(stopId) localStorage.setItem(WKEY, JSON.stringify({ date:DATE, stopId:stopId }));
    else localStorage.removeItem(WKEY);
  }catch(e){}
}
/* The stop this phone is watching, or "" — and only ever for the Sunday now
   on screen, so last week's answer cannot follow somebody into this one. */
var watchStop = "";

/* ---- state ------------------------------------------------------------
   booked is what the spreadsheet actually holds for this phone.
   chosen and seats are what the passenger is looking at right now.

   Keeping them apart is the whole point. When they were one thing, tapping
   a stop was enough to make the page announce "You are booked", and
   somebody could tap, read that, close the page and never press Confirm.
   Nothing had been sent. The driver had no idea they were coming. */
var STOPS=[], ARRIVALS=[], COUNTS={}, CLOSED=false, ROLLED=false, DATE="", CUTOFF="";
var REHEARSAL=false;
/* seats is null until the passenger says. It used to start at 1 and then
   keep whatever the last answer was, which on a phone handed round a family
   or used twice in a morning meant the number already sitting there belonged
   to somebody else. Nothing carries over now: a new stop is a new question. */
var booked=null, chosen=null, seats=null, saving=false, route="North", ROUTES=[];
/* Their seat was at a stop that has since been taken off the timetable. */
var STOPGONE=false;
var seatsAsk=false;   /* the question has just appeared and wants looking at */
/* The withdraw question is open. Asked on both sides of the cutoff; the
   wording differs because the consequence does. See paint(). */
var cancelAsk=false;

/* The driver on duty for THIS passenger's route, and only once bookings have
   closed. Null the rest of the time, and null for anybody without a booking,
   because that is all the server will say. The page never holds a number it
   was not given for the morning it is being used. */
var DRIVER=null;

/* A stop, once confirmed, is settled for that Sunday.

   A passenger does not change kerb. Where somebody boards follows from where
   they live, and if they move house the transport coordinator is told and the
   stop list itself changes. In the life of this page it has not happened once.

   What does happen is a change of mind about coming at all, and that has its
   own button.

   There used to be a whole apparatus here for moving stop: a question naming
   both stops, the Confirm button relabelling itself to Move here and then to
   Yes, move, the ghost button becoming Keep my stop. All of it existed to
   protect a mis-tap on something nobody was doing, on the one screen a
   hundred people touch on a Sunday morning. The remedy for a mis-tap is Not
   coming and book again, which is two taps and says plainly what it does. */

function dirty(){
  if(!chosen) return !!booked;                       /* deselected a real booking */
  if(!seats)  return false;                          /* how many is not answered yet */
  if(!booked) return true;                           /* new booking, nothing saved */
  return chosen!==booked.stopId || seats!==booked.seats;
}

function prettyDate(key){
  var p=String(key).split("-");
  if(p.length!==3) return "";
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
}

/* Everything the page is, from one payload.

   Pulled out of load so that saying who you are runs through it too. The
   record answers an identify with exactly the shape it answers ?bus=1 with,
   so opening the page for the first time and giving your number on a second
   phone are the same act as far as this file is concerned. One piece of code
   paints from the record, and there is no second path to keep in step. */
function applyBus(out){
  STOPS=out.stops||[]; ARRIVALS=out.arrivals||[]; COUNTS=out.counts||{};
  CLOSED=!!out.closed; ROLLED=!!out.rolled; DATE=out.date||""; CUTOFF=out.cutoff||"";
  REHEARSAL=!!out.rehearsal;

  booked = out.mine ? { stopId:out.mine.stopId, seats:out.mine.seats||1 } : null;
  STOPGONE = !!out.stopGone;
  chosen = booked ? booked.stopId : null;
  seats  = booked ? booked.seats : null;
  cancelAsk = false;        /* a fresh load is never mid-question */
  DRIVER = (out.driver && out.driver.wa) ? out.driver : null;

  /* The number the record holds against this booking wins over whatever this
     browser has. It is how a phone whose storage was cleared, or one where a
     digit was keyed wrong and put right on another device, comes back saying
     the right number under the stop list. */
  if(out.phone) idSave(PID, out.phone);

  /* Which routes actually exist, in the order the timetable lists them. */
  ROUTES=[];
  STOPS.forEach(function(s){ if(ROUTES.indexOf(s.route)<0) ROUTES.push(s.route); });
  if(!ROUTES.length) ROUTES=["North"];

  /* The kerb this phone said it was standing at, if it has no booking of
     its own. Dropped the moment a booking exists — the booking is the
     better answer — and dropped when it belongs to another Sunday. */
  var w = watchLoad();
  watchStop = (!booked && w && w.date===DATE && stopById(w.stopId)) ? w.stopId : "";
  if(!watchStop && w) watchSave("");

  /* Open on the route you are already booked on, or the one you are
     watching. */
  var mine = booked && stopById(booked.stopId);
  if(!mine && watchStop) mine = stopById(watchStop);
  route = (mine && ROUTES.indexOf(mine.route)>=0) ? mine.route : ROUTES[0];

  $("when").textContent = prettyDate(DATE);
  paint();

  /* After the cutoff, or during a rehearsal. The rehearsal case is why
     the passenger side sat out the first test: bookings are open on a
     Tuesday, so CLOSED was false and this never started watching. The
     two are kept apart deliberately, because a rehearsal must not tell
     anybody that bookings have shut. */
  if(CLOSED || REHEARSAL) liveStart();
  else { liveStop(); live=null; paintLive(); gateStart(); }

  /* The page has content now. Guarded to one attempt per load inside. */
  howAuto();
}

function load(again){
  callFetch(ENDPOINT+"?bus=1"+idq(),{method:"GET",redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var out=readJson(t);
      if(!out || out.ok!==true) throw new Error(out && out.error ? out.error : "unavailable");
      applyBus(out);
    })
    .catch(function(err){
      /* Three attempts before saying anything, spaced out.

         These fail transiently more often than they fail properly. One retry
         a second later was not enough: Apps Script serves an error page for
         several seconds while a deployment updates, and a passenger caught in
         that window was shown a fault that had already cured itself. This is
         the page the whole congregation opens on a Sunday morning, so it
         should be slow to complain. */
      var tries = (typeof again === "number") ? again : 0;
      if(tries < 2){
        setTimeout(function(){ load(tries + 1); }, tries === 0 ? 1500 : 4000);
        return;
      }
      /* No signal gets its own answer, because it is not a failure and there
         is nothing for them to do about it. What is happening, what will
         happen, and no alarm. A phone call still works with no data, so the
         number stays — quietly, at the end, for somebody who needs a person
         rather than a page. */
      if(offlineNow(err)){
        $("body").innerHTML='<div class="note"><b>No signal just now.</b><br>'+
          'This page will show the bus again as soon as your phone is back on '+
          'the network. A call still works without it.'+
          '<br>'+callButton()+'</div>';
        return;
      }
      $("body").innerHTML='<div class="note note-warn"><b>The stops could not be loaded.</b><br>'+
        esc(plainError(err))+'<br>Pull down to refresh, or:'+
        '<br>'+callButton()+'</div>';
    });
}

/* An answer that is not JSON is nearly always an HTML page from Google:
   a sign-in screen, or an error page, meaning the request never reached the
   script. Saying "Unrecognized token" to somebody trying to book a seat helps
   nobody, and it hides the one fact that would help whoever has to fix it. */
/* Is this simply "no network"? It is the commonest reason anything on this
   page fails, and it is not a fault at all — so it must never be dressed up
   as one in front of somebody standing at a kerb.

   Every browser words it differently and none of them word it for a
   passenger: Chrome says "Failed to fetch", Safari "Load failed", Firefox
   "NetworkError when attempting to fetch resource". navigator.onLine is
   checked first because it is the only one that is not a guess, but it lies
   in the other direction often enough — a phone can be on a network that
   goes nowhere — so the wording is tested too. */
function offlineNow(err){
  if(navigator.onLine === false) return true;
  var m = String((err && err.message) || err || "");
  return /failed to fetch|load failed|networkerror|network request failed|network error/i.test(m);
}

/* Developer's English, which must never reach a screen.

   Apps Script sends the real exception text back with a failure, and that is
   right: it is the only way a fault gets diagnosed on Monday. But the page
   was printing it word for word, so a passenger could be shown
   "TypeError: Cannot read properties of undefined (reading 'getRange')" —
   the exact line that turned up in the editor once — while standing at a bus
   stop. The sheet's own log still has all of it. The screen does not need it. */
function machineSpeak(m){
  return /^[A-Za-z]*(Error|Exception)\b/.test(m)
      || /cannot read propert|is not a function|is not defined|\bundefined\b|Code\.gs|\bat \w+ \(/i.test(m);
}

/* Words this app uses among itself, which are not sentences. They exist so a
   failure has SOMETHING to carry when the server said nothing; they were
   never meant to be read out. */
var SHORTHAND = {
  "unavailable": "The record is not answering just now.",
  "rejected":    "The record would not accept it.",
  "not sent":    "It did not go through.",
  "not saved":   "It was not saved.",
  "no answer":   "The record did not answer.",
  "bad token":   "This copy of the app is not recognised. Ring the bus coordinator."
};

/* Whatever was thrown, in words somebody at a bus stop can do something with.

   "Failed to fetch" went on this screen verbatim. It is not English, it is
   not true — nothing failed, the phone simply has no signal — and it is the
   line a stranger would read on the one morning the page could not help them.

   Messages the script itself wrote are already written for this screen and
   pass through untouched. It is the browser's own that need translating. */
function plainError(err){
  if(offlineNow(err)) return "Your phone is not on the network just now.";
  var m = String((err && err.message) || err || "").trim();
  if(!m) return "Something did not work. Try again in a moment.";
  if(SHORTHAND[m.toLowerCase()]) return SHORTHAND[m.toLowerCase()];
  if(/took too long|abort|timed out|timeout/i.test(m))
    return "The record took too long to answer.";
  if(machineSpeak(m)) return "Something went wrong at the record's end.";
  return m.charAt(0).toUpperCase() + m.slice(1);
}

function readJson(t){
  var txt=String(t||"").trim();
  if(txt.charAt(0)==="<"){
    throw new Error("The booking record is not answering just now.");
  }
  try{ return JSON.parse(txt); }
  catch(e){ throw new Error("The record sent back something unreadable."); }
}


/* ==========================================================================
   WHERE THE BUS IS

   The floor is the timetable. A driver who never taps leaves this page saying
   exactly what it said before the feature existed, which is no worse than
   today. Every tap is an improvement on that floor, never a replacement for
   it. Built that way round on purpose: a page that promises live times and
   then goes quiet is worse than one that never promised, because the message
   in the group at least stopped honestly.

   Visible only once bookings have closed, and only to a phone with a booking.
   ========================================================================== */

var LIVE_POLL = 30000;
var liveTimer = null, liveBusy = false, live = null;

/* Rehearsal only. A phone with no booking of its own is lent a seeded one,
   and this says which route to be lent. Blank means "whichever bus is out",
   which is what a tester wants nine times in ten. A real passenger never
   sets this: they are watching their own stop. */
var liveWant = "";

/* A switch that lands while a poll is in flight used to be swallowed whole:
   liveFetch returned at the door, and the new route waited for the next turn
   of the timer with nothing on screen to say why. Remember it instead and go
   again the moment the one in flight is done. */
var liveAgain=false;
function liveFetch(){
  if(!navigator.onLine) return;
  if(liveBusy){ liveAgain=true; return; }
  liveBusy=true;
  callFetch(ENDPOINT+"?trip=1"+idq()+
            (liveWant? "&r="+encodeURIComponent(liveWant) : "")+
            /* The kerb somebody without a booking said they were standing at.
               Sent only when there is no booking to answer with. */
            (watchStop? "&s="+encodeURIComponent(watchStop) : ""),
            {method:"GET",redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var out=JSON.parse(t);
      liveBusy=false;
      if(liveAgain){ liveAgain=false; liveFetch(); }
      if(!out || out.ok!==true) return;
      live=out;
      paintLive();
      /* Once your own stop has been served there is nothing left to watch,
         so the polling sheds itself as the run goes on rather than peaking
         at the end when the most phones are open. */
      if(out.live===false || out.mine==="served" || out.ended) liveStop();
    })
    .catch(function(){
      liveBusy=false;
      if(liveAgain){ liveAgain=false; liveFetch(); }
    });
}

function liveStart(){
  liveStop();
  gateStop();                       /* watching answers the gate question */
  if(document.hidden) return;
  liveFetch();
  liveTimer=setInterval(function(){
    if(document.hidden){ liveStop(); return; }
    liveFetch();
  },LIVE_POLL);
}
function liveStop(){ if(liveTimer){ clearInterval(liveTimer); liveTimer=null; } }

/* ---- asking again whether it is time to watch --------------------------
   CLOSED and REHEARSAL are the server's answer, and they were learned once,
   at page load, and never revisited. That is the whole of the fault the
   rehearsal exposed, and it is not only a rehearsal fault.

   A passenger who opens this page at nine on a Sunday morning is told
   bookings are open, because they are. The cutoff passes at half past, the
   buses run, and this page sits there showing nothing for the whole morning,
   because the one moment it asked was half an hour before there was anything
   to see. Locking the phone and coming back did not help either: that
   handler tested the same two stale flags.

   So it asks again, slowly, and only from a phone that is actually on screen
   and not already watching. It stops the moment watching starts, which is
   also the moment the passenger most wants the calls spent on the bus. */
var GATE_POLL = 60000;
var gateTimer = null, gateBusy = false;

function gateCheck(){
  if(gateBusy || liveTimer || document.hidden || !navigator.onLine) return;
  gateBusy=true;
  callFetch(ENDPOINT+"?bus=1"+idq(),{method:"GET",redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var out=readJson(t);
      gateBusy=false;
      if(!out || out.ok!==true) return;
      if(!out.closed && !out.rehearsal) return;      /* still not time */
      /* It has just opened. Reload in full rather than patching flags: the
         booking form is closing anyway, the banner above it changes, and the
         stop list becomes the list the driver is working from. Nothing a
         passenger had half-chosen was going to be saved past the cutoff. */
      gateStop();
      load();
    })
    .catch(function(){ gateBusy=false; });
}

function gateStart(){
  gateStop();
  if(document.hidden) return;
  gateTimer=setInterval(function(){
    if(document.hidden){ gateStop(); return; }
    gateCheck();
  },GATE_POLL);
}
function gateStop(){ if(gateTimer){ clearInterval(gateTimer); gateTimer=null; } }

document.addEventListener("visibilitychange",function(){
  if(document.hidden){ liveStop(); gateStop(); return; }
  /* Coming back to the page is the cheapest moment to find out we were
     wrong, so the gate is asked at once rather than waiting out a minute. */
  if(CLOSED || REHEARSAL) liveStart();
  else { gateStart(); gateCheck(); }
});

function paintLive(){
  var box=$("live");
  if(!live || live.live===false){ box.innerHTML=""; return; }

  /* A rehearsal forces the tracking gate open on a weekday, so somebody who
     booked on Thursday would otherwise open this and see a bus running that
     is not. Said first and said plainly. */
  /* The switch exists because a rehearsal used to be lent whichever seeded
     booking came first, which was always North, so the South bus could run
     the whole morning with this page showing nothing. It is on the rehearsal
     banner and nowhere else: a real passenger watches their own stop and is
     never shown anybody else's route. */
  var pick = "";
  if(live.rehearsal && (live.routes||[]).length>1){
    pick='<div class="live-pick">';
    live.routes.forEach(function(rt){
      pick+='<button type="button" class="live-pickbtn'+
            (rt===live.route?' is-on':'')+'" data-liveroute="'+esc(rt)+'">'+
            esc(rt)+'</button>';
    });
    pick+='</div>';
  }

  var banner = live.rehearsal
    ? '<div class="live live-test"><p class="live-eyebrow">Rehearsal</p>'+
      '<p class="live-sub">No bus is running. Your booking still counts for '+
      'Sunday.</p>'+pick+'</div>'
    : "";

  var head="", sub="", cls="";

  /* Who to turn to when somebody has been left at a kerb.

     The coordinator can only apologise. The driver can turn round — he is on
     the road, minutes away, and a message reaches him at the next stop, which
     is exactly when he can read it and still do something about it. A ringing
     phone would fight the rule this app already keeps: nothing is tapped while
     the wheels are turning.

     So the driver first, named, pointing at the button already sitting in the
     bar — not a second button, which is a question nobody needs asked twice.
     The coordinator when there is no number, and always once the run has
     ended, because "come back for me" is not a thing anybody can act on from
     the church car park. */
  /* Set by turnTo when the coordinator is the right person, and rendered
     under the sentence rather than inside it. A phone number buried in prose
     is something to read; a button is something to press. */
  var callBtn = "";
  function turnTo(lead){
    if(DRIVER && DRIVER.wa && live && !live.ended){
      return lead+" <b>Message "+esc(DRIVER.name)+"</b> below.";
    }
    callBtn = callButton();
    /* The lead alone. "Still waiting?" over a button that already says who
       to call and on what number needs no sentence between them. */
    return callBtn ? lead : lead+" Please "+ringCoordinator()+".";
  }

  if(live.mine==="served"){
    /* Two taps, two facts, and they are not the same fact.

       After "Nobody there" nobody at that kerb was collected, so everyone
       booked there is unambiguously still standing: say it plainly. After
       "Picked up" he collected whoever he saw, and most people reading this
       are on the bus — but the one who was thirty seconds up the road is
       reading the identical screen, because the app has never known one
       passenger from another. So that one is asked conditionally. */
    var wasEmpty = live.servedEvent==="empty";
    cls = wasEmpty ? "live-warn" : "live-go";
    head = (wasEmpty ? "Nobody there at " : "Picked up at ")+esc(live.servedAt);
    sub = wasEmpty
      ? "Nobody was waiting at "+esc(live.stop)+". "+turnTo("Still there?")
      : "The bus has been to "+esc(live.stop)+". "+turnTo("Not on it?");
  } else if(live.mine==="passed"){
    /* The bus has been by and this stop was never marked.

       Said carefully, because the record and the road are not always the
       same thing. What is KNOWN is that the bus reached a later stop and that
       no pickup was recorded here. What is likely — nobody was waiting — is
       not certain: a driver can forget to tap. So the page reports the record
       and lets the person draw their own conclusion, rather than telling
       somebody standing in the rain that they were not there.

       turnTo does the rest, and does it correctly for both people who see
       this screen: a booked passenger gets the driver, who can still turn
       round; a watcher who never booked gets the coordinator, because the
       driver's number is not theirs to have. */
    cls="live-warn";
    head="The bus has gone past";
    sub="It was at "+esc(live.passedStop)+" at "+esc(live.passedAtWords)+
        ", and no pickup was recorded at "+esc(live.stop)+". "+
        turnTo("Still waiting?");
  } else if(!live.started){
    head="Not set off yet";
    sub="Timetabled "+esc(live.scheduled)+".";
  } else if(live.mine==="eta" && !live.lastStop){
    /* Away from church, and not a stop marked yet.

       The timetable now carries a departure time, so the run has an honest
       offset from the moment it pulls out — but an arrival time projected
       from that alone, twenty-five minutes ahead of the event, is a guess
       wearing the clothes of a fact. What is actually known is when it left
       and whether that was late, and that is what gets said.

       The countdown starts when the bus has been somewhere. */
    head="On its way";
    sub="Left church"+(live.startedAtWords? " at "+esc(live.startedAtWords) : "")+
        (live.offset>0 ? ", "+live.offset+" minute"+(live.offset===1?"":"s")+" behind"
         : live.offset<0 ? ", "+(-live.offset)+" minute"+(live.offset===-1?"":"s")+" early"
         : ", on time")+
        ". Yours is timetabled "+esc(live.scheduled)+".";
  } else if(live.mine==="eta"){
    cls=live.imminent?"live-go":"";
    head=live.imminent ? "Any moment now"
       : (live.minutes<=0 ? "Due now" : live.minutes+" min");
    sub="About "+esc(live.etaWords)+" at "+esc(live.stop)+
        (live.offset>0 ? " · "+live.offset+" min behind"
         : live.offset<0 ? " · "+(-live.offset)+" min early"
         : " · on time")+
        /* Where it actually is: the thing people open a map for, answered
           without putting a driver's position on a public page. "Left"
           rather than "is at", because that is what the tap means — he marks
           a stop as he pulls away from it. */
        (live.lastStop
          ? ". Left "+esc(live.lastStop)+
            (live.lastAtWords? " "+esc(live.lastAtWords) : "")+"."
          : ".");
  } else if(live.mine==="ended"){
    head="The bus has finished its run";
    /* The coordinator, and only the coordinator. The bus is parked at church
       and the service is starting; there is no coming back from here. */
    sub="Your stop was never marked. Please "+ringCoordinator()+".";
  } else if(!live.lastStop){
    /* Running, and not a stop marked yet.

       This fell through to "No update yet", which was true of the ETA and
       false of everything a passenger actually wanted to know. The first
       Sunday two routes ran, people stood at kerbs from ten past ten with a
       page telling them nothing had happened \u2014 when in fact the bus had
       left church at ten and was on its way to them. The one fact they were
       waiting for was the one fact the page was throwing away.

       No warning colour: a bus that has set off on time is good news. */
    head="On its way";
    sub="Left church"+(live.startedAtWords? " at "+esc(live.startedAtWords) : "")+
        ". Yours is timetabled "+esc(live.scheduled)+".";
  } else {
    /* quiet, wild: it set off, it marked a stop, and then it went silent.
       State the last known fact and stop. A number invented from a stale
       offset is worse than a blank. */
    cls="live-warn";
    head="No update yet";
    sub="Last seen at "+esc(live.lastStop)+", "+esc(live.lastAtWords)+
        ". Yours is timetabled "+esc(live.scheduled)+".";
  }

  /* "Your stop" is a claim about a seat. Somebody who is only watching a kerb
     has not booked one, and the page should not imply otherwise. */
  var eyebrow = ROLLED ? "Today\u2019s bus"
              : live.watching ? "Watching "+esc(live.stop)
              : "Your stop";

  box.innerHTML=banner+'<div class="live '+cls+'">'+
    '<p class="live-eyebrow">'+eyebrow+'</p>'+
    '<p class="live-big">'+head+'</p>'+
    '<p class="live-sub">'+sub+'</p>'+
    callBtn+
    (live.watching
      ? '<p class="live-sub" style="margin-top:8px">'+
        '<button type="button" class="ring" id="watchOff" '+
        'style="background:none;border:none;padding:0;font:inherit;color:inherit">'+
        'Watching the wrong stop?</button></p>'
      : '')+
    '</div>';

  Array.prototype.forEach.call(box.querySelectorAll("[data-liveroute]"),function(b){
    b.addEventListener("click",function(){
      liveWant=this.getAttribute("data-liveroute");
      liveFetch();
    });
  });
  if($("watchOff")) $("watchOff").addEventListener("click",function(){
    watchStop=""; watchSave(""); live=null; paintLive(); paint();
  });

  /* The bar carries the Message button, and what it should say depends on
     what has just been painted here. paintLive is reached from the poll,
     which does not otherwise repaint the bar, so the two would drift: the
     button would keep a neutral opener through a stop that had been and gone,
     and would still be there after the run ended. */
  paintBar();
}

function stopById(id){
  for(var i=0;i<STOPS.length;i++) if(STOPS[i].id===id) return STOPS[i];
  return null;
}
function seatsOn(rt){
  var n=0;
  STOPS.forEach(function(s){ if(s.route===rt) n+=(COUNTS[s.id]||0); });
  return n;
}
function activeOn(rt){
  var n=0;
  STOPS.forEach(function(s){ if(s.route===rt && (COUNTS[s.id]||0)>0) n++; });
  return n;
}

function paint(){
  var html="";

  /* Their seat was at a stop that has since been withdrawn. First thing on
     the screen, because everything below it is now about a different
     journey. */
  if(STOPGONE){
    html+='<div class="note note-warn"><b>Your stop has been taken off the '+
          'timetable.</b> '+(CLOSED ? 'Tell the group.' : 'Please pick another one below.')+
          '</div>';
  }

  if(CLOSED){
    /* The whole of Sunday morning now sits here: bookings shut at 09:30 and
       the page stays on today until the buses are back. It is the list the
       driver is working from, which is the one worth showing somebody who is
       waiting.

       What it says depends on whether this phone is ON that list. Telling
       somebody with a seat to "tell the group directly" was true when the
       page could do nothing for them; it is not true now, and a screen that
       sends people to WhatsApp for something there is a button for is the
       same fault as the one that told them to tap a locked stop. */
    html+='<div class="note note-warn"><b>Bookings have closed.</b>'+
          (booked ? '' : ' If you need a seat today, tell the group.')+
          '</div>';

    /* Waiting, but this phone holds no booking. Almost always because the
       booking was made somewhere else — a laptop, a phone that has since
       cleared its storage, one that was reinstalled — and occasionally
       because somebody is simply thinking of walking down to the stop.

       All three want the same thing, and none of them needs to be identified
       to have it. Tap the kerb you are standing at and follow the bus from
       there. It is not a seat and does not pretend to be. */
    if(!booked && !watchStop){
      html+='<div class="note"><b>Waiting for the bus?</b> Tap your stop to '+
            'follow it. This does not book a seat.</div>';
    }
  } else if(ROLLED){
    /* Two different Sundays are on this screen at once: the bus running now,
       up in the live panel, and the one below that is open for booking. Said
       plainly, because a passenger watching today's bus and then tapping a
       stop underneath it would reasonably think they were changing today. */
    html+='<div class="note note-warn"><b>Today\u2019s buses are back.</b> '+
          'Everything below is for <b>'+esc(prettyDate(DATE))+'</b>.</div>';
  }

  if(!CLOSED){
    if(booked && !dirty()){
      /* What this screen will actually do, and nothing it will not.
         It used to say "Tap a different stop to move", which stopped being
         true the day the stop was settled at Confirm: every other stop is
         disabled from here on, so the instruction sent people tapping at
         dead buttons with no way to tell a locked screen from a broken one.
         The bar at the foot has said the right thing throughout. These two
         now agree, and both name the same two ways out. */
      /* Four words. It carried an instruction for a while \u2014 tap another stop
         to move, Not coming to give it up \u2014 both true and neither needed:
         the stops are right there and the button says what it is. */
      html+='<div class="note note-go"><b>You are booked.</b></div>';
    }
    /* There used to be a warning here, and then a line at the foot, telling
       anybody without a booking on this device that booking now would add a
       SECOND seat if they had already booked somewhere else. It was true, and
       it was the wrong answer to it: a page that cannot tell one person from
       another, apologising in advance for what it was about to get wrong.

       There is nothing to warn about now. A booking belongs to a number, the
       number is asked for before a seat is taken, and a second device finds
       the first device's booking instead of adding to it. */
  }

  /* Route tabs, each carrying its own summary so you can see where the bus
     is busy without opening the other one. */
  if(ROUTES.length>1){
    html+='<div class="tabs" role="tablist">';
    ROUTES.forEach(function(rt){
      var n=seatsOn(rt);
      html+='<button class="tab'+(rt===route?' is-active':'')+'" type="button" role="tab" '+
            'aria-selected="'+(rt===route)+'" data-route="'+esc(rt)+'">'+esc(rt)+
            '<small>'+(n? n+(n===1?' person':' people') : 'Nobody yet')+'</small></button>';
    });
    html+='</div>';
  }

  var mine=STOPS.filter(function(s){ return s.route===route; });
  var active=activeOn(route), total=seatsOn(route);
  html+='<p class="summary"><b>'+esc(route)+' Liverpool</b> · '+mine.length+' stops · '+
        (total? '<b>'+active+'</b> with people, <b>'+total+'</b> booked'
              : 'nobody booked yet')+'</p>';

  /* Stops used to lock the moment a booking existed, and there was a good
     reason for it. A tap on another kerb did not MOVE anything: the record
     knew this browser and not this person, so a second device tapping a stop
     made a second booking, and refusing the tap was the only safe answer
     available. The lock was there to protect the app from its own identity.

     A booking belongs to a number now, so that tap moves the one row the
     person holds. There is nothing left to protect and the lock goes.

     A passenger still does not change kerb from one week to the next. This is
     for the morning somebody is setting off from their sister's, and for the
     mis-tap, which used to cost a withdrawal and a fresh booking. */

  /* After the cutoff a phone with no booking may still tap a stop \u2014 not to
     book it, which is shut, but to say that is the kerb it is standing at.
     Its own attribute, so nothing about the booking path is touched. */
  var picking = CLOSED && !booked;

  mine.forEach(function(s){
    var n=COUNTS[s.id]||0;
    var on = picking ? (watchStop===s.id) : (chosen===s.id);
    var attr = picking ? 'data-watch="'+esc(s.id)+'"' : 'data-stop="'+esc(s.id)+'"';
    var dead = picking ? false : CLOSED;
    html+='<button class="stop'+(on?' is-on':'')+
            '" type="button" '+attr+
            (dead?' disabled':'')+' aria-pressed="'+on+'">'+
            '<span class="stop-time">'+esc(s.time)+'</span>'+
            '<span class="stop-body">'+
              '<span class="stop-name">'+esc(s.stop)+'</span>'+
              (s.postcode?'<span class="stop-pc">'+esc(s.postcode)+'</span>':'')+
              '<span class="stop-n'+(n?' has':'')+'">'+
                (n? n+(n===1?' person':' people')+' booked' : 'Nobody booked yet')+'</span>'+
            '</span>'+
            /* A tick means done. Before the cutoff that is exactly right:
               the stop is booked, the job is finished.

               After it, the same mark means something else entirely — "this
               is the kerb I am standing at" — and it was still a tick. So a
               watcher whose panel said THE BUS HAS GONE PAST was looking, an
               inch below, at his own stop wearing a green tick. The screen
               contradicted itself, and the more reassuring half was the one
               that was wrong.

               A dot selects. A tick completes. */
            '<span class="tick'+(picking?" tick-watch":"")+'">'+
              (on?(picking?"\u25CF":"\u2713"):"")+'</span>'+
          '</button>';
  });

  var arr=ARRIVALS.filter(function(s){ return !s.route || s.route===route; });
  if(!arr.length) arr=ARRIVALS;
  if(arr.length){
    html+='<div class="group-label">Arriving at church</div>';
    arr.forEach(function(s){
      html+='<div class="stop stop-arrival">'+
              '<span class="stop-time">'+esc(s.time)+'</span>'+
              '<span class="stop-body"><span class="stop-name">'+esc(s.stop)+'</span>'+
              (s.postcode?'<span class="stop-pc">'+esc(s.postcode)+'</span>':'')+'</span>'+
            '</div>';
    });
  }

  /* The question sits here, last, immediately above the fixed Confirm bar.

     It used to sit under the stop list, which on the North route is ten
     stops long, so it was off the bottom of the screen. Confirm is fixed and
     came alive the moment a stop was tapped, which meant a passenger could
     pick his kerb, see Confirm sitting there ready, and complete a booking
     for a number he had never seen, let alone chosen.

     Plus and minus, which is what this was originally and what he prefers.
     It starts EMPTY, though, which the first version did not: it opened at 1,
     and that one is the whole reason this box was rebuilt. A number already
     sitting there is an answer nobody gave, Confirm goes live behind it, and
     a booking for one completes without the question ever being read. An
     unanswered question must look unanswered.

     So: no figure until plus is pressed, minus dead until there is something
     to take away, and Confirm dead until a number exists. Minus stops at one
     rather than emptying the box again — once it has been answered there is
     no sense in a way back to unanswered. */
  if(chosen && !CLOSED && !cancelAsk){
    var n = seats || 0;
    html+='<div class="seats'+(seats?'':' is-asking')+'" id="seatsBox">'+
          '<h2>How many of you?</h2>'+
          '<p>Including yourself.</p>'+
          '<div class="stepper">'+
            '<button type="button" class="step" id="seatsDown"'+
              (n<=1?' disabled':'')+' aria-label="One fewer">\u2212</button>'+
            '<span class="stepval" id="seatsVal" aria-live="polite">'+
              (seats? String(seats) : "\u2014")+'</span>'+
            '<button type="button" class="step" id="seatsUp"'+
              (n>=12?' disabled':'')+' aria-label="One more">+</button>'+
          '</div>'+
          '</div>';
  }

  /* Withdrawing. Asked every time now, on both sides of the cutoff.

     What it says is not the same on both sides, and that is the whole point
     of asking twice rather than once. After the cutoff it cannot be taken
     back: the seat leaves the driver's screen and there is no booking again
     today. Before it, nothing is lost that two taps will not restore, and a
     question that borrowed the later wording would be frightening somebody
     out of a decision that costs them nothing. Same question, honest answer
     in each case. */
  if(booked && cancelAsk){
    html+='<div class="seats is-asking" id="cancelBox">'+
          '<h2>'+(CLOSED? 'Not coming today?' : 'Not coming?')+'</h2>'+
          '<p>'+(CLOSED
            ? 'You cannot book again today.'
            : 'You can book again before '+esc(CUTOFF||"Sunday 09:30")+'.')+'</p>'+
          '<div class="cancel-row">'+
            '<button type="button" class="btn btn-keep" id="cancelNo">Keep my seat</button>'+
            '<button type="button" class="btn btn-drop" id="cancelYes">Yes, I am not coming</button>'+
          '</div></div>';
  }

  $("body").innerHTML=html;

  /* innerHTML rather than textContent, because the closing time is the one
     thing down here somebody actually has to read. CUTOFF comes from the
     script rather than from anybody typing, but it is escaped anyway: this
     is the only place on the page that writes a server value as markup. */
  $("foot").innerHTML = (CLOSED
    ? "The Sunday bus for RCCG Dominion Assembly Liverpool."
    : "<b>Bookings close "+esc(CUTOFF||"Sunday 09:30")+".</b>")+
    identityFoot()+
    /* Not offered to a phone that already has it. */
    (standalone() ? "" : "<br>"+idBtn("idInstall","Add to your phone"))+
    '<span class="foot-ver">'+esc(PAGE_VERSION)+'</span>';
  wireIdentityFoot();

  Array.prototype.forEach.call(document.querySelectorAll("[data-route]"),function(b){
    b.addEventListener("click",function(){
      route=this.getAttribute("data-route"); paint();
    });
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-stop]"),function(b){
    b.addEventListener("click",function(){
      var id=this.getAttribute("data-stop");
      /* The first reach for a seat on a device that has not said who it is.
         The question comes up here rather than on the way in, because most
         people opening this page are reading the times and have no business
         being asked for anything. */
      if(!PID){ askThenTap(id); return; }
      tapStop(id);
    });
  });
  /* Choosing a kerb to watch. Books nothing, sends nothing, and asks for
     nothing: it only tells this page which stop to follow. */
  Array.prototype.forEach.call(document.querySelectorAll("[data-watch]"),function(b){
    b.addEventListener("click",function(){
      var id=this.getAttribute("data-watch");
      watchStop = (watchStop===id) ? "" : id;
      watchSave(watchStop);
      live=null; paintLive();
      paint();
      if(watchStop) liveStart();
    });
  });
  /* Clamped at both ends here as well as on the buttons' disabled state, so
     a fast double tap on the last one cannot push it past 12 or under 1. */
  if($("seatsUp")) $("seatsUp").addEventListener("click",function(){
    seats = Math.min(12, (seats||0) + 1);
