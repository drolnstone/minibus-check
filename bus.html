<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sunday Bus</title>

<!--
  The passenger page. Deliberately separate from the driver app.

  A passenger never sees inspections, defects, the rota, PINs or anything
  else. This page loads a list of stops and sends back one line: a stop, and
  how many people are boarding there.

  It holds no names, no phone numbers and no driver token. The only thing
  kept on the phone is a random handle it makes up for itself, so somebody
  can come back and change their own booking. That handle means nothing to
  anybody else and identifies no one.

  The link carries a code for one Sunday. Next week's link is a different
  code, and an old one stops working, so a link that ends up somewhere it
  should not have gone is dead within the week.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --ink:#16191F; --muted:#5C6672; --paper:#FFFFFF; --wash:#F4F5F6;
  --hair:#DFE3E7; --steel:#1B3A57; --go:#2E7D5B; --go-bg:#E8F3ED;
  --warn:#8A6116; --warn-bg:#FBF3E2;
  --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  --safe-l:env(safe-area-inset-left); --safe-r:env(safe-area-inset-right);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--wash);color:var(--ink);
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:16px;line-height:1.5;
  padding:calc(16px + var(--safe-t)) calc(14px + var(--safe-r)) calc(120px + var(--safe-b)) calc(14px + var(--safe-l))}
.wrap{max-width:640px;margin:0 auto}
.eyebrow{font-family:"Barlow Condensed",sans-serif;font-size:13px;font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
h1{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:700;
  line-height:1.05;margin:0 0 4px}
.when{font-size:17px;font-weight:600;color:var(--steel);margin:0 0 18px}
.lede{color:var(--muted);margin:0 0 16px}

.route{font-family:"Barlow Condensed",sans-serif;font-size:14px;font-weight:700;
  letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}

.stop{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--paper);border:1px solid var(--hair);border-radius:11px;
  padding:13px;margin-bottom:9px;cursor:pointer;font:inherit;color:inherit}
.stop.is-on{border-color:var(--go);background:var(--go-bg);box-shadow:0 0 0 1px var(--go) inset}
.stop-time{flex:0 0 54px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--steel)}
.stop-body{flex:1;min-width:0}
.stop-name{font-weight:600}
.stop-pc{font-size:13px;color:var(--muted);margin-top:2px}
.stop-count{font-size:13px;color:var(--muted);margin-top:4px}
.tick{flex:0 0 22px;font-weight:700;color:var(--go);font-size:19px;line-height:1.2}

.seats{background:var(--paper);border:1px solid var(--hair);border-radius:11px;
  padding:14px;margin:16px 0}
.seats h2{font-family:"Barlow Condensed",sans-serif;font-size:19px;margin:0 0 4px}
.seats p{margin:0 0 12px;color:var(--muted);font-size:14px}
.counter{display:flex;align-items:center;gap:14px}
.counter button{width:52px;height:52px;border-radius:11px;border:1px solid var(--hair);
  background:var(--wash);font-size:26px;font-weight:700;color:var(--ink);cursor:pointer;line-height:1}
.counter button:disabled{opacity:.35;cursor:default}
.counter .n{font-size:30px;font-weight:700;min-width:48px;text-align:center;font-variant-numeric:tabular-nums}

.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(244,245,246,.97);
  border-top:1px solid var(--hair);backdrop-filter:blur(8px);
  padding:12px calc(14px + var(--safe-r)) calc(12px + var(--safe-b)) calc(14px + var(--safe-l))}
.bar-in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;padding:15px;border-radius:11px;border:0;cursor:pointer;
  font-family:"Barlow Condensed",sans-serif;font-size:17px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase}
.btn-main{background:var(--steel);color:#fff}
.btn-main:disabled{background:#AEB6BE;cursor:default}
.btn-ghost{flex:0 0 auto;background:var(--paper);color:var(--ink);border:1px solid var(--hair)}

.note{border-radius:10px;padding:12px 13px;font-size:14px;line-height:1.45;margin:0 0 16px}
.note-warn{background:var(--warn-bg);border:1px solid #EBD3A8;color:var(--ink)}
.note-go{background:var(--go-bg);border:1px solid #B7D8C6;color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%) translateY(14px);
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:9px;font-size:14px;
  opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
.toast.is-on{opacity:1;transform:translateX(-50%) translateY(0)}
.foot{margin-top:26px;color:var(--muted);font-size:13px;line-height:1.5}
.spin{display:inline-block;width:15px;height:15px;border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="wrap">
  <p class="eyebrow">Dominion Assembly</p>
  <h1>Sunday Bus</h1>
  <p class="when" id="when"></p>
  <div id="notice"></div>
  <div id="body"><p class="lede">Loading the stops...</p></div>
  <p class="foot" id="foot"></p>
</div>

<div class="bar" id="bar" style="display:none">
  <div class="bar-in">
    <button class="btn btn-ghost" id="cancel" type="button">Not coming</button>
    <button class="btn btn-main" id="save" type="button">Confirm</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
"use strict";

var ENDPOINT = "https://script.google.com/macros/s/AKfycbxS-2KqOjCWCwTkoNWgOOsB-TfGYShkSkvQJC6ItfpGINj7DJ6CRYuTxpXQip1R1XxMSA/exec";

var $ = function(id){ return document.getElementById(id); };
function esc(x){ return String(x==null?"":x).replace(/[&<>"']/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

var toastTimer;
function toast(msg){
  var t=$("toast"); t.textContent=msg; t.classList.add("is-on");
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove("is-on"); },3200);
}

/* The link tells us which Sunday and carries that Sunday's code. */
var qs = new URLSearchParams(location.search);
var DATE = qs.get("d") || "";
var CODE = qs.get("k") || "";

/* A handle this phone makes up for itself, so somebody can come back and
   change their booking. It is random, it is not sent anywhere except with
   their own booking, and it says nothing about who they are. */
function deviceRef(){
  var k="bus.ref.v1", v="";
  try{ v=localStorage.getItem(k)||""; }catch(e){}
  if(!v){
    v = "d" + Math.random().toString(36).slice(2,10) + Math.random().toString(36).slice(2,10);
    try{ localStorage.setItem(k,v); }catch(e){}
  }
  return v;
}
var REF = deviceRef();

var STOPS=[], COUNTS={}, CLOSED=false, chosen=null, seats=1, saving=false;

function prettyDate(key){
  var p=String(key).split("-");
  if(p.length!==3) return "";
  var d=new Date(+p[0],+p[1]-1,+p[2]);
  return d.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
}

function load(){
  if(!DATE || !CODE){
    $("body").innerHTML='<div class="note note-warn">This link is incomplete. '+
      'Please use the link exactly as it was posted in the group.</div>';
    return;
  }
  var url = ENDPOINT+"?bus=1&d="+encodeURIComponent(DATE)+"&k="+encodeURIComponent(CODE)+
            "&ref="+encodeURIComponent(REF);
  fetch(url,{method:"GET",redirect:"follow"})
    .then(function(r){ return r.text(); })
    .then(function(t){
      var out=JSON.parse(t);
      if(!out || out.ok!==true) throw new Error(out && out.error ? out.error : "unavailable");
      STOPS=out.stops||[]; COUNTS=out.counts||{}; CLOSED=!!out.closed;
      if(out.mine){ chosen=out.mine.stopId; seats=out.mine.seats||1; }
      $("when").textContent = prettyDate(out.date);
      paint(out.arrivals||[]);
    })
    .catch(function(err){
      $("body").innerHTML='<div class="note note-warn">'+esc(String(err.message||err))+
        '<br><br>If this link came from an earlier week, ask for the current one.</div>';
    });
}

function paint(arrivals){
  var html="";

  if(CLOSED){
    html+='<div class="note note-warn"><b>Bookings have closed for this Sunday.</b> '+
          'You can still see the times below. If your plans have changed, '+
          'please tell the group, because the driver already has this list.</div>';
  } else if(chosen){
    html+='<div class="note note-go"><b>You are booked.</b> '+
          'Tap a different stop to move, or use Not coming below.</div>';
  } else {
    html+='<p class="lede">Tap the stop where you will be boarding.</p>';
  }

  ["North","South"].forEach(function(route){
    var mine=STOPS.filter(function(s){ return s.route===route; });
    if(!mine.length) return;
    html+='<div class="route">'+esc(route)+' Liverpool</div>';
    mine.forEach(function(s){
      var n=COUNTS[s.id]||0;
      var on=(chosen===s.id);
      html+='<button class="stop'+(on?' is-on':'')+'" type="button" data-stop="'+esc(s.id)+'"'+
              (CLOSED?' disabled':'')+'>'+
              '<span class="stop-time">'+esc(s.time)+'</span>'+
              '<span class="stop-body">'+
                '<span class="stop-name">'+esc(s.stop)+'</span>'+
                (s.postcode?'<span class="stop-pc">'+esc(s.postcode)+'</span>':'')+
                '<span class="stop-count">'+(n?(n+(n===1?" person":" people")+" booked so far"):"Nobody booked yet")+'</span>'+
              '</span>'+
              '<span class="tick">'+(on?"\u2713":"")+'</span>'+
            '</button>';
    });
  });

  if(chosen && !CLOSED){
    html+='<div class="seats"><h2>How many of you?</h2>'+
          '<p>Count everyone boarding with you at that stop, including yourself.</p>'+
          '<div class="counter">'+
            '<button type="button" id="less" aria-label="fewer">&minus;</button>'+
            '<span class="n" id="n">'+seats+'</span>'+
            '<button type="button" id="more" aria-label="more">+</button>'+
          '</div></div>';
  }

  if(arrivals.length){
    html+='<div class="route">Arriving</div>';
    arrivals.forEach(function(s){
      html+='<div class="stop" style="cursor:default">'+
              '<span class="stop-time">'+esc(s.time)+'</span>'+
              '<span class="stop-body"><span class="stop-name">'+esc(s.stop)+'</span>'+
              (s.postcode?'<span class="stop-pc">'+esc(s.postcode)+'</span>':'')+'</span>'+
            '</div>';
    });
  }

  $("body").innerHTML=html;
  $("foot").textContent = CLOSED
    ? "This page shows the Sunday bus times for Dominion Assembly."
    : "Bookings close at 9:30 on Sunday morning, before the buses set off. Nothing here records your name or number, only how many are boarding at each stop.";

  Array.prototype.forEach.call(document.querySelectorAll("[data-stop]"),function(b){
    b.addEventListener("click",function(){
      var id=this.getAttribute("data-stop");
      chosen = (chosen===id) ? null : id;
      if(chosen && !seats) seats=1;
      paint(arrivals);
    });
  });
  if($("less")) $("less").addEventListener("click",function(){ if(seats>1){seats--; $("n").textContent=seats;} });
  if($("more")) $("more").addEventListener("click",function(){ if(seats<12){seats++; $("n").textContent=seats;} });

  $("bar").style.display = CLOSED ? "none" : "";
  $("save").disabled = !chosen || saving;
  $("cancel").style.display = chosen ? "" : "none";
}

function send(payload, done){
  saving=true; $("save").disabled=true;
  fetch(ENDPOINT,{
    method:"POST", redirect:"follow",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({ action:"booking", booking: payload })
  }).then(function(r){ return r.text(); }).then(function(t){
    var out=JSON.parse(t);
    saving=false;
    if(!out || out.ok!==true) throw new Error(out && out.error ? out.error : "not saved");
    done();
  }).catch(function(err){
    saving=false; $("save").disabled=false;
    toast(String(err.message||err));
  });
}

$("save").addEventListener("click",function(){
  if(!chosen) return;
  $("save").innerHTML='<span class="spin"></span>';
  send({ date:DATE, code:CODE, ref:REF, stopId:chosen, seats:seats }, function(){
    $("save").textContent="Confirm";
    toast("Booked. You can change this until 9:30 on Sunday morning.");
    load();
  });
});

$("cancel").addEventListener("click",function(){
  send({ date:DATE, code:CODE, ref:REF, stopId:"", seats:0 }, function(){
    chosen=null; seats=1;
    toast("Cancelled. The bus will not wait for you.");
    load();
  });
});

load();
</script>
</body>
</html>
